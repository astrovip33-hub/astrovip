<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#030604">
<title>Raport personal · AstroVip Premium</title>
<link rel="stylesheet" href="/assets/astrovip-design-system-v9.css">
<style>
body{margin:0;background:#020403;color:#fffdf5;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(980px,calc(100% - 24px));margin:auto;padding:20px 0 60px}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.actions a,.actions button{border:1px solid #39ff76;border-radius:10px;background:#07110b;color:#39ff76;padding:9px 12px;font-weight:850;text-decoration:none;cursor:pointer}.paper{background:linear-gradient(180deg,#0a120c,#050806);border:1px solid rgba(231,201,99,.38);border-radius:20px;padding:28px;box-shadow:0 30px 90px #000a}.r-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid rgba(231,201,99,.25);padding-bottom:18px}.r-kicker{font-size:10px;letter-spacing:1.5px;color:#39ff76;font-weight:900}.r-head h1{font-size:clamp(28px,5vw,46px);margin:5px 0 7px;color:#ffeaa0}.r-head p{margin:0;color:#aab5ad}.r-mark{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#fff1aa,#cfa83c 50%,#39ff76);color:#051008;font-size:28px;font-weight:950}.r-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.r-meta div{border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px}.r-meta span{display:block;color:#7f8d84;font-size:9px;text-transform:uppercase}.r-meta strong{display:block;margin-top:5px;font-size:12px}.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.r-grid article{border:1px solid rgba(231,201,99,.2);border-radius:15px;padding:14px}.r-grid h2{margin:0 0 10px;color:#ffeaa0}.r-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}.r-row:first-of-type{border-top:0}.r-row span{color:#c3ccc6}.r-note{margin-top:14px;border-left:3px solid #39ff76;padding:11px 14px;background:rgba(57,255,118,.035)}.r-note p{color:#b0bbb4;line-height:1.55;margin:5px 0}footer{margin-top:24px;padding-top:12px;border-top:1px solid rgba(231,201,99,.2);color:#758279;font-size:10px;text-align:center}.empty{border:1px dashed #315d40;border-radius:18px;padding:50px 20px;text-align:center;color:#9ba79f}.empty a{color:#39ff76}@media(max-width:720px){.r-meta,.r-grid{grid-template-columns:1fr}.r-head{align-items:center}.r-mark{width:58px;height:58px;border-radius:16px;font-size:22px}.paper{padding:18px}}@media print{body{background:#fff;color:#111}.shell{width:100%;padding:0}.actions,.av-concierge,#av-v9-webgl{display:none!important}.paper{border:0;box-shadow:none;background:#fff;color:#111;border-radius:0;padding:12mm}.r-head h1,.r-grid h2{color:#8a6d10}.r-kicker{color:#17652d}.r-head p,.r-row span,.r-note p,.r-meta span,footer{color:#555}.r-grid article,.r-meta div{border-color:#ddd}.r-row{border-color:#eee}.r-note{border-color:#17652d;background:#f8fbf8}@page{size:A4;margin:8mm}}
</style>
</head>
<body>
<main class="shell">
  <div class="actions" id="report-actions"><a href="/calculator/">← Calculator</a><button id="print-report" type="button">Salvează / tipărește PDF</button></div>
  <section id="report-content" class="paper"></section>
  <section id="report-empty" class="empty" hidden><h1>Raportul nu este încă pregătit</h1><p>Generează mai întâi o hartă în calculatorul AstroVip.</p><a href="/calculator/">Deschide calculatorul →</a></section>
</main>
<script type="module" src="/assets/premium-v9/report.js"></script>
</body>
</html>
