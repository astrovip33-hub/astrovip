<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AstroVip – Preview fără chenare</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
#site{display:block;width:100%;height:100dvh;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="site" src="/?borderless-preview=1" title="AstroVip preview fără chenare"></iframe>
<script>
(function(){
  const frame=document.getElementById('site');
  const css=`
@media (max-width:820px){
  html body:not(.guide-page) .top,
  html body:not(.guide-page) .planet-strip,
  html body:not(.guide-page) section,
  html body:not(.guide-page) footer,
  html body:not(.guide-page) .menu,
  html body:not(.guide-page) .hamb,
  html body:not(.guide-page) [class*="card"],
  html body:not(.guide-page) [class*="Card"],
  html body:not(.guide-page) [class*="box"],
  html body:not(.guide-page) [class*="Box"],
  html body:not(.guide-page) [class*="panel"],
  html body:not(.guide-page) [class*="Panel"],
  html body:not(.guide-page) [class*="frame"],
  html body:not(.guide-page) [class*="Frame"],
  html body:not(.guide-page) [class*="tile"],
  html body:not(.guide-page) [class*="Tile"],
  html body:not(.guide-page) [class*="ribbon"],
  html body:not(.guide-page) [class*="Ribbon"],
  html body:not(.guide-page) [class*="strip"],
  html body:not(.guide-page) [class*="Strip"],
  html body:not(.guide-page) [class*="banner"],
  html body:not(.guide-page) [class*="Banner"]{
    border-color:transparent!important;
    border-top-color:transparent!important;
    border-right-color:transparent!important;
    border-bottom-color:transparent!important;
    border-left-color:transparent!important;
    outline:none!important;
  }

  html body:not(.guide-page) [class*="card"],
  html body:not(.guide-page) [class*="Card"],
  html body:not(.guide-page) [class*="box"],
  html body:not(.guide-page) [class*="Box"],
  html body:not(.guide-page) [class*="panel"],
  html body:not(.guide-page) [class*="Panel"]{
    box-shadow:0 10px 30px rgba(0,0,0,.16)!important;
  }

  html body:not(.guide-page) .freeq-home,
  html body:not(.guide-page) .freeq-home-card,
  html body:not(.guide-page) .av-premium-trust-ribbon,
  html body:not(.guide-page) .av-hero-image-service-cards,
  html body:not(.guide-page) .interest-card,
  html body:not(.guide-page) .case-card,
  html body:not(.guide-page) .service-card,
  html body:not(.guide-page) .trust-card{
    border:none!important;
    outline:none!important;
  }

  html body:not(.guide-page) .top,
  html body:not(.guide-page) .planet-strip,
  html body:not(.guide-page) section.hero.av-hero-v2 + section.freeq-home{
    border-top:none!important;
    border-bottom:none!important;
  }

  html body:not(.guide-page) .language-switcher,
  html body:not(.guide-page) .language-picker,
  html body:not(.guide-page) [class*="language"],
  html body:not(.guide-page) [class*="lang-"],
  html body:not(.guide-page) [class*="chat"]{
    outline:none!important;
  }

  html body:not(.guide-page) .language-switcher,
  html body:not(.guide-page) .language-picker,
  html body:not(.guide-page) [class*="language"][role="button"],
  html body:not(.guide-page) [class*="chat"][role="button"]{
    border:none!important;
    box-shadow:none!important;
  }
}
`;
  function apply(){
    try{
      const d=frame.contentDocument;
      if(!d || !d.head) return;
      let s=d.getElementById('astrovip-borderless-preview-v2');
      if(!s){
        s=d.createElement('style');
        s.id='astrovip-borderless-preview-v2';
        s.textContent=css;
        d.head.appendChild(s);
      }
    }catch(e){}
  }
  frame.addEventListener('load',function(){apply();setTimeout(apply,300);setTimeout(apply,1200);});
})();
</script>
</body>
</html>
