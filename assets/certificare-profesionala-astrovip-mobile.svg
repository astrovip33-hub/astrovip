<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
<title id="title">Certificare Profesională AstroVip</title>
<desc id="desc">Cristian Cătălin Smaranda — Astrolog certificat, COR 516101. Certificat de absolvire cu recunoaștere națională, emis în conformitate cu O.G. nr. 129/2000. Program autorizat, 50 ore, 2014.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020504"/><stop offset=".5" stop-color="#07160e"/><stop offset="1" stop-color="#010302"/></linearGradient>
 <radialGradient id="e" cx=".5" cy="0" r="1"><stop stop-color="#0d482f" stop-opacity=".6"/><stop offset=".65" stop-color="#05261a" stop-opacity=".1"/><stop offset="1" stop-opacity="0"/></radialGradient>
 <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8d641d"/><stop offset=".2" stop-color="#f4d978"/><stop offset=".5" stop-color="#fff0ae"/><stop offset=".8" stop-color="#d4a83d"/><stop offset="1" stop-color="#785116"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="stars" width="90" height="76" patternUnits="userSpaceOnUse"><circle cx="12" cy="16" r="1" fill="#ffe49a" opacity=".58"/><circle cx="67" cy="52" r=".8" fill="#adffd0" opacity=".45"/></pattern>
</defs>
<rect x="7" y="7" width="706" height="906" rx="34" fill="url(#bg)" stroke="url(#g)" stroke-width="4"/>
<rect x="16" y="16" width="688" height="888" rx="28" fill="url(#e)"/>
<rect x="16" y="16" width="688" height="888" rx="28" fill="url(#stars)" opacity=".5"/>
<!-- seal -->
<g transform="translate(360 160)">
 <circle r="104" fill="#03110b" stroke="url(#g)" stroke-width="3"/>
 <circle r="82" fill="none" stroke="#cda63d" stroke-width="1.5" opacity=".8"/>
 <circle r="65" fill="#052217" stroke="#2a8f5b"/>
 <path d="M-24-34 H24 Q34-34 34-24 V34 Q34 44 24 44 H-24 Q-34 44-34 34 V-24 Q-34-34-24-34Z" fill="none" stroke="#f4d978" stroke-width="5"/>
 <path d="M-18-12 H18 M-18 3 H18 M-18 18 H11" stroke="#f4d978" stroke-width="4" stroke-linecap="round"/>
 <circle cy="48" r="23" fill="#0a2a1c" stroke="#f4d978" stroke-width="4"/>
 <path d="M0 33 L5 43 L16 45 L8 53 L10 64 L0 59 L-10 64 L-8 53 L-16 45 L-5 43Z" fill="#f4d978"/>
</g>
<text x="360" y="315" text-anchor="middle" fill="#f4d978" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700">Certificare</text>
<text x="360" y="365" text-anchor="middle" fill="#f4d978" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700">Profesională</text>
<path d="M92 394 H628" stroke="url(#g)" stroke-width="1.5"/><circle cx="360" cy="394" r="4" fill="#fff0ae"/>
<text x="360" y="446" text-anchor="middle" fill="#fffaf0" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700">Cristian Cătălin Smaranda</text>
<text x="360" y="496" text-anchor="middle" fill="#f2cf69" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">Astrolog certificat</text>
<text x="360" y="535" text-anchor="middle" fill="#f2cf69" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">COR 516101</text>
<text x="360" y="587" text-anchor="middle" fill="#eff5ef" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Certificat de absolvire cu</text>
<text x="360" y="618" text-anchor="middle" fill="#eff5ef" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">recunoaștere națională</text>
<text x="360" y="654" text-anchor="middle" fill="#dbe5dd" font-family="Inter, Arial, sans-serif" font-size="19">emis în conformitate cu O.G. nr. 129/2000</text>
<g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">
 <rect x="90" y="692" width="196" height="44" rx="22" fill="#0c1a12" stroke="#8c7437"/><text x="188" y="720" text-anchor="middle" fill="#f1d77f">Program autorizat</text>
 <rect x="300" y="692" width="112" height="44" rx="22" fill="#0c1a12" stroke="#8c7437"/><text x="356" y="720" text-anchor="middle" fill="#edf3ee">50 ore</text>
 <rect x="426" y="692" width="104" height="44" rx="22" fill="#0c1a12" stroke="#8c7437"/><text x="478" y="720" text-anchor="middle" fill="#edf3ee">2014</text>
</g>
<g transform="translate(210 770)">
 <rect width="300" height="70" rx="35" fill="#04140d" stroke="url(#g)" stroke-width="2"/>
 <circle cx="45" cy="35" r="21" fill="#07351f" stroke="#49f08c" stroke-width="2" filter="url(#glow)"/>
 <path d="M34 35 L41 43 L56 27" fill="none" stroke="#75ffad" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="84" y="43" fill="#f2d77a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="4">VERIFICAT</text>
</g>
<text x="360" y="875" text-anchor="middle" fill="#c9d4cc" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16">Formare profesională recunoscută oficial în România</text>
</svg>