<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AstroVip translation QA</title><style>body{margin:16px;background:#142018;color:white;font:16px system-ui}header{position:sticky;top:0;background:#142018;padding:12px;z-index:2}.grid{display:flex;flex-wrap:wrap;gap:20px}.frame{padding:6px;border:1px solid #999}iframe{display:block;border:0;height:760px;width:360px}h2{font-size:18px;margin:0 0 8px}</style></head><body><header><label>Viewport width <select id="width"><option>320</option><option selected>360</option><option>390</option><option>768</option><option>1024</option></select></label></header><main class="grid"><section class="frame"><h2>ro</h2><iframe id="ro" title="ro homepage" src="/"></iframe></section><section class="frame"><h2>en</h2><iframe id="en" title="en homepage" src="/en/"></iframe></section><section class="frame"><h2>es</h2><iframe id="es" title="es homepage" src="/es/"></iframe></section><section class="frame"><h2>it</h2><iframe id="it" title="it homepage" src="/it/"></iframe></section><section class="frame"><h2>zh</h2><iframe id="zh" title="zh homepage" src="/zh/"></iframe></section><section class="frame"><h2>ar</h2><iframe id="ar" title="ar homepage" src="/ar/"></iframe></section><section class="frame"><h2>ru</h2><iframe id="ru" title="ru homepage" src="/ru/"></iframe></section></main><script>document.getElementById("width").onchange=function(){document.querySelectorAll("iframe").forEach(f=>f.style.width=this.value+"px")};</script></body></html>
