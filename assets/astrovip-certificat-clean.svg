<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 509" role="img" aria-labelledby="title desc">
  <title id="title">Certificat de absolvire pentru ocupația de astrolog</title>
  <desc id="desc">Certificat AstroVip cu date personale sensibile mascate și fără elemente de interfață.</desc>
  <defs>
    <clipPath id="sharePatch"><ellipse cx="430" cy="437" rx="39" ry="37"/></clipPath>
    <clipPath id="serialMask"><rect x="111" y="99" width="72" height="22" rx="5"/></clipPath>
    <clipPath id="cnpMask"><rect x="52" y="212" width="173" height="22" rx="5"/></clipPath>
    <clipPath id="numberMask"><rect x="35" y="447" width="58" height="22" rx="5"/></clipPath>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="paperBlend" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.45"/>
    </filter>
  </defs>
  <image href="astrovip-certificat-astrolog-cnp-blurat.webp?v=20260919-2" x="0" y="0" width="500" height="509" preserveAspectRatio="none"/>
  <g clip-path="url(#sharePatch)" filter="url(#paperBlend)">
    <image href="astrovip-certificat-astrolog-cnp-blurat.webp?v=20260919-2" x="0" y="0" width="500" height="509" preserveAspectRatio="none" transform="translate(347 271)"/>
  </g>
  <g clip-path="url(#serialMask)" filter="url(#softBlur)">
    <image href="astrovip-certificat-astrolog-cnp-blurat.webp?v=20260919-2" x="0" y="0" width="500" height="509" preserveAspectRatio="none"/>
  </g>
  <g clip-path="url(#cnpMask)" filter="url(#softBlur)">
    <image href="astrovip-certificat-astrolog-cnp-blurat.webp?v=20260919-2" x="0" y="0" width="500" height="509" preserveAspectRatio="none"/>
  </g>
  <g clip-path="url(#numberMask)" filter="url(#softBlur)">
    <image href="astrovip-certificat-astrolog-cnp-blurat.webp?v=20260919-2" x="0" y="0" width="500" height="509" preserveAspectRatio="none"/>
  </g>
</svg>