<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">AstroVip AV — logo premium</title>
<desc id="desc">Monogramă AV aurie și smarald, orbită astrologică și wordmark AstroVip, pe fundal transparent.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff8cf"/>
    <stop offset=".2" stop-color="#ffe878"/>
    <stop offset=".48" stop-color="#f4b525"/>
    <stop offset=".72" stop-color="#ffd964"/>
    <stop offset="1" stop-color="#9c5b00"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#baffd7"/>
    <stop offset=".22" stop-color="#38f58d"/>
    <stop offset=".55" stop-color="#00c96b"/>
    <stop offset=".78" stop-color="#008c4a"/>
    <stop offset="1" stop-color="#004c2d"/>
  </linearGradient>
  <linearGradient id="pearl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".48" stop-color="#f7fbff"/>
    <stop offset="1" stop-color="#cbd9df"/>
  </linearGradient>
  <filter id="glowG" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feFlood flood-color="#ffc83d" flood-opacity=".52"/>
    <feComposite in2="b" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowE" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feFlood flood-color="#19ef83" flood-opacity=".5"/>
    <feComposite in2="b" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- compact AV emblem -->
<g transform="translate(14 10)">
  <ellipse cx="103" cy="100" rx="92" ry="54" fill="none" stroke="url(#gold)" stroke-width="2.6" transform="rotate(-13 103 100)" opacity=".92" filter="url(#glowG)"/>
  <ellipse cx="103" cy="100" rx="79" ry="42" fill="none" stroke="url(#emerald)" stroke-width="1.6" transform="rotate(17 103 100)" opacity=".78" filter="url(#glowE)"/>
  <circle cx="31" cy="123" r="5.2" fill="url(#emerald)" stroke="#caffdf" stroke-width="1.1" filter="url(#glowE)"/>
  <circle cx="177" cy="74" r="4.2" fill="url(#gold)" stroke="#fff0a6" stroke-width="1" filter="url(#glowG)"/>
  <path d="M103 16 L107 31 L122 35 L107 39 L103 54 L99 39 L84 35 L99 31 Z" fill="#fff5bd" stroke="#e9b83b" stroke-width=".8" filter="url(#glowG)"/>
  <text x="36" y="151" font-family="Georgia, 'Times New Roman', serif" font-size="146" font-weight="700" letter-spacing="-26" fill="url(#gold)" stroke="#fff0a8" stroke-width="1.1" paint-order="stroke" filter="url(#glowG)">A</text>
  <text x="91" y="157" font-family="Georgia, 'Times New Roman', serif" font-size="142" font-weight="700" font-style="italic" fill="url(#emerald)" stroke="#ffd85e" stroke-width="2.2" paint-order="stroke" filter="url(#glowE)">V</text>
  <circle cx="103" cy="104" r="8.2" fill="url(#pearl)" stroke="#f2c44e" stroke-width="1.8"/>
  <path d="M103 83 L107 100 L124 104 L107 108 L103 125 L99 108 L82 104 L99 100 Z" fill="#fffdf0" opacity=".96"/>
</g>

<!-- wordmark -->
<g transform="translate(225 40)">
  <text x="0" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" letter-spacing="1">
    <tspan fill="url(#pearl)" stroke="#ffffff" stroke-width=".45">ASTRO</tspan><tspan fill="url(#gold)" stroke="#7a4a00" stroke-width=".9" filter="url(#glowG)">VIP</tspan>
  </text>
  <path d="M4 111 H632" stroke="url(#gold)" stroke-width="1.5" opacity=".74"/>
  <circle cx="316" cy="111" r="4.8" fill="url(#emerald)" stroke="#d5ffe6" stroke-width="1" filter="url(#glowE)"/>
  <path d="M316 99 L319 108 L328 111 L319 114 L316 123 L313 114 L304 111 L313 108 Z" fill="#f9fffb"/>
  <text x="316" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="7.5" fill="#f4d26b">ASTROLOGIE PREMIUM</text>
</g>
</svg>