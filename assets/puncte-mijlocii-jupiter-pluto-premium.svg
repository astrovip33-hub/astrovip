<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="t d">
<title id="t">Jupiter Pluto — punct mijlociu AstroVip</title>
<desc id="d">Compoziție cosmică premium în auriu, violet și albastru marin, cu Jupiter și Pluto unite printr-un punct mijlociu central.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#010309"/><stop offset=".44" stop-color="#0a1022"/><stop offset="1" stop-color="#030208"/></linearGradient>
  <radialGradient id="neb1"><stop stop-color="#f0a530" stop-opacity=".37"/><stop offset="1" stop-color="#f0a530" stop-opacity="0"/></radialGradient>
  <radialGradient id="neb2"><stop stop-color="#8d52ff" stop-opacity=".34"/><stop offset="1" stop-color="#8d52ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="core"><stop stop-color="#fff8ca"/><stop offset=".24" stop-color="#efc968"/><stop offset=".55" stop-color="#b879ff"/><stop offset="1" stop-color="#171334" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1a8"/><stop offset=".43" stop-color="#d8a83e"/><stop offset="1" stop-color="#fff2c0"/></linearGradient>
  <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e9a83e"/><stop offset=".5" stop-color="#fff6d0"/><stop offset="1" stop-color="#a475ff"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="stars" width="170" height="170" patternUnits="userSpaceOnUse"><circle cx="18" cy="30" r="1.8" fill="#fff" opacity=".7"/><circle cx="102" cy="68" r="1.1" fill="#b993ff" opacity=".78"/><circle cx="148" cy="122" r="1.5" fill="#f8db80" opacity=".72"/><circle cx="57" cy="143" r=".9" fill="#fff" opacity=".52"/></pattern>
</defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<rect width="1080" height="1920" fill="url(#stars)" opacity=".72"/>
<circle cx="235" cy="520" r="440" fill="url(#neb1)" filter="url(#soft)"/>
<circle cx="860" cy="1305" r="470" fill="url(#neb2)" filter="url(#soft)"/>
<ellipse cx="540" cy="960" rx="410" ry="620" fill="none" stroke="#efc96c" stroke-opacity=".13" stroke-width="2"/>
<ellipse cx="540" cy="960" rx="330" ry="520" fill="none" stroke="#a87cff" stroke-opacity=".12" stroke-width="2"/>
<path d="M190 650 C360 760 370 1160 540 960 C710 760 720 1160 890 1270" fill="none" stroke="url(#energy)" stroke-width="5" opacity=".7"/>
<path d="M205 1270 C355 1130 405 775 540 960 C675 1145 725 790 875 650" fill="none" stroke="#e3bd5d" stroke-opacity=".31" stroke-width="2"/>
<g transform="translate(310 610)" filter="url(#glow)"><circle r="118" fill="#21140a" stroke="#efbd58" stroke-width="3"/><circle r="96" fill="none" stroke="#ffffff" stroke-opacity=".12"/><text x="0" y="34" text-anchor="middle" font-size="126" font-family="Georgia,serif" fill="#ffe29a">♃</text></g>
<g transform="translate(770 1310)" filter="url(#glow)"><circle r="118" fill="#120d27" stroke="#aa79ff" stroke-width="3"/><circle r="96" fill="none" stroke="#ffffff" stroke-opacity=".12"/><text x="0" y="34" text-anchor="middle" font-size="126" font-family="Georgia,serif" fill="#d2b8ff">♇</text></g>
<g transform="translate(540 960)" filter="url(#glow)"><circle r="172" fill="url(#core)" opacity=".7"/><circle r="88" fill="#0c0d1c" stroke="url(#gold)" stroke-width="4"/><path d="M0-55 L55 0 L0 55 L-55 0 Z" fill="none" stroke="url(#gold)" stroke-width="3"/><circle r="13" fill="#fff4b9"/></g>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
  <text x="540" y="210" fill="#e9c967" font-size="30" font-weight="800" letter-spacing="8">ASTROVIP · PUNCTE MIJLOCII</text>
  <text x="540" y="310" fill="#ffffff" font-size="76" font-family="Georgia,serif" font-weight="700">JUPITER / PLUTO</text>
  <text x="540" y="370" fill="#e7cc84" font-size="25" font-weight="700" letter-spacing="4">EXPANSIUNE · PUTERE · TRANSFORMARE</text>
  <text x="310" y="780" fill="#f5d17b" font-size="28" font-weight="800" letter-spacing="4">JUPITER</text>
  <text x="770" y="1490" fill="#d3b8ff" font-size="28" font-weight="800" letter-spacing="4">PLUTO</text>
  <text x="540" y="1105" fill="#f5dda0" font-size="22" font-weight="800" letter-spacing="5">PUNCTUL MIJLOCIU</text>
  <text x="540" y="1740" fill="#c7bddb" font-size="22" font-weight="600" letter-spacing="2.5">EXPANSIUNEA PUTERII DE A TRANSFORMA</text>
</g>
<rect x="28" y="28" width="1024" height="1864" rx="44" fill="none" stroke="url(#gold)" stroke-opacity=".34" stroke-width="2"/>
</svg>
