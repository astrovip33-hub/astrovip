<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 552" role="img" aria-label="Fundal AstroVip 3D premium fără text">
<defs>
  <radialGradient id="sky" cx="72%" cy="34%" r="88%">
    <stop offset="0" stop-color="#103b2b"/><stop offset=".28" stop-color="#09271c"/><stop offset=".58" stop-color="#03110c"/><stop offset="1" stop-color="#010202"/>
  </radialGradient>
  <radialGradient id="planet" cx="38%" cy="34%" r="70%">
    <stop offset="0" stop-color="#fff0b0"/><stop offset=".18" stop-color="#a4782d"/><stop offset=".46" stop-color="#2d261c"/><stop offset=".76" stop-color="#0b0b0a"/><stop offset="1" stop-color="#020202"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff6c6"/><stop offset=".2" stop-color="#f5d77a"/><stop offset=".46" stop-color="#bf8a23"/><stop offset=".7" stop-color="#ffeb9c"/><stop offset="1" stop-color="#6d470d"/>
  </linearGradient>
  <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#5f3d0b"/><stop offset=".22" stop-color="#e3bb56"/><stop offset=".5" stop-color="#6c470e"/><stop offset=".77" stop-color="#f4d67a"/><stop offset="1" stop-color="#231704"/>
  </linearGradient>
  <linearGradient id="obsidian" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#161918"/><stop offset=".35" stop-color="#050606"/><stop offset=".72" stop-color="#0b0d0c"/><stop offset="1" stop-color="#000"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#080a09"/><stop offset=".5" stop-color="#020303"/><stop offset="1" stop-color="#000"/>
  </linearGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop stop-color="#fff"/><stop offset=".12" stop-color="#fff7b8"/><stop offset=".36" stop-color="#e8c34f"/><stop offset=".66" stop-color="#d8f500"/><stop offset="1" stop-color="#8ead00" stop-opacity="0"/>
  </radialGradient>
  <filter id="glowGold" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowLime" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".78"/>
  </filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
  <clipPath id="planetClip"><circle cx="846" cy="42" r="118"/></clipPath>
</defs>

