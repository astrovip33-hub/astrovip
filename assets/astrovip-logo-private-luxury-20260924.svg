<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">AstroVip — Astrologie Premium</title>
<desc id="desc">Identitate AstroVip Private Luxury: monogramă AV, orbită aurie și accent smarald pe fundal transparent.</desc>
<defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff4bd"/>
    <stop offset=".24" stop-color="#efd47d"/>
    <stop offset=".52" stop-color="#c99d3f"/>
    <stop offset=".76" stop-color="#f7df8a"/>
    <stop offset="1" stop-color="#9d6d1f"/>
  </linearGradient>
  <linearGradient id="gPearl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffef8"/>
    <stop offset=".42" stop-color="#eee9dc"/>
    <stop offset="1" stop-color="#bdb6a8"/>
  </linearGradient>
  <linearGradient id="gEmerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#91ffaf"/>
    <stop offset=".45" stop-color="#35e96d"/>
    <stop offset="1" stop-color="#0aa747"/>
  </linearGradient>
  <radialGradient id="gCore" cx="50%" cy="46%" r="64%">
    <stop offset="0" stop-color="#11120f"/>
    <stop offset=".7" stop-color="#070807"/>
    <stop offset="1" stop-color="#020302"/>
  </radialGradient>
  <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="2.6" result="b"/>
    <feFlood flood-color="#eacb6c" flood-opacity=".34"/>
    <feComposite in2="b" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="greenGlow" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feFlood flood-color="#48f37c" flood-opacity=".38"/>
    <feComposite in2="b" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Signature emblem -->
<g transform="translate(14 12)">
  <circle cx="96" cy="98" r="81" fill="url(#gCore)" stroke="url(#gGold)" stroke-width="2.4"/>
  <circle cx="96" cy="98" r="69" fill="none" stroke="#e6cf87" stroke-opacity=".23" stroke-width="1"/>
  <ellipse cx="96" cy="98" rx="91" ry="31" fill="none" stroke="url(#gGold)" stroke-width="1.6" transform="rotate(-19 96 98)" opacity=".92"/>
  <ellipse cx="96" cy="98" rx="78" ry="20" fill="none" stroke="url(#gEmerald)" stroke-width="1.35" transform="rotate(17 96 98)" opacity=".78" filter="url(#greenGlow)"/>
  <circle cx="180" cy="72" r="4.4" fill="#f4da82" filter="url(#softGlow)"/>
  <circle cx="31" cy="137" r="3.2" fill="#48ef79" filter="url(#greenGlow)"/>

  <!-- AV monogram -->
  <path d="M54 132 L91 52 L101 52 L139 132 L123 132 L112 108 L79 108 L68 132 Z
           M85 94 L96 69 L106 94 Z" fill="url(#gGold)" fill-rule="evenodd" filter="url(#softGlow)"/>
  <path d="M72 73 L96 127 L121 73 L137 73 L102 145 L91 145 L56 73 Z"
        fill="none" stroke="url(#gPearl)" stroke-width="3.2" stroke-linejoin="round" opacity=".94"/>
  <path d="M96 34 L100 46 L112 50 L100 54 L96 66 L92 54 L80 50 L92 46 Z"
        fill="#fff5bf" filter="url(#softGlow)"/>
  <circle cx="96" cy="98" r="2.8" fill="#48ef79" filter="url(#greenGlow)"/>
</g>

<!-- Wordmark -->
<g transform="translate(225 38)">
  <text x="0" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="91" font-weight="700" letter-spacing="1.2">
    <tspan fill="url(#gPearl)">ASTRO</tspan><tspan fill="url(#gGold)">VIP</tspan>
  </text>
  <line x1="3" y1="111" x2="630" y2="111" stroke="url(#gGold)" stroke-width="1.1" opacity=".52"/>
  <line x1="3" y1="116" x2="178" y2="116" stroke="url(#gEmerald)" stroke-width="1.25" opacity=".74"/>
  <text x="4" y="151" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700"
        letter-spacing="4.8" fill="#d8d0bf">ASTROLOGIE PREMIUM</text>
  <text x="421" y="151" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700"
        letter-spacing="3.3" fill="#8d897f">TIMING · RELOCARE</text>
</g>
</svg>