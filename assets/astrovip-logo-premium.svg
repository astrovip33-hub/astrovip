<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">AstroVip — Astrologie Premium</title>
<desc id="desc">Logo AstroVip optimizat pentru web, cu emblemă verde neon și wordmark auriu pe fundal transparent.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff8cf"/>
    <stop offset=".22" stop-color="#ffe46f"/>
    <stop offset=".5" stop-color="#d8a92f"/>
    <stop offset=".74" stop-color="#fff0a2"/>
    <stop offset="1" stop-color="#9b6915"/>
  </linearGradient>
  <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#baff9f"/>
    <stop offset=".34" stop-color="#39ff14"/>
    <stop offset=".72" stop-color="#10c843"/>
    <stop offset="1" stop-color="#0a6b2d"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feFlood flood-color="#39ff14" flood-opacity=".58"/>
    <feComposite in2="b" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<g transform="translate(18 10)">
  <path d="M92 6 L111 80 L184 101 L111 122 L92 196 L73 122 L0 101 L73 80 Z"
        fill="url(#n)" stroke="#d8ffbf" stroke-width="2.6" filter="url(#glow)"/>
  <path d="M92 24 L105 86 L165 101 L105 116 L92 178 L79 116 L19 101 L79 86 Z"
        fill="#6cff55" opacity=".52"/>
  <circle cx="92" cy="101" r="26" fill="#020604" stroke="#8dff72" stroke-width="3"/>
</g>

<g transform="translate(225 38)">
  <text x="0" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700"
        letter-spacing="1.2" fill="url(#g)" stroke="#7a5312" stroke-width="1.2">ASTROVIP</text>
  <line x1="8" y1="117" x2="640" y2="117" stroke="#c99d36" stroke-width="1.4" opacity=".8"/>
  <text x="316" y="159" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="21" font-weight="700" letter-spacing="8.5" fill="#f4df91">ASTROLOGIE PREMIUM</text>
</g>
</svg>