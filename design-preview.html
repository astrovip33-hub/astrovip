<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AstroVip — preview design</title><style>
*{box-sizing:border-box}body{margin:0;background:#18231c;color:#f5f5ed;font:14px/1.5 Arial,sans-serif}header{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:#071009;border-bottom:1px solid #405440}strong{color:#edcf88;font:700 19px Georgia,serif}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,a,select{font:700 14px Arial,sans-serif;color:#f5f5ed;background:#17291c;border:1px solid #507157;border-radius:6px;padding:10px 14px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#78ff87;color:#08190d}main{display:flex;justify-content:center;padding:20px 0}iframe{display:block;width:1280px;max-width:100%;height:calc(100dvh - 110px);min-height:600px;border:1px solid #405440;background:#060908;box-shadow:0 12px 48px #0006}@media(max-width:650px){header{padding:12px;align-items:flex-start;flex-direction:column}main{padding-top:12px}nav{gap:5px}button,a,select{padding:9px 10px;font-size:13px}iframe{height:calc(100dvh - 130px)}}</style></head>
<body><header><strong>AstroVip · Preview design</strong><nav aria-label="Previzualizare"><button type="button" data-width="320" aria-pressed="false">Mobil 320</button><button type="button" data-width="390" aria-pressed="false">Mobil 390</button><button type="button" data-width="1280" aria-pressed="true">Desktop</button><select aria-label="Limba previzualizării"><option value="/">Română</option><option value="/en/">English</option><option value="/es/">Español</option><option value="/it/">Italiano</option><option value="/zh/">中文</option><option value="/ar/">العربية</option><option value="/ru/">Русский</option></select><a href="/" target="_blank" rel="noopener">Deschide site-ul ↗</a></nav></header><main><iframe title="AstroVip — design responsive" src="/"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelectorAll('button[data-width]').forEach(b=>b.addEventListener('click',()=>{frame.style.width=b.dataset.width+'px';document.querySelectorAll('button[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));document.querySelector('select').addEventListener('change',e=>{frame.src=e.target.value;document.querySelector('nav a').href=e.target.value});</script></body></html>
