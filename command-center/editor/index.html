<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Editor Vizual AstroVip</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030503}#av-editor{display:block;width:100%;height:100%;border:0;background:#030503}
#fix-badge{position:fixed;right:10px;bottom:10px;z-index:999999;padding:6px 9px;border:1px solid #39ff76;border-radius:999px;background:#061008e8;color:#baffc9;font:700 10px system-ui;pointer-events:none;opacity:.78;box-shadow:0 0 18px #39ff7630}
</style>
</head>
<body>
<iframe id="av-editor" src="/command-center/editor-original/index.html" title="Editor Vizual AstroVip"></iframe>
<div id="fix-badge">PUBLICARE AUTO · FIX ACTIV</div>
<script>
(()=>{
  const frame=document.getElementById('av-editor');
  const badge=document.getElementById('fix-badge');
  frame.addEventListener('load',()=>{
    try{
      const w=frame.contentWindow;
      const d=frame.contentDocument;
      if(!w||!d||w.__astroVipPublishFixV1)return;
      w.__astroVipPublishFixV1=true;

      const originalApi=w.api;
      const originalPublish=w.publish;
      if(typeof originalApi!=='function'||typeof originalPublish!=='function'){
        badge.textContent='FIX: editor incompatibil';
        badge.style.borderColor='#ff7885';
        badge.style.color='#ffb0b8';
        return;
      }

      let publishRun={realCommit:false,skippedNoChange:false};
      const same=(a,b)=>{try{return JSON.stringify(a)===JSON.stringify(b)}catch{return false}};

      w.api=async function(path,opt={}){
        const isHomePublish=path==='/api/command/editor-publish'&&String(opt?.method||'GET').toUpperCase()==='POST';
        const isPagePublish=path==='/api/command/page-overrides-publish'&&String(opt?.method||'GET').toUpperCase()==='POST';
        if(isHomePublish||isPagePublish){
          try{
            const next=JSON.parse(opt.body||'{}');
            const readPath=isHomePublish?'/api/command/editor-config':'/api/command/page-overrides';
            const current=await originalApi.call(w,readPath);
            if(same(current?.config,next)){
              publishRun.skippedNoChange=true;
              return {ok:true,config:next,noChange:true,commit:{sha:null,url:null}};
            }
          }catch(e){console.warn('AstroVip publish compare skipped',e)}
        }
        const out=await originalApi.call(w,path,opt);
        if((isHomePublish||isPagePublish)&&out?.commit?.sha)publishRun.realCommit=true;
        return out;
      };

      w.publish=async function(...args){
        publishRun={realCommit:false,skippedNoChange:false};
        const nativeConfirm=w.confirm.bind(w);
        const previousConfirm=w.confirm;
        w.confirm=function(message){
          const ok=nativeConfirm(message);
          if(ok){
            try{
              const selected=d.getElementById('selectedInfo');
              if(selected?.value&&typeof w.applySelectedText==='function'){
                w.applySelectedText();
              }
            }catch(e){console.warn('AstroVip auto-apply skipped',e)}
          }
          return ok;
        };
        try{
          const result=await originalPublish.apply(w,args);
          if(!publishRun.realCommit&&publishRun.skippedNoChange){
            const state=d.getElementById('state');
            if(state){state.textContent='Nicio modificare nouă · nimic de publicat';state.className='status ok'}
            try{if(typeof w.toast==='function')w.toast('Nu există modificări noi. Nu am creat un commit gol.')}catch{}
          }
          return result;
        }finally{
          w.confirm=previousConfirm;
        }
      };

      d.querySelectorAll('.quickHelp').forEach(el=>{el.textContent='Alege pagina → click pe element → modifică → PUBLICĂ · aplicare automată'});
      const firstNotice=d.querySelector('.panel .notice');
      if(firstNotice)firstNotice.innerHTML='Schimbările se văd imediat în preview. <b>PUBLICĂ aplică automat editarea activă</b>, salvează doar schimbările reale și pornește deploy-ul Cloudflare.';
      badge.textContent='PUBLICARE AUTO · FIX ACTIV';
      setTimeout(()=>{badge.style.opacity='.35'},3500);
    }catch(e){
      console.error('AstroVip editor fix failed',e);
      badge.textContent='FIX: eroare de inițializare';
      badge.style.borderColor='#ff7885';
      badge.style.color='#ffb0b8';
    }
  });
})();
</script>
</body>
</html>
