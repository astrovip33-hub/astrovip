<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#030503">
<title>AstroVip Studio · Editor Vizual Premium</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030503}
#av-editor{display:block;width:100%;height:100%;border:0;background:#030503}
#studio-badge{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:999999;padding:7px 11px;border:1px solid rgba(57,255,118,.72);border-radius:999px;background:rgba(5,13,8,.86);color:#d9ffe4;font:800 10px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.05em;pointer-events:none;opacity:.9;box-shadow:0 14px 35px rgba(0,0,0,.35),0 0 22px rgba(57,255,118,.12);backdrop-filter:blur(14px);transition:.3s ease}
#studio-badge.dim{opacity:.22}
#studio-badge.bad{border-color:#ff7885;color:#ffc1c7;opacity:1}
</style>
</head>
<body>
<iframe id="av-editor" src="/command-center/editor-original/index.html" title="AstroVip Studio · Editor Vizual"></iframe>
<div id="studio-badge">ASTROVIP STUDIO · V10</div>
<script>
(()=>{
  const frame=document.getElementById('av-editor');
  const badge=document.getElementById('studio-badge');
  const $=(d,id)=>d.getElementById(id);
  const raf=(fn)=>requestAnimationFrame(()=>requestAnimationFrame(fn));
  const safe=(fn)=>{try{return fn()}catch(e){console.warn('[AstroVip Studio]',e);return null}};
  const esc=(s)=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const toast=(w,msg)=>safe(()=>typeof w.toast==='function'?w.toast(msg):null);

  function enhance(){
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    if(!w||!d||w.__astroVipStudioV10)return;
    w.__astroVipStudioV10=true;

    const originalApi=w.api;
    const originalPublish=w.publish;
    if(typeof originalApi!=='function'||typeof originalPublish!=='function'){
      badge.textContent='STUDIO: editor incompatibil';
      badge.classList.add('bad');
      return;
    }

    let publishRun={realCommit:false,skippedNoChange:false};
    const same=(a,b)=>{try{return JSON.stringify(a)===JSON.stringify(b)}catch{return false}};
    w.api=async function(path,opt={}){
      const method=String(opt?.method||'GET').toUpperCase();
      const isHomePublish=path==='/api/command/editor-publish'&&method==='POST';
      const isPagePublish=path==='/api/command/page-overrides-publish'&&method==='POST';
      if(isHomePublish||isPagePublish){
        try{
          const next=JSON.parse(opt.body||'{}');
          const readPath=isHomePublish?'/api/command/editor-config':'/api/command/page-overrides';
          const current=await originalApi.call(w,readPath);
          if(same(current?.config,next)){
            publishRun.skippedNoChange=true;
            return {ok:true,config:next,noChange:true,commit:{sha:null,url:null}};
          }
        }catch(e){console.warn('AstroVip publish compare skipped',e)}
      }
      const out=await originalApi.call(w,path,opt);
      if((isHomePublish||isPagePublish)&&out?.commit?.sha)publishRun.realCommit=true;
      return out;
    };

    w.publish=async function(...args){
      publishRun={realCommit:false,skippedNoChange:false};
      const nativeConfirm=w.confirm.bind(w);
      const previousConfirm=w.confirm;
      w.confirm=function(message){
        const ok=nativeConfirm(message);
        if(ok){
          safe(()=>{
            const selected=$(d,'selectedInfo');
            if(selected?.value&&typeof w.applySelectedText==='function')w.applySelectedText();
          });
        }
        return ok;
      };
      try{
        setSaveState('Publicare în curs…','busy');
        const result=await originalPublish.apply(w,args);
        if(!publishRun.realCommit&&publishRun.skippedNoChange){
          const state=$(d,'state');
          if(state){state.textContent='Nicio modificare nouă · nimic de publicat';state.className='status ok'}
          toast(w,'Nu există modificări noi. Nu am creat un commit gol.');
        }else if(publishRun.realCommit){
          toast(w,'Publicare pornită. Deploy-ul Cloudflare rulează.');
        }
        setSaveState('Sincronizat','ok');
        return result;
      }catch(e){
        setSaveState('Eroare la publicare','bad');
        throw e;
      }finally{
        w.confirm=previousConfirm;
      }
    };

    const style=d.createElement('style');
    style.id='astrovip-studio-v10';
    style.textContent=`
      :root{
        --av10-bg:#030503;--av10-panel:#07100a;--av10-panel2:#0a1510;--av10-line:rgba(110,255,158,.18);
        --av10-neon:#39ff76;--av10-gold:#e8c75f;--av10-pearl:#f7fff9;--av10-muted:#91a79a;
        --av10-shadow:0 22px 70px rgba(0,0,0,.34);--av10-radius:16px;
      }
      *{scrollbar-width:thin;scrollbar-color:#245e3a transparent}
      body{background:
        radial-gradient(circle at 8% -10%,rgba(57,255,118,.11),transparent 31%),
        radial-gradient(circle at 92% 0,rgba(232,199,95,.08),transparent 28%),#030503!important;
        color:var(--av10-pearl)!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}
      .app{height:100dvh!important;min-height:0!important;grid-template-rows:auto minmax(0,1fr)!important}
      .top{min-height:68px!important;padding:9px 12px!important;background:rgba(3,8,5,.88)!important;
        border-bottom:1px solid var(--av10-line)!important;backdrop-filter:blur(22px) saturate(135%)!important;box-shadow:0 12px 35px rgba(0,0,0,.22)!important}
      .brand{min-width:0}.logo{width:40px!important;height:40px!important;border-radius:13px!important;
        background:linear-gradient(145deg,#fff5ba 0,#dfbf56 48%,#39ff76 100%)!important;box-shadow:0 0 28px rgba(232,199,95,.16)!important}
      .title{font-size:13px!important;letter-spacing:.055em}.sub{color:var(--av10-muted)!important}
      .actions{gap:6px!important}.btn,.previewTools button,.simpleTabs button{min-height:38px;border-radius:12px!important;
        border:1px solid rgba(232,199,95,.27)!important;background:linear-gradient(180deg,rgba(18,31,23,.95),rgba(7,14,10,.95))!important;
        color:#f4fbf6!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease!important}
      .btn:hover,.previewTools button:hover,.simpleTabs button:hover{transform:translateY(-1px);border-color:rgba(57,255,118,.6)!important;box-shadow:0 8px 24px rgba(0,0,0,.24),0 0 0 3px rgba(57,255,118,.06)!important}
      .btn.publish,.publish{background:linear-gradient(180deg,#fff1a0,#d1a943)!important;color:#151006!important;border-color:#ffe796!important;font-weight:950!important;
        box-shadow:0 8px 28px rgba(232,199,95,.18),inset 0 1px 0 rgba(255,255,255,.5)!important}
      .layout{grid-template-columns:minmax(320px,360px) minmax(0,1fr)!important;min-height:0!important}
      .panel{padding:10px!important;max-height:none!important;height:100%!important;border-right:1px solid var(--av10-line)!important;
        background:linear-gradient(180deg,rgba(6,13,9,.98),rgba(3,8,5,.98))!important}
      .section{border:1px solid rgba(77,155,101,.22)!important;border-radius:16px!important;background:linear-gradient(180deg,rgba(12,23,16,.96),rgba(6,13,9,.96))!important;
        box-shadow:0 14px 38px rgba(0,0,0,.18)!important;margin-bottom:9px!important;overflow:hidden!important}
      .section>h2{position:relative;cursor:pointer;user-select:none;padding:11px 38px 11px 12px!important;color:#ffecad!important;border-bottom:1px solid rgba(77,155,101,.18)!important;
        letter-spacing:.085em!important;transition:.16s ease}
      .section>h2:hover{background:rgba(57,255,118,.035)}
      .section>h2:after{content:"⌄";position:absolute;right:13px;top:50%;transform:translateY(-53%);color:#88a992;font-size:15px;transition:.16s ease}
      .section.av-collapsed>h2:after{transform:translateY(-53%) rotate(-90deg)}
      .section.av-collapsed>.body{display:none!important}
      .body{padding:10px!important}.row{gap:7px!important}
      .field{gap:5px!important;margin-bottom:9px!important}.field label{font-size:10px!important;letter-spacing:.02em;color:#9fb1a5!important}
      .field input,.field textarea,.field select{min-height:41px!important;padding:9px 10px!important;border:1px solid rgba(115,145,124,.28)!important;border-radius:11px!important;
        background:rgba(1,5,2,.82)!important;color:#fff!important;outline:0!important;transition:border-color .14s ease,box-shadow .14s ease,background .14s ease!important}
      .field textarea{min-height:70px!important}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--av10-neon)!important;box-shadow:0 0 0 3px rgba(57,255,118,.08)!important;background:#030804!important}
      input[type=color]{padding:5px!important}
      .notice{border:1px solid rgba(232,199,95,.28)!important;background:linear-gradient(180deg,rgba(37,29,10,.78),rgba(20,16,8,.72))!important;color:#ffe9aa!important;border-radius:13px!important}
      .premiumDock{border:1px solid rgba(57,255,118,.16)!important;border-radius:14px!important;background:rgba(5,13,8,.72)!important;backdrop-filter:blur(12px)!important}
      .preview{background:#070907!important;min-height:0!important}.previewbar{background:rgba(4,9,6,.9)!important;border-bottom:1px solid var(--av10-line)!important;backdrop-filter:blur(18px)!important}
      .previewTools{padding:8px 10px!important;background:rgba(5,12,8,.88)!important;border-bottom:1px solid var(--av10-line)!important;backdrop-filter:blur(18px)!important}
      .framewrap{padding:18px!important;background:
        linear-gradient(45deg,rgba(255,255,255,.018) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.018) 75%),
        linear-gradient(45deg,rgba(255,255,255,.018) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.018) 75%),#080b09!important;
        background-size:28px 28px!important;background-position:0 0,14px 14px!important}
      .framebox{height:calc(100dvh - 152px)!important;min-height:560px!important;border:1px solid rgba(232,199,95,.34)!important;border-radius:18px!important;
        box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.025)!important;transition:width .22s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease!important}
      .framebox[data-av-device="tablet"]{width:768px!important;max-width:100%!important}
      .framebox[data-av-device="mobile"]{width:390px!important;max-width:100%!important;height:min(820px,calc(100dvh - 152px))!important}
      .framebox[data-av-device="laptop"]{width:min(1180px,100%)!important}
      .framebox[data-av-device="desktop"]{width:100%!important}
      .overlay{backdrop-filter:blur(18px)!important;background:rgba(0,0,0,.78)!important}.login{border:1px solid rgba(57,255,118,.3)!important;border-radius:22px!important;background:linear-gradient(180deg,#0a1510,#050a07)!important;box-shadow:0 30px 100px rgba(0,0,0,.62)!important}
      #genericControls{scroll-margin-top:70px!important}
      .av-panel-tools{position:sticky;top:-10px;z-index:11;margin:-2px -2px 9px;padding:8px 2px 7px;background:linear-gradient(180deg,#06100a 78%,rgba(6,16,10,0));backdrop-filter:blur(12px)}
      .av-searchbox{display:flex;align-items:center;gap:7px;border:1px solid rgba(57,255,118,.17);background:rgba(2,7,4,.9);border-radius:13px;padding:0 10px}
      .av-searchbox span{opacity:.6}.av-searchbox input{width:100%;height:40px;border:0!important;background:transparent!important;color:#fff!important;outline:0!important}
      .av-studio-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 10px;background:linear-gradient(180deg,rgba(8,17,11,.97),rgba(5,10,7,.97));border-bottom:1px solid var(--av10-line)}
      .av-toolgroup{display:flex;gap:5px;padding:3px;border:1px solid rgba(57,255,118,.12);background:rgba(1,5,3,.52);border-radius:12px}
      .av-tool{min-height:34px;padding:7px 10px;border:0;border-radius:9px;background:transparent;color:#c6d6ca;font:800 11px system-ui;cursor:pointer}
      .av-tool:hover{background:rgba(57,255,118,.06);color:#fff}.av-tool.active{background:linear-gradient(180deg,#53ff89,#26d766);color:#031208;box-shadow:0 5px 18px rgba(57,255,118,.18)}
      .av-tool.gold{background:linear-gradient(180deg,#ffe997,#d9b447);color:#171006}.av-sep{width:1px;height:26px;background:rgba(255,255,255,.08);margin:0 1px}
      .av-save{display:flex;align-items:center;gap:7px;margin-left:auto;color:#99aa9e;font:700 10px system-ui;white-space:nowrap}
      .av-save i{display:block;width:7px;height:7px;border-radius:50%;background:#39ff76;box-shadow:0 0 12px rgba(57,255,118,.7)}
      .av-save.busy i{background:#e8c75f}.av-save.bad i{background:#ff7885}.av-save.ok i{background:#39ff76}
      .av-inspector-presets{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
      .av-preset{min-height:34px;border:1px solid rgba(232,199,95,.25);border-radius:10px;background:#0a120d;color:#fff;padding:7px 9px;font:800 10px system-ui;cursor:pointer}
      .av-preset:hover{border-color:#39ff76}.av-preset:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--swatch,#e8c75f);box-shadow:0 0 10px color-mix(in srgb,var(--swatch) 55%,transparent)}
      body.av-focus .panel{display:none!important}body.av-focus .layout{grid-template-columns:minmax(0,1fr)!important}
      body.av-focus .framebox{height:calc(100dvh - 118px)!important}
      .av-cmd{position:fixed;inset:0;z-index:2147483000;display:none;place-items:start center;padding:12vh 16px 30px;background:rgba(0,0,0,.62);backdrop-filter:blur(15px)}
      .av-cmd.open{display:grid}.av-cmd-box{width:min(720px,100%);max-height:min(620px,76vh);display:flex;flex-direction:column;border:1px solid rgba(57,255,118,.24);border-radius:20px;overflow:hidden;background:#07100a;box-shadow:0 38px 120px rgba(0,0,0,.68)}
      .av-cmd-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(57,255,118,.12)}.av-cmd-head input{flex:1;height:44px;border:0;background:transparent;color:#fff;font:700 15px system-ui;outline:0}
      .av-cmd-kbd{border:1px solid rgba(255,255,255,.12);border-bottom-color:rgba(255,255,255,.22);border-radius:8px;padding:4px 7px;color:#90a096;font:700 10px system-ui}
      .av-cmd-list{overflow:auto;padding:7px}.av-cmd-item{display:flex;align-items:center;gap:11px;width:100%;border:0;border-radius:12px;background:transparent;color:#edf7ef;text-align:left;padding:10px;cursor:pointer}
      .av-cmd-item:hover,.av-cmd-item.active{background:rgba(57,255,118,.07)}.av-cmd-icon{width:32px;height:32px;display:grid;place-items:center;border:1px solid rgba(232,199,95,.18);border-radius:9px;background:#0a1510;color:#ffe599;font-weight:900}
      .av-cmd-text{min-width:0}.av-cmd-text strong{display:block;font-size:12px}.av-cmd-text small{display:block;color:#829386;font-size:10px;margin-top:2px}
      .av-empty{padding:22px;text-align:center;color:#849489;font-size:12px}
      @media(max-width:900px){
        .app{height:auto!important;min-height:100dvh!important;overflow:auto!important}.layout{grid-template-columns:1fr!important}
        .panel{height:auto!important;max-height:none!important;border-right:0!important;border-bottom:1px solid var(--av10-line)!important}
        .preview{min-height:72vh!important}.framebox{height:70vh!important;min-height:560px!important}.top{position:sticky!important;top:0!important}
        .actions{width:100%!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important}.actions .btn{text-align:center!important}
        .av-studio-toolbar{position:sticky;top:0;z-index:15}.av-save{width:100%;margin-left:0;justify-content:flex-end}
      }
      @media(max-width:560px){
        .layout{display:block!important}.panel{padding:8px!important}.row{grid-template-columns:1fr!important}.top{gap:7px!important}.brand .sub{display:none}
        .actions{grid-template-columns:1fr 1fr!important}.actions .btn{min-height:42px!important;padding:8px!important;font-size:11px!important}
        .framewrap{padding:8px!important}.framebox{border-radius:14px!important}.av-tool{padding:7px 8px}.av-studio-toolbar{gap:5px;padding:7px}
      }
    `;
    d.head.appendChild(style);

    d.querySelectorAll('.quickHelp').forEach(el=>{el.textContent='Selectează în preview → editează → Ctrl+S draft · Ctrl+Enter publică'});
    const firstNotice=d.querySelector('.panel .notice');
    if(firstNotice)firstNotice.innerHTML='Editezi direct în preview. <b>Draftul se salvează automat</b>. PUBLICĂ aplică selecția activă, evită commit-urile goale și pornește deploy-ul Cloudflare.';

    const panel=d.querySelector('.panel');
    if(panel&&!$(d,'avInspectorSearch')){
      const tools=d.createElement('div');
      tools.className='av-panel-tools';
      tools.innerHTML='<div class="av-searchbox"><span>⌕</span><input id="avInspectorSearch" type="search" autocomplete="off" placeholder="Caută setare: hero, font, card, footer…"></div>';
      panel.prepend(tools);
      const input=tools.querySelector('input');
      input.addEventListener('input',()=>{
        const q=input.value.trim().toLowerCase();
        panel.querySelectorAll('.section').forEach(sec=>{
          if(sec.closest('.section')!==sec)return;
          const hit=!q||sec.textContent.toLowerCase().includes(q);
          sec.style.display=hit?'':'none';
        });
      },{passive:true});
    }

    const collapseKey='astrovip_editor_collapsed_v10';
    let collapsed={};
    safe(()=>collapsed=JSON.parse(localStorage.getItem(collapseKey)||'{}')||{});
    d.querySelectorAll('.section>h2').forEach((h,i)=>{
      const sec=h.parentElement;
      const key=(h.textContent||`section-${i}`).trim();
      if(collapsed[key])sec.classList.add('av-collapsed');
      h.addEventListener('click',e=>{
        if(e.target.closest('button,input,select,textarea,a'))return;
        sec.classList.toggle('av-collapsed');
        collapsed[key]=sec.classList.contains('av-collapsed');
        safe(()=>localStorage.setItem(collapseKey,JSON.stringify(collapsed)));
      });
    });

    const preview=d.querySelector('.preview');
    if(preview&&!$(d,'avStudioToolbar')){
      const bar=d.createElement('div');
      bar.id='avStudioToolbar';
      bar.className='av-studio-toolbar';
      bar.innerHTML=`
        <div class="av-toolgroup" aria-label="Viewport">
          <button class="av-tool av-device-btn active" data-device="desktop" title="Desktop · 1">Desktop</button>
          <button class="av-tool av-device-btn" data-device="laptop" title="Laptop · 2">Laptop</button>
          <button class="av-tool av-device-btn" data-device="tablet" title="Tablet · 3">Tablet</button>
          <button class="av-tool av-device-btn" data-device="mobile" title="Mobil · 4">Mobil</button>
        </div>
        <div class="av-toolgroup">
          <button class="av-tool" id="avUndo" title="Undo · Ctrl+Z">↶</button>
          <button class="av-tool" id="avRedo" title="Redo · Ctrl+Shift+Z">↷</button>
          <button class="av-tool" id="avFocus" title="Preview focus · F">Focus</button>
          <button class="av-tool" id="avCommands" title="Comenzi · Ctrl+K">⌘K</button>
        </div>
        <a class="av-tool gold" href="https://astrovip.ro/" target="_blank" rel="noopener" style="text-decoration:none">Site live ↗</a>
        <div id="avSaveState" class="av-save ok"><i></i><span>Pregătit</span></div>`;
      const previewbar=preview.querySelector('.previewbar');
      if(previewbar)previewbar.after(bar); else preview.prepend(bar);
    }

    function setSaveState(text,state='ok'){
      const el=$(d,'avSaveState');
      if(!el)return;
      el.className='av-save '+state;
      const span=el.querySelector('span');
      if(span)span.textContent=text;
    }
    w.__avSetSaveState=setSaveState;

    function setDevice(mode){
      const box=d.querySelector('.framebox');
      if(!box)return;
      box.classList.remove('mobile');
      box.dataset.avDevice=mode;
      d.querySelectorAll('.av-device-btn').forEach(b=>b.classList.toggle('active',b.dataset.device===mode));
      safe(()=>localStorage.setItem('astrovip_editor_device_v10',mode));
    }
    const savedDevice=safe(()=>localStorage.getItem('astrovip_editor_device_v10'))||'desktop';
    setDevice(['desktop','laptop','tablet','mobile'].includes(savedDevice)?savedDevice:'desktop');
    d.querySelectorAll('.av-device-btn').forEach(btn=>btn.addEventListener('click',()=>setDevice(btn.dataset.device)));

    const history=[];
    let historyIndex=-1,replaying=false,historyTimer=0,autosaveTimer=0;
    const editable=()=>[...d.querySelectorAll('.panel input:not([readonly]):not([type=password]),.panel textarea:not([readonly]),.panel select')].filter(el=>el.id!=='avInspectorSearch');
    const snapshot=()=>editable().map((el,i)=>({i,id:el.id||'',path:el.dataset?.path||'',v:el.type==='checkbox'?!!el.checked:el.value,t:el.type}));
    const snapshotKey=s=>JSON.stringify(s);
    function pushHistory(){
      const snap=snapshot();
      if(historyIndex>=0&&snapshotKey(history[historyIndex])===snapshotKey(snap))return;
      history.splice(historyIndex+1);
      history.push(snap);
      if(history.length>60)history.shift();
      historyIndex=history.length-1;
    }
    function applySnapshot(snap){
      if(!snap)return;
      replaying=true;
      const els=editable();
      snap.forEach((x,i)=>{
        const el=els[i];
        if(!el)return;
        if(el.type==='checkbox')el.checked=!!x.v; else el.value=x.v??'';
        el.dispatchEvent(new Event('input',{bubbles:true}));
        el.dispatchEvent(new Event('change',{bubbles:true}));
      });
      replaying=false;
      setSaveState('Istoric aplicat','ok');
    }
    function undo(){if(historyIndex>0){historyIndex--;applySnapshot(history[historyIndex]);toast(w,'Undo')}}
    function redo(){if(historyIndex<history.length-1){historyIndex++;applySnapshot(history[historyIndex]);toast(w,'Redo')}}
    raf(()=>pushHistory());
    $(d,'avUndo')?.addEventListener('click',undo);
    $(d,'avRedo')?.addEventListener('click',redo);

    function autosave(){
      if(typeof w.saveLocal!=='function')return;
      setSaveState('Salvez draft…','busy');
      Promise.resolve(safe(()=>w.saveLocal())).then(()=>setSaveState('Draft salvat automat','ok')).catch(()=>setSaveState('Draft nesalvat','bad'));
    }
    panel?.addEventListener('input',e=>{
      if(replaying||e.target?.id==='avInspectorSearch')return;
      setSaveState('Modificări nesalvate','busy');
      clearTimeout(historyTimer);historyTimer=setTimeout(pushHistory,260);
      clearTimeout(autosaveTimer);autosaveTimer=setTimeout(autosave,950);
    },true);
    panel?.addEventListener('change',e=>{
      if(replaying||e.target?.id==='avInspectorSearch')return;
      clearTimeout(historyTimer);historyTimer=setTimeout(pushHistory,120);
      clearTimeout(autosaveTimer);autosaveTimer=setTimeout(autosave,700);
    },true);

    const generic=$(d,'genericControls');
    const tabs=generic?.querySelector('.simpleTabs');
    if(generic&&tabs&&!$(d,'avInspectorPresets')){
      const presets=d.createElement('div');
      presets.id='avInspectorPresets';
      presets.className='av-inspector-presets';
      presets.innerHTML=`
        <button class="av-preset" style="--swatch:#e8c75f" data-preset="obsidian">Obsidian + Aur</button>
        <button class="av-preset" style="--swatch:#39ff76" data-preset="neon">Neon Luxe</button>
        <button class="av-preset" style="--swatch:#f4fff7" data-preset="pearl">Pearl Glass</button>
        <button class="av-preset" style="--swatch:#94a69a" data-preset="soft">Soft Premium</button>`;
      tabs.after(presets);
      presets.addEventListener('click',e=>{
        const btn=e.target.closest('[data-preset]');if(!btn)return;
        applyPreset(btn.dataset.preset);
      });
    }
    function setVal(id,val){const el=$(d,id);if(!el)return;if(el.type==='checkbox')el.checked=!!val;else el.value=val}
    function applyPreset(name){
      const selected=$(d,'selectedInfo');
      if(!selected?.value){toast(w,'Selectează mai întâi un element din preview.');return}
      const map={
        obsidian:{color:'#fff4c2',background:'#050705',border:'#e8c75f',width:1,radius:18,opacity:100,weight:'900',glow:true},
        neon:{color:'#effff4',background:'#07110b',border:'#39ff76',width:1,radius:16,opacity:100,weight:'900',glow:true},
        pearl:{color:'#ffffff',background:'#17221c',border:'#d9eadf',width:1,radius:20,opacity:92,weight:'700',glow:false},
        soft:{color:'#f4f8f5',background:'#0a120d',border:'#5f7566',width:1,radius:14,opacity:96,weight:'700',glow:false}
      }[name];
      if(!map)return;
      setVal('styleColor',map.color);setVal('styleBackground',map.background);setVal('styleBorderColor',map.border);
      setVal('styleBorderWidth',map.width);setVal('styleRadius',map.radius);setVal('styleOpacity',map.opacity);
      setVal('styleFontWeight',map.weight);setVal('styleGlow',map.glow);
      safe(()=>typeof w.applySelectedText==='function'&&w.applySelectedText());
      pushHistory();setSaveState('Preset aplicat · draft','busy');
    }

    $(d,'avFocus')?.addEventListener('click',()=>{d.body.classList.toggle('av-focus');$(d,'avFocus').classList.toggle('active',d.body.classList.contains('av-focus'))});

    const palette=d.createElement('div');
    palette.id='avCommandPalette';
    palette.className='av-cmd';
    palette.innerHTML=`<div class="av-cmd-box"><div class="av-cmd-head"><span style="opacity:.55">⌕</span><input id="avCommandQuery" placeholder="Caută setare sau comandă…" autocomplete="off"><span class="av-cmd-kbd">ESC</span></div><div id="avCommandList" class="av-cmd-list"></div></div>`;
    d.body.appendChild(palette);
    const cmdQuery=$(d,'avCommandQuery'),cmdList=$(d,'avCommandList');
    let commands=[];
    function buildCommands(){
      commands=[
        {t:'Desktop preview',s:'Viewport 100%',i:'D',run:()=>setDevice('desktop')},
        {t:'Laptop preview',s:'1180 px',i:'L',run:()=>setDevice('laptop')},
        {t:'Tablet preview',s:'768 px',i:'T',run:()=>setDevice('tablet')},
        {t:'Mobil preview',s:'390 px',i:'M',run:()=>setDevice('mobile')},
        {t:'Focus preview',s:'Ascunde inspectorul',i:'F',run:()=>{$(d,'avFocus')?.click()}},
        {t:'Salvează draft',s:'Ctrl+S',i:'S',run:()=>safe(()=>w.saveLocal())},
        {t:'Publică',s:'Ctrl+Enter',i:'P',run:()=>safe(()=>w.publish())},
        {t:'Revino la publicat',s:'Restaurare',i:'R',run:()=>safe(()=>w.restorePublished())},
        {t:'Undo',s:'Ctrl+Z',i:'↶',run:undo},
        {t:'Redo',s:'Ctrl+Shift+Z',i:'↷',run:redo},
      ];
      d.querySelectorAll('.panel .field').forEach(field=>{
        const label=field.querySelector('label')?.textContent?.trim();
        const control=field.querySelector('input:not([readonly]),textarea:not([readonly]),select');
        if(!label||!control||control.id==='avInspectorSearch')return;
        const section=field.closest('.section')?.querySelector(':scope>h2')?.textContent?.trim()||'Inspector';
        commands.push({t:label,s:section,i:'•',run:()=>{
          field.closest('.section')?.classList.remove('av-collapsed');
          field.scrollIntoView({behavior:'smooth',block:'center'});
          setTimeout(()=>control.focus(),220);
        }});
      });
    }
    function renderCommands(q=''){
      buildCommands();
      const term=q.trim().toLowerCase();
      const list=commands.filter(c=>!term||(c.t+' '+c.s).toLowerCase().includes(term)).slice(0,40);
      cmdList.innerHTML=list.length?list.map((c,i)=>`<button class="av-cmd-item${i===0?' active':''}" data-ci="${commands.indexOf(c)}"><span class="av-cmd-icon">${esc(c.i)}</span><span class="av-cmd-text"><strong>${esc(c.t)}</strong><small>${esc(c.s)}</small></span></button>`).join(''):'<div class="av-empty">Nicio comandă găsită.</div>';
    }
    function openPalette(){
      renderCommands('');
      palette.classList.add('open');
      cmdQuery.value='';
      setTimeout(()=>cmdQuery.focus(),20);
    }
    function closePalette(){palette.classList.remove('open')}
    $(d,'avCommands')?.addEventListener('click',openPalette);
    palette.addEventListener('click',e=>{if(e.target===palette)closePalette();const item=e.target.closest('[data-ci]');if(item){commands[Number(item.dataset.ci)]?.run?.();closePalette()}});
    cmdQuery.addEventListener('input',()=>renderCommands(cmdQuery.value));
    cmdQuery.addEventListener('keydown',e=>{
      const items=[...cmdList.querySelectorAll('.av-cmd-item')];
      if(e.key==='Enter'){e.preventDefault();(items.find(x=>x.classList.contains('active'))||items[0])?.click()}
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        e.preventDefault();const cur=Math.max(0,items.findIndex(x=>x.classList.contains('active')));items.forEach(x=>x.classList.remove('active'));
        const next=e.key==='ArrowDown'?Math.min(items.length-1,cur+1):Math.max(0,cur-1);items[next]?.classList.add('active');items[next]?.scrollIntoView({block:'nearest'});
      }
      if(e.key==='Escape')closePalette();
    });

    d.addEventListener('keydown',e=>{
      const meta=e.ctrlKey||e.metaKey;
      if(meta&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
      if(meta&&e.key.toLowerCase()==='s'){e.preventDefault();safe(()=>w.saveLocal());setSaveState('Draft salvat','ok');return}
      if(meta&&e.key==='Enter'){e.preventDefault();safe(()=>w.publish());return}
      if(meta&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();undo();return}
      if(meta&&e.key.toLowerCase()==='z'&&e.shiftKey){e.preventDefault();redo();return}
      if(e.key==='Escape'&&palette.classList.contains('open')){closePalette();return}
      if(!meta&&!e.altKey&&!e.shiftKey&&d.activeElement?.tagName!=='INPUT'&&d.activeElement?.tagName!=='TEXTAREA'&&d.activeElement?.tagName!=='SELECT'){
        if(e.key==='1')setDevice('desktop');
        if(e.key==='2')setDevice('laptop');
        if(e.key==='3')setDevice('tablet');
        if(e.key==='4')setDevice('mobile');
        if(e.key.toLowerCase()==='f')$(d,'avFocus')?.click();
      }
    });

    let lastSelected='';
    setInterval(()=>{
      const selected=$(d,'selectedInfo')?.value||'';
      if(selected!==lastSelected){
        lastSelected=selected;
        const help=d.querySelector('.quickHelp');
        if(help&&selected)help.textContent='Selectat: '+selected+' · modifică în inspector';
      }
    },420);

    badge.textContent='ASTROVIP STUDIO · V10 ACTIV';
    setTimeout(()=>badge.classList.add('dim'),4200);
  }

  frame.addEventListener('load',()=>{
    try{enhance()}
    catch(e){
      console.error('AstroVip Studio V10 init failed',e);
      badge.textContent='STUDIO: eroare de inițializare';
      badge.classList.add('bad');
    }
  });
})();
</script>
</body>
</html>
