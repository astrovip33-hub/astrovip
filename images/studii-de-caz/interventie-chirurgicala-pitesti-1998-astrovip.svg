  <radialGradient id="glow"><stop stop-color="#fff7cf"/><stop offset=".22" stop-color="#ffd86a"/><stop offset=".52" stop-color="#e98920"/><stop offset="1" stop-color="#e98920" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6a3d00"/><stop offset=".25" stop-color="#e4b451"/><stop offset=".5" stop-color="#fff0a5"/><stop offset=".75" stop-color="#d59622"/><stop offset="1" stop-color="#593200"/></linearGradient>
  <linearGradient id="medical" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d9ff"/><stop offset=".55" stop-color="#1477d4"/><stop offset="1" stop-color="#173768"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7b42"/><stop offset=".6" stop-color="#c83e32"/><stop offset="1" stop-color="#7b1721"/></linearGradient>
