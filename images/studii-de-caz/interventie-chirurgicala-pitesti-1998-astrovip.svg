<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Intervenție chirurgicală — Pitești 1998 | AstroVip</title>
<desc id="desc">Ilustrație premium 4 la 3 pentru un studiu de caz astrologic: sală de operație stilizată, context militar la Pitești și simboluri pentru Pluto, Saturn, Neptun, Marte, Soare, Lună și Ascendent.</desc>
<defs>
