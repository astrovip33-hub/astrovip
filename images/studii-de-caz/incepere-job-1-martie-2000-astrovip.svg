<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Începerea unui nou job — AstroVip</title>
<desc id="d">Ilustrație premium în negru, auriu, albastru safir și verde smarald: un profesionist pășește către un skyline luminos, înconjurat de simboluri astrologice pentru Soare, MC, Venus, Mercur, Jupiter și Uranus.</desc>
<defs>
