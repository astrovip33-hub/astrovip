  <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse"><circle cx="10" cy="20" r="1.5" fill="#fff"/><circle cx="67" cy="42" r="1" fill="#e8c66c"/><circle cx="106" cy="80" r="1.4" fill="#63cfff"/><circle cx="39" cy="105" r=".8" fill="#fff"/></pattern>
</defs>
