  <radialGradient id="sun"><stop stop-color="#fffbe0"/><stop offset=".18" stop-color="#ffe27a"/><stop offset=".48" stop-color="#ffb51b"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
