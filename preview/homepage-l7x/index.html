<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AstroVip — Preview Header + Hero L7X</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
html,body{margin:0;min-height:100%;background:#020504;color:#f4f1e8;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.av-l7x-loader{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#020504;color:#e5c47f;font:700 12px/1.4 Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}.av-l7x-loader span{display:flex;align-items:center;gap:10px}.av-l7x-loader i{width:7px;height:7px;border-radius:50%;background:#b3e68c;box-shadow:0 0 16px rgba(179,230,140,.7)}
</style>
</head>
<body>
<div class="av-l7x-loader"><span><i></i>AstroVip · Header + Hero Preview</span></div>
<script>
(async function(){
  try{
    const res=await fetch('/?av_l7x_source=header-hero-v3',{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    let html=await res.text();
    const extras=`<base href="/">
<meta name="robots" content="noindex,nofollow,noarchive">
<link id="av-l7x-preview-css" rel="stylesheet" href="/assets/homepage-l7x-preview.css?v=20261026-headerhero3">
<style id="av-l7x-preview-badge-css">.av-preview-chip{position:fixed;z-index:2147483000;top:max(8px,env(safe-area-inset-top));right:9px;display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:6px 10px;border:1px solid rgba(229,196,127,.28);border-radius:999px;background:rgba(3,8,5,.84);box-shadow:0 8px 28px rgba(0,0,0,.42);backdrop-filter:blur(12px);color:#d9c28d;font:800 9px/1.2 Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}.av-preview-chip i{width:5px;height:5px;border-radius:50%;background:#b3e68c;box-shadow:0 0 10px rgba(179,230,140,.68)}@media(max-width:560px){.av-preview-chip{top:max(5px,env(safe-area-inset-top));right:5px;min-height:26px;padding:4px 8px;font-size:8px;opacity:.72}}</style>`;
    html=html.replace(/<head([^>]*)>/i,match=>match+extras);
    const tail=`<div class="av-preview-chip" aria-hidden="true"><i></i>Header + Hero</div><script>document.body.classList.add('av-l7x-preview');document.documentElement.classList.add('av-l7x-preview-html');<\/script>`;
    html=html.replace(/<\/body>/i,tail+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#020504;color:#f4f1e8;font-family:system-ui;text-align:center"><div><h1 style="color:#e5c47f">Preview Header + Hero</h1><p>Nu s-a putut încărca homepage-ul de bază.</p><p style="color:#9fa9a2;font-size:13px">'+String(err).replace(/[<>]/g,'')+'</p></div></main>';
  }
})();
</script>
</body>
</html>
