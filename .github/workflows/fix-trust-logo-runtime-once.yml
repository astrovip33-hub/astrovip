name: Fix trust logo runtime once

on:
  push:
    paths:
      - '.github/workflows/fix-trust-logo-runtime-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply definitive mobile trust logo sizing
        run: python scripts/fix_trust_logo_runtime.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile trust logo sizing at runtime [skip ci]"
          git push
