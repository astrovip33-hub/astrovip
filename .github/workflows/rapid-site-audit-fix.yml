name: Rapid site audit fixes

on:
  push:
    paths:
      - '.github/workflows/rapid-site-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply high impact fixes
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('.')

          # 1) Keep charset first, then Consent Mode v2 bootstrap.
          consent_re = re.compile(
              r'(<script id="astrovip-consent-default">.*?</script><link rel="stylesheet" href="/assets/consent-v2\.css\?v=2"><script defer src="/assets/consent-v2\.js\?v=2"></script>)',
              re.S,
          )
          for p in root.rglob('index.html'):
              text = p.read_text(encoding='utf-8')
              m = consent_re.search(text)
              if not m:
                  continue
              snippet = m.group(1)
              text = text[:m.start()] + text[m.end():]
              charset = re.search(r'<meta\s+[^>]*charset=["\']?utf-8["\']?[^>]*>', text, re.I)
              if charset:
                  text = text[:charset.end()] + snippet + text[charset.end():]
                  p.write_text(text, encoding='utf-8')

          # 2) Homepage UX + duplicate forum links + cache bust for fixed visitor counter.
          home = Path('index.html')
          text = home.read_text(encoding='utf-8')
          text = text.replace('<p><a class="cta" href="/comunitate/">Intră în Forumul AstroVip</a></p>', '')
          text = text.replace('<li><a href="/comunitate/">Comunitate</a></li>', '')
          text = text.replace('/assets/homepage.js?v=20260917-mobile-2', '/assets/homepage.js?v=20260917-audit-1')
          if 'href="/politica-cookie/">Politica de cookie-uri</a>' not in text:
              marker = '<p>Astrologia oferă orientare simbolică și consiliere și nu înlocuiește consultanța medicală, juridică sau financiară de specialitate.</p>'
              text = text.replace(marker, marker + '<p><a href="/politica-cookie/">Politica de cookie-uri</a></p>', 1)
          home.write_text(text, encoding='utf-8')

          # 3) Fix Supabase visitor counter request and hide the widget on transient failures.
          js_path = Path('assets/homepage.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace("headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},", "headers:{apikey:key,'Content-Type':'application/json'},")
          js = js.replace("visitorCountEl.textContent='—';\n        visitorCountEl.closest('.visitor-counter')?.classList.add('offline');", "visitorCountEl.closest('.visitor-counter')?.setAttribute('hidden','');")
          js_path.write_text(js, encoding='utf-8')

          # 4) Remove temporary cache-destroying headers; add HSTS and redirect duplicate community page.
          vpath = Path('vercel.json')
          cfg = json.loads(vpath.read_text(encoding='utf-8'))
          cfg['headers'] = [h for h in cfg.get('headers', []) if h.get('source') not in ('/', '/assets/planetary-ticker-core.js')]
          for h in cfg.get('headers', []):
              if h.get('source') == '/(.*)':
                  names = {x.get('key','').lower() for x in h.get('headers', [])}
                  if 'strict-transport-security' not in names:
                      h['headers'].append({'key':'Strict-Transport-Security','value':'max-age=31536000'})
          redirects = [r for r in cfg.get('redirects', []) if r.get('source') not in ('/comunitate','/comunitate/')]
          redirects.extend([
              {'source':'/comunitate','destination':'/forum/','permanent':True},
              {'source':'/comunitate/','destination':'/forum/','permanent':True},
          ])
          cfg['redirects'] = redirects
          vpath.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 5) Index valuable calculator pages and give each a canonical URL.
          calc_pages = {
              'astrocartografie/index.html': 'https://astrovip.ro/astrocartografie/',
              'relocare-geografica/index.html': 'https://astrovip.ro/relocare-geografica/',
              'sinastrie-calculator/index.html': 'https://astrovip.ro/sinastrie-calculator/',
          }
          for rel, canonical in calc_pages.items():
              p = Path(rel)
              t = p.read_text(encoding='utf-8')
              old = '<meta name="robots" content="noindex,nofollow">'
              new = '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><link rel="canonical" href="' + canonical + '">'
              if old in t:
                  t = t.replace(old, new, 1)
              elif 'rel="canonical"' not in t:
                  t = t.replace('</title>', '</title><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><link rel="canonical" href="' + canonical + '">', 1)
              p.write_text(t, encoding='utf-8')

          # 6) Keep the sitemap consistent: no duplicate /comunitate and no parameterized noindex personality template.
          sm = Path('sitemap.xml')
          lines = sm.read_text(encoding='utf-8').splitlines()
          lines = [line for line in lines if 'https://astrovip.ro/comunitate/' not in line and 'https://astrovip.ro/harta-personalitate/' not in line]
          sm.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # 7) Make forum server-rendered fallback honest instead of looking like a broken demo.
          fp = Path('forum/index.html')
          ft = fp.read_text(encoding='utf-8')
          ft = ft.replace('<strong id="statTopics">0</strong>', '<strong id="statTopics">—</strong>')
          ft = ft.replace('<strong id="statReplies">0</strong>', '<strong id="statReplies">—</strong>')
          ft = ft.replace('<strong id="statMembers">0</strong>', '<strong id="statMembers">—</strong>')
          ft = ft.replace('<div class="wrap notice" id="demoNotice" hidden><strong>Mod demonstrativ</strong><span>Datele nu sunt sincronizate.</span></div>', '<div class="wrap notice" id="demoNotice" hidden><strong>Conexiune temporar indisponibilă</strong><span>Reîncarcă pagina pentru sincronizarea datelor.</span></div>')
          fp.write_text(ft, encoding='utf-8')

      - name: Commit and publish fixes
        run: |
          rm -f .github/workflows/rapid-site-audit-fix.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Fix critical performance SEO and visitor counter issues"
          git push origin HEAD:main
