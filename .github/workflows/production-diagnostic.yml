name: Production resource diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public production responses
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, concurrent.futures
          urls=[base+path for base in ('https://astrovip.ro','https://astrovip.astrovip33.workers.dev') for path in ('/','/?audit=diagnostic','/assets/vendor/swisseph.wasm','/assets/vendor/swisseph.wasm?v=20261004-wasmfix2','/assets/ux-refresh-20261008.css','/robots.txt')]
          def check(url):
              try:
                  response=urllib.request.urlopen(url,timeout=20)
              except urllib.error.HTTPError as exc:
                  response=exc
              data=response.read()
              print(json.dumps({'url':url,'status':response.status,'headers':dict(response.headers),'bytes':len(data),'text':data[:500].decode('utf8','replace') if 'text' in response.headers.get('content-type','') else ''}))
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(check,urls))
          PY
