name: Add school case study chart

on:
  push:
    paths:
      - '.github/workflows/add-school-case-chart-once.yml'

permissions:
  contents: write

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble optimized chart asset
        run: |
          cat .tmp-school-chart/part00 .tmp-school-chart/part01 .tmp-school-chart/part02 .tmp-school-chart/part03 .tmp-school-chart/part04 .tmp-school-chart/part05 .tmp-school-chart/part06 .tmp-school-chart/part07 .tmp-school-chart/part08 > /tmp/chart.b64
          base64 -w0 .tmp-school-chart/part09.bin >> /tmp/chart.b64
          cat .tmp-school-chart/part10 .tmp-school-chart/part11 >> /tmp/chart.b64
          base64 -d /tmp/chart.b64 > assets/studiu-caz-clasa-i-harta-arce-tranzite-1984.webp
          test -s assets/studiu-caz-clasa-i-harta-arce-tranzite-1984.webp
          test "$(stat -c%s assets/studiu-caz-clasa-i-harta-arce-tranzite-1984.webp)" -gt 60000

      - name: Add chart to the dedicated case study
        shell: python
        run: |
          from pathlib import Path

          path = Path('studii-de-caz/inceput-clasa-i-1984/index.html')
          text = path.read_text(encoding='utf-8')

          css = '''
          .case-page .av-case-chart{margin:32px auto;max-width:860px}
          .case-page .av-case-chart a{display:block}
          .case-page .av-case-chart img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid rgba(237,198,126,.24);background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.28)}
          .case-page .av-case-chart figcaption{margin-top:12px;color:#aaa39a;font-size:.88rem;line-height:1.65}
          '''
          if '.case-page .av-case-chart{' not in text:
              text = text.replace('</style>', css + '</style>', 1)

          figure = '''
          <p>Graficul de mai jos reunește cele trei niveluri folosite în verificarea retrospectivă: harta natală, Arcele Solare și tranzitele pentru 17 septembrie 1984.</p>
          <figure class="av-case-chart">
          <a href="/assets/studiu-caz-clasa-i-harta-arce-tranzite-1984.webp" target="_blank" rel="noopener" aria-label="Mărește harta astrologică a studiului de caz">
          <img src="/assets/studiu-caz-clasa-i-harta-arce-tranzite-1984.webp" width="800" height="744" loading="lazy" decoding="async" alt="Hartă astrologică triplă pentru 17 septembrie 1984: harta natală, Arce Solare și tranzite, cu Jupiter dirijat evidențiat în raport cu Mercur și Venus natale."/>
          </a>
          <figcaption>Hartă de lucru AstroVip pentru 17 septembrie 1984: suprapunere între harta natală, Arcele Solare și tranzitele momentului. Marcajele evidențiază Jupiter dirijat și contactele urmărite cu Mercur și Venus natale. Apasă pe imagine pentru mărire.</figcaption>
          </figure>
          '''
          marker = '</dl>\n<h3>Jupiter în Arc Solar: deschiderea către o lume mai mare</h3>'
          if 'class="av-case-chart"' not in text:
              if marker not in text:
                  raise SystemExit('Case-study insertion marker not found')
              text = text.replace(marker, '</dl>\n' + figure + '<h3>Jupiter în Arc Solar: deschiderea către o lume mai mare</h3>', 1)

          old_schema = '"image":["https://astrovip.ro/assets/studiu-caz-inceperea-scolii-1984-1680.webp"]'
          new_schema = '"image":["https://astrovip.ro/assets/studiu-caz-inceperea-scolii-1984-1680.webp","https://astrovip.ro/assets/studiu-caz-clasa-i-harta-arce-tranzite-1984.webp"]'
          if old_schema in text:
              text = text.replace(old_schema, new_schema, 1)
          elif 'studiu-caz-clasa-i-harta-arce-tranzite-1984.webp' not in text.split('</head>', 1)[0]:
              raise SystemExit('Article schema image marker not found')

          path.write_text(text, encoding='utf-8')

      - name: Commit final asset and page update
        run: |
          rm -rf .tmp-school-chart
          rm -f .github/workflows/add-school-case-chart-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Add event chart to school case study"
          git push origin HEAD:main
