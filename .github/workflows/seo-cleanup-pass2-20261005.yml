name: SEO cleanup pass 2 2026-10-05

on:
  push:
    branches:
      - seo-remediate-2026-10-05
    paths:
      - scripts/seo_cleanup_pass2_20261005.py
      - .github/workflows/seo-cleanup-pass2-20261005.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: seo-remediate-2026-10-05
          fetch-depth: 0

      - name: Run metadata cleanup and validation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/seo_cleanup_pass2_20261005.py

      - name: Commit cleanup results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip SEO Bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No pass-2 changes to commit."
            exit 0
          fi
          git commit -m "SEO: finish audit cleanup outside Atlas"
          git push origin HEAD:seo-remediate-2026-10-05
