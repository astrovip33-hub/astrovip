name: Build SEO pages and live planet strip

on:
  push:
    paths:
      - '.github/workflows/build-seo-pages-planets-one-time.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SEO pages and homepage enhancements
        run: python scripts/build_seo_pages.py
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml astrolog-bucuresti consultatie-astrologica harta-natala astrologie-predictiva sinastrie astrocartografie-local-space numerologie rectificare-ora-nasterii pozitii-planete-live
          git diff --cached --quiet && exit 0
          git commit -m "Build SEO topic cluster and live planetary positions"
          git push
