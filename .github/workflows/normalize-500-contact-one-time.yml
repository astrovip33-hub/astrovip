name: Normalize 500 lei contact option

on:
  push:
    paths:
      - '.github/workflows/normalize-500-contact-one-time.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one premium consultation option in contact form
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<option>Analiză completă</option><option>Consultație premium</option>', '<option>Consultație premium — 500 lei / 60 min</option>')
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep only the 500 lei premium consultation option"
          git push
