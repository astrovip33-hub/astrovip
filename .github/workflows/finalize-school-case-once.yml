name: Finalize school case study homepage

on:
  push:
    paths:
      - '.github/workflows/finalize-school-case-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert homepage case study to teaser
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # The dedicated page owns Article structured data; the homepage remains a teaser.
          text = re.sub(
              r'<script type="application/ld\+json">\{"@context":"https://schema\.org","@type":"Article".*?</script>\n',
              '',
              text,
              count=1,
              flags=re.S,
          )

          teaser = '''<section id="studiu-de-caz-scoala-1984" aria-labelledby="studiu-scoala-titlu">
          <div class="wrap">
          <article class="av-case-card">
          <div class="av-case-intro">
          <figure class="av-case-visual">
          <a href="/studii-de-caz/inceput-clasa-i-1984/" aria-label="Deschide studiul de caz complet despre începerea clasei I">
          <img src="/assets/studiu-caz-inceperea-scolii-1984-1680.webp" srcset="/assets/studiu-caz-inceperea-scolii-1984-840.webp 840w, /assets/studiu-caz-inceperea-scolii-1984-1680.webp 1672w" sizes="(max-width: 820px) calc(100vw - 64px), (max-width: 1280px) 48vw, 580px" width="1672" height="941" loading="lazy" decoding="async" alt="Ilustrație AstroVip pentru studiul despre începerea școlii: un copil cu ghiozdan, o carte deschisă și intrarea unei școli în lumină aurie."/>
          </a>
          <figcaption>Ilustrație simbolică a începutului unui drum spre cunoaștere.</figcaption>
          </figure>
          <div class="av-case-copy">
          <p class="av-case-eyebrow">Din viață, în hartă · Studiu de caz 01</p>
          <h2 id="studiu-scoala-titlu">Prima zi de școală, privită prin Arce Solare</h2>
          <p class="av-case-meta"><time datetime="1984-09-17">17 septembrie 1984</time> · ora 07:00 · București</p>
          <p class="av-case-lead">Începerea clasei I marchează trecerea către un ritm nou de învățare, comunicare și integrare într-un colectiv. Studiul AstroVip urmărește retrospectiv acest reper biografic și îl corelează cu Jupiter în Arc Solar, aflat în careu cu Mercur și Venus natale.</p>
          <p class="av-case-signal"><strong>Reperul analizei</strong><br/>Jupiter în Arc Solar, în careu cu Mercur și Venus natale.</p>
          <div class="buttons" style="margin-top:22px"><a class="cta" href="/studii-de-caz/inceput-clasa-i-1984/">VEZI ANALIZA COMPLETĂ →</a></div>
          </div>
          </div>
          </article>
          </div>
          </section>'''

          pattern = r'<section id="studiu-de-caz-scoala-1984" aria-labelledby="studiu-scoala-titlu">.*?</section>\n(?=<section id="relocare")'
          text, n = re.subn(pattern, teaser + '\n', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one homepage case-study section, replaced {n}')

          old_link = '<a class="btn2" href="#studiu-de-caz-scoala-1984">Explorează studiul de caz</a>'
          new_link = '<a class="btn2" href="/studii-de-caz/inceput-clasa-i-1984/">Vezi analiza completă</a>'
          if old_link not in text:
              raise SystemExit('Library case-study link not found')
          text = text.replace(old_link, new_link, 1)
          text = text.replace('content="20260917-studiu-scoala-1" name="astrovip-release"', 'content="20260917-studiu-scoala-2" name="astrovip-release"', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit homepage finalization
        run: |
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Finalize school case study teaser and dedicated link"
            git push origin HEAD:main
          fi
