name: Change second homepage banner

on:
  push:
    paths:
      - '.github/workflows/finalize-school-case-once.yml'

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace second ticker with premium analysis message
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '<div class="planet-strip planet-strip-secondary" id="planet-strip-secondary"><div class="planet-strip-inner"><div class="planet-ticker" data-planet-ticker="">Se calculează pozițiile planetelor…</div></div></div>'
          item = '<span class="planet-item" role="listitem"><strong>Analiza Premium</strong><span>pentru Cariera - Dragoste - Afaceri - Relocare</span></span>'
          new = '<div class="planet-strip planet-strip-secondary" id="planet-strip-secondary" aria-label="Analiza Premium pentru Cariera - Dragoste - Afaceri - Relocare"><div class="planet-strip-inner"><div class="planet-ticker" tabindex="0" aria-label="Analiza Premium pentru Cariera - Dragoste - Afaceri - Relocare"><div class="planet-track" style="--ticker-duration:34s"><div class="planet-sequence" role="list">' + item + item + '</div><div class="planet-sequence" aria-hidden="true">' + item + item + '</div></div></div></div></div>'

          if old not in text:
              if 'Analiza Premium pentru Cariera - Dragoste - Afaceri - Relocare' in text:
                  raise SystemExit(0)
              raise SystemExit('Second banner marker not found')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit banner update
        run: |
          rm -f .github/workflows/finalize-school-case-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Update second banner premium analysis text"
          git push origin HEAD:main
