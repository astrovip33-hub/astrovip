name: Style second banner glossy

on:
  push:
    paths:
      - '.github/workflows/style-second-banner-once.yml'

permissions:
  contents: write

jobs:
  style-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply glossy red yellow gradient to second banner
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('assets/homepage-bundle-base.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* AstroVip second banner glossy red-gold */'
          block = r'''

/* AstroVip second banner glossy red-gold */
body #planet-strip-secondary .planet-item > strong,
body #planet-strip-secondary .planet-item > span{
  background:linear-gradient(180deg,#fffbd1 0%,#fff200 18%,#ffd000 34%,#ff9900 50%,#ff3b00 72%,#c90000 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent!important;
  font-weight:950;
  text-shadow:none;
  filter:drop-shadow(0 1px 0 rgba(255,255,200,.78)) drop-shadow(0 0 4px rgba(255,205,0,.60)) drop-shadow(0 0 8px rgba(255,48,0,.32));
}
body #planet-strip-secondary .planet-item > strong{
  letter-spacing:.025em;
}
'''
          if marker not in css:
              css = css.rstrip() + block + '\n'
          css_path.write_text(css, encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('homepage-bundle-base.css?v=20260917-banners-1', 'homepage-bundle-base.css?v=20260917-banners-2', 1)
          html_path.write_text(html, encoding='utf-8')

      - name: Commit and publish
        run: |
          rm -f .github/workflows/style-second-banner-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Apply glossy red gold text to second banner"
          git push origin HEAD:main
