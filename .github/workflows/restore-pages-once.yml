name: Restore AstroVip page navigation

on:
  push:
    paths:
      - '.github/workflows/restore-pages-once.yml'

permissions:
  contents: write

jobs:
  restore-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore page access and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          # "Hartă" must keep the compact label but open the actual interactive natal calculator.
          text = text.replace('<a href="/harta-natala/">Hartă</a>', '<a href="/harta-mea/">Hartă</a>', 1)

          marker = '<article class="seo-hub-card"><h3>Poziția planetelor live în zodiacul tropical</h3><p>Pozițiile live ale Soarelui, Lunii, Mercur, Venus, Marte, Jupiter, Saturn, Uranus, Neptun și Pluto în zodiacul tropical, actualizate automat.</p><a href="/pozitii-planete-live/">Citește ghidul →</a></article>'
          extra = '''<article class="seo-hub-card"><h3>Harta mea AstroVip</h3><p>Calculator natal interactiv cu poziții planetare, grade exacte și aspecte majore.</p><a href="/harta-mea/">Deschide calculatorul →</a></article><article class="seo-hub-card"><h3>Local Space AstroVip</h3><p>Busolă planetară 360°, azimuturi, altitudini și analiză pentru loc natal sau relocat.</p><a href="/local-space/">Deschide Local Space →</a></article><article class="seo-hub-card"><h3>Calculator Relocare</h3><p>Compară ASC, MC, DSC și IC între locul natal și destinația aleasă.</p><a href="/relocare-geografica/">Deschide relocarea →</a></article><article class="seo-hub-card"><h3>Calculator Astrocartografie</h3><p>Explorează liniile planetare ASC, DSC, MC și IC proiectate pe harta lumii.</p><a href="/astrocartografie/">Deschide astrocartografia →</a></article><article class="seo-hub-card"><h3>Calculator Sinastrie</h3><p>Compară două hărți natale prin aspecte și contacte cu axele principale.</p><a href="/sinastrie-calculator/">Deschide sinastria →</a></article><article class="seo-hub-card"><h3>Personalități AstroVip</h3><p>Bază astrologică cu 50 de personalități românești și internaționale.</p><a href="/personalitati/">Explorează baza de date →</a></article>'''
          if marker in text and '/personalitati/">Explorează baza de date' not in text:
              text = text.replace(marker, marker + extra, 1)

          index.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          xml = sitemap.read_text(encoding='utf-8')
          routes = [
              ('harta-mea', '0.9', 'weekly'),
              ('local-space', '0.9', 'monthly'),
              ('relocare-geografica', '0.8', 'monthly'),
              ('astrocartografie', '0.8', 'monthly'),
              ('sinastrie-calculator', '0.8', 'monthly'),
              ('personalitati', '0.8', 'weekly'),
              ('comunitate', '0.7', 'weekly'),
          ]
          additions = []
          for route, priority, freq in routes:
              loc = f'https://astrovip.ro/{route}/'
              if loc not in xml:
                  additions.append(f'''  <url>\n    <loc>{loc}</loc>\n    <lastmod>2026-09-16</lastmod>\n    <changefreq>{freq}</changefreq>\n    <priority>{priority}</priority>\n  </url>\n''')
          if additions:
              xml = xml.replace('</urlset>', ''.join(additions) + '</urlset>')
              sitemap.write_text(xml, encoding='utf-8')
          PY

          git config user.name "AstroVip Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Restore access to AstroVip pages"
            git push
          fi
