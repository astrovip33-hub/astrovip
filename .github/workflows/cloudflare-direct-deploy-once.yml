name: Deploy AstroVip directly to Cloudflare once

on:
  push:
    paths:
      - '.github/workflows/cloudflare-direct-deploy-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_1:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_2:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_3:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare API token found."
            exit 2
          fi

          ACCOUNT_ID="${ACCOUNT_1:-}"
          if [ -z "$ACCOUNT_ID" ]; then ACCOUNT_ID="${ACCOUNT_2:-}"; fi
          if [ -z "$ACCOUNT_ID" ]; then
            RESPONSE=$(curl -fsS               -H "Authorization: Bearer $TOKEN"               -H "Content-Type: application/json"               "https://api.cloudflare.com/client/v4/accounts?per_page=50")
            ACCOUNT_ID=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or [{}])[0].get("id",""))')
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not resolve Cloudflare account ID."
            exit 3
          fi

          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy current main to Cloudflare Worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Purge Cloudflare cache
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          ZONE_1: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ZONE_2: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_1:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_2:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_3:-}"; fi
          ZONE_ID="${ZONE_1:-}"
          if [ -z "$ZONE_ID" ]; then ZONE_ID="${ZONE_2:-}"; fi
          if [ -z "$ZONE_ID" ]; then
            ZONES=$(curl -fsS               -H "Authorization: Bearer $TOKEN"               -H "Content-Type: application/json"               "https://api.cloudflare.com/client/v4/zones?name=astrovip.ro&status=active")
            ZONE_ID=$(printf '%s' "$ZONES" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or [{}])[0].get("id",""))')
          fi
          curl -fsS -X POST             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             --data '{"purge_everything":true}'             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache"
