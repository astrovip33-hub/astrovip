name: UX UI remediation once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ux-ui-remediation-once.yml"

permissions:
  contents: write

concurrency:
  group: "astrovip-ux-ui-remediation"
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply UX UI remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          original = s

          # 1) Remove obsolete full-page desktop/mobile variants that duplicate the current homepage.
          legacy_start = "<!-- V63-DESKTOP-PROD-START -->"
          legacy_end = "<!-- V63-MOBILE-PROD-END -->"
          if legacy_start in s and legacy_end in s:
              a = s.index(legacy_start)
              b = s.index(legacy_end, a) + len(legacy_end)
              s = s[:a] + "\n<!-- Legacy V63 desktop/mobile page variants removed: UX/UI remediation 2026-10-07 -->\n" + s[b:]

          # 2) Simplify primary navigation. Detailed taxonomies remain reachable from their hub pages.
          menu_pattern = re.compile(
              r'<nav aria-label="Navigare principală" class="menu" id="menu">.*?</nav>',
              re.S,
          )
          simple_menu = '''<nav aria-label="Navigare principală" class="menu" id="menu">
          <a href="/">Acasă</a>
          <a href="#servicii">Servicii</a>
          <a href="/astrologie/">Astrologie</a>
          <a href="/instrumente-astrologie/">Instrumente</a>
          <a href="/studii-de-caz/">Studii de caz</a>
          <a href="/despre-astrovip/">Despre mine</a>
          <a href="#contact">Contact</a>
          <a class="av-menu-booking" href="#programari">Programare</a>
          </nav>'''
          s, menu_count = menu_pattern.subn(simple_menu, s, count=1)
          if menu_count != 1:
              raise SystemExit(f"Expected one main menu; replaced {menu_count}")

          # 3) Make every primary 'Programează' CTA use the on-site booking flow.
          booking_changes = 0
          anchor_pattern = re.compile(r'<a\b[^>]*href="https://wa\.me/[^\"]*"[^>]*>.*?</a>', re.S | re.I)
          def normalize_booking(match):
              global booking_changes
              tag = match.group(0)
              label = re.sub(r'<[^>]+>', ' ', tag)
              label = re.sub(r'\s+', ' ', label).strip().upper()
              if 'PROGRAMEAZ' not in label or 'WHATSAPP' in label:
                  return tag
              tag = re.sub(r'href="https://wa\.me/[^\"]*"', 'href="#programari"', tag, count=1, flags=re.I)
              tag = re.sub(r'\s+target="_blank"', '', tag, flags=re.I)
              tag = re.sub(r'\s+rel="noopener noreferrer"', '', tag, flags=re.I)
              tag = tag.replace('aria-label="Programează-te pe WhatsApp"', 'aria-label="Programează consultația"')
              booking_changes += 1
              return tag
          s = anchor_pattern.sub(normalize_booking, s)

          # 4) Remove premature direct Stripe payment CTA from step 1.
          stripe_pattern = re.compile(
              r'\s*<a class="cta" href="https://buy\.stripe\.com/[^\"]+" rel="noopener noreferrer" target="_self">PLĂTEȘTE CU CARDUL →</a>',
              re.I,
          )
          s, stripe_count = stripe_pattern.subn('', s, count=1)

          # 5) Keep a single visible Google Reviews ribbon sequence (no duplicated visual copy).
          duplicate_review = re.compile(
              r'\s*<div class="av-lang-reviews__sequence" aria-hidden="true">.*?</div>',
              re.S,
          )
          s, review_clone_count = duplicate_review.subn('', s, count=1)

          # 6) Add small, targeted UX overrides: mobile declutter + pricing disclosure + menu emphasis.
          ux_css = r'''
          <style id="av-ux-remediation-20261007">
          #av-lang-reviews .av-lang-reviews__track{animation:none!important;transform:none!important;justify-content:center!important}
          #av-lang-reviews .av-lang-reviews__sequence{margin-inline:auto!important}
          .menu .av-menu-booking{color:#111900!important;background:linear-gradient(180deg,#f5ff91,#cbed0c 55%,#a4d100)!important;border:1px solid rgba(239,255,114,.78)!important;border-radius:999px!important;padding:9px 14px!important;font-weight:950!important}
          .av-offers-grid .av-ux-offer-extra[hidden]{display:none!important}
          .av-ux-offers-toggle-wrap{display:flex;justify-content:center;margin:22px 0 0}
          .av-ux-offers-toggle{min-height:46px;padding:11px 19px;border-radius:999px;border:1px solid rgba(216,245,0,.62);background:rgba(6,25,54,.72);color:#fff;font-weight:900;cursor:pointer}
          .av-ux-offers-toggle:hover{background:rgba(216,245,0,.1)}
          @media(max-width:820px){
            .av-lower-planets,.av-ticker-card--axes{display:none!important}
            .menu .av-menu-booking{width:100%;justify-content:center;text-align:center}
          }
          </style>
          '''
          if 'id="av-ux-remediation-20261007"' not in s:
              s = s.replace('</head>', ux_css + '\n</head>', 1)

          ux_js = r'''
          <script id="av-ux-remediation-runtime-20261007">
          (()=>{
            const run=()=>{
              const grid=document.querySelector('.av-offers-grid');
              if(grid && !grid.dataset.uxTrimmed){
                grid.dataset.uxTrimmed='1';
                const cards=[...grid.querySelectorAll(':scope > .av-offer')];
                const featured=cards.find(card=>card.classList.contains('av-offer--featured')) || cards[cards.length-1];
                let regularKept=0;
                const extras=[];
                cards.forEach(card=>{
                  if(card===featured) return;
                  if(regularKept<5){regularKept++;return;}
                  card.classList.add('av-ux-offer-extra');
                  card.hidden=true;
                  extras.push(card);
                });
                if(extras.length){
                  const wrap=document.createElement('div');
                  wrap.className='av-ux-offers-toggle-wrap';
                  const btn=document.createElement('button');
                  btn.type='button';
                  btn.className='av-ux-offers-toggle';
                  btn.textContent='VEZI TOATE SERVICIILE →';
                  btn.setAttribute('aria-expanded','false');
                  btn.addEventListener('click',()=>{
                    const opening=btn.getAttribute('aria-expanded')!=='true';
                    extras.forEach(card=>card.hidden=!opening);
                    btn.setAttribute('aria-expanded',String(opening));
                    btn.textContent=opening?'ARATĂ DOAR SERVICIILE PRINCIPALE ↑':'VEZI TOATE SERVICIILE →';
                  });
                  wrap.appendChild(btn);
                  grid.after(wrap);
                }
              }
            };
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run,{once:true});
            else run();
          })();
          </script>
          '''
          if 'id="av-ux-remediation-runtime-20261007"' not in s:
              s = s.replace('</body>', ux_js + '\n</body>', 1)

          p.write_text(s, encoding="utf-8")

          # 7) Repair contradictory copy on the natal chart calculator page.
          hp = Path("harta-mea/index.html")
          h = hp.read_text(encoding="utf-8")
          h = h.replace(
              'Pentru calculul și interpretarea unghiurilor și caselor, consultă',
              'Pentru interpretarea unghiurilor și caselor, consultă'
          )
          h = h.replace(
              'Calculează separat <a href="/calculator-ascendent/"><strong>Ascendentul</strong></a>, compară două hărți',
              'Explorează și calculatorul dedicat pentru <a href="/calculator-ascendent/"><strong>Ascendent</strong></a>, compară două hărți'
          )
          h = h.replace(
              'Ascendentul, MC-ul și casele necesită un calcul separat bazat pe timpul sideral și coordonatele geografice; AstroVip le afișează numai în instrumentele în care sunt calculate explicit.',
              'Ascendentul, MC-ul și casele sunt calculate în acest instrument pe baza orei, timpului sideral și coordonatelor geografice introduse, folosind sistemul de case Koch.'
          )
          hp.write_text(h, encoding="utf-8")

          # Verification gates.
          if s.count('id="menu"') != 1:
              raise SystemExit("Verification failed: main menu is not unique")
          if legacy_start in s or legacy_end in s:
              raise SystemExit("Verification failed: legacy page variants remain")
          if 'PLĂTEȘTE CU CARDUL →</a>' in s:
              raise SystemExit("Verification failed: premature Stripe CTA remains")
          if 'Ascendentul, MC-ul și casele necesită un calcul separat' in h:
              raise SystemExit("Verification failed: contradictory natal copy remains")
          if '#programari' not in s:
              raise SystemExit("Verification failed: booking target missing")

          print('UX/UI remediation complete')
          print('booking CTAs normalized:', booking_changes)
          print('Stripe CTA removed:', stripe_count)
          print('review clone removed:', review_clone_count)
          print('index bytes:', len(original.encode("utf-8")), '->', len(s.encode("utf-8")))
          PY

      - name: Commit UX UI remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add index.html harta-mea/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Remediate AstroVip UX UI conversion flow"
          git push origin HEAD:main
