name: Optimize forum once

on:
  push:
    paths:
      - '.github/workflows/optimize-forum-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Optimize forum loading
        shell: bash
        run: |
          perl -0pi -e 's#<link rel="stylesheet" href="/forum/forum\.css">#<link rel="preconnect" href="https://hhzsecdtqacyroxiywpm.supabase.co" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="/forum/forum.css?v=20260917-opt1">#' forum/index.html
          perl -0pi -e 's#<script src="https://cdn\.jsdelivr\.net/npm/\@supabase/supabase-js\@2"></script>#<script defer src="https://cdn.jsdelivr.net/npm/\@supabase/supabase-js\@2"></script>#' forum/index.html
          perl -0pi -e 's#<script defer src="/forum/config\.js"></script>#<script defer src="/forum/config.js?v=20260917-opt1"></script>#' forum/index.html
          perl -0pi -e 's#<script defer src="/forum/forum\.js"></script>#<script defer src="/forum/forum.js?v=20260917-opt1"></script>#' forum/index.html
          perl -0pi -e 's#<img src="\$\{esc\(p\.avatar_url\)\}" alt="">#<img src="\$\{esc(p.avatar_url)\}" alt="" loading="lazy" decoding="async">#g' forum/forum.js
          grep -q 'preconnect.*supabase' forum/index.html
          grep -q 'script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"' forum/index.html
      - name: Commit optimized forum
        shell: bash
        run: |
          rm -f .github/workflows/optimize-forum-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Optimize forum loading and network hints"
          git push origin HEAD:main
