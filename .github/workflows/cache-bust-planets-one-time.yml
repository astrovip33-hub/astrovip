name: Cache bust live planetary ticker

on:
  push:
    paths:
      - '.github/workflows/cache-bust-planets-one-time.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch all pages to corrected ticker v2
        shell: python
        run: |
          from pathlib import Path
          changed = 0
          for p in Path('.').rglob('index.html'):
              s = p.read_text(encoding='utf-8')
              ns = s.replace('/assets/planetary-ticker.js','/assets/planetary-ticker-v2.js')
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed += 1
          print(f'Updated {changed} HTML files')
      - name: Commit cache-busted references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '*/index.html'
          git diff --cached --quiet && exit 0
          git commit -m "Use corrected cache-busted live planetary ticker"
          git push
