name: Deploy AstroVip to Cloudflare Worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-production"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare token
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN."
            exit 2
          fi

          # Reject accidental paste of curl/Bearer/multiline commands.
          case "$CLOUDFLARE_API_TOKEN" in
            *$'\n'*|*$'\r'*|*"Bearer "*|*"curl "*)
              echo "::error::CLOUDFLARE_API_TOKEN must contain only the raw token value."
              exit 3
              ;;
          esac

          RESPONSE=$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/user/tokens/verify")

          SUCCESS=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("success",False)).lower())')
          STATUS=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print(r.get("status",""))')

          if [ "$SUCCESS" != "true" ] || [ "$STATUS" != "active" ]; then
            echo "::error::Cloudflare API token is not valid/active."
            exit 4
          fi

          echo "Cloudflare API token verified."

      - name: Resolve Cloudflare account ID
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare account ID is already configured."
            exit 0
          fi

          RESPONSE=$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts")

          ACCOUNT_ID=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0].get("id","") if len(r)==1 else "")')

          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not auto-resolve one Cloudflare account. Add GitHub secret CLOUDFLARE_ACCOUNT_ID."
            exit 5
          fi

          echo "::add-mask::$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy AstroVip directly to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy

      - name: Verify live AstroVip
        shell: bash
        run: |
          set -euo pipefail
          for URL in             "https://astrovip.ro/"             "https://www.astrovip.ro/"             "https://astrovip.ro/assets/hero-vivid-desktop-v3.avif?v=20260919-fix3"             "https://astrovip.ro/assets/hero-vivid-mobile-v3.avif?v=20260919-fix3"
          do
            echo "Checking $URL"
            curl -fsSI --retry 8 --retry-delay 4 "$URL" | head -n 12
          done
