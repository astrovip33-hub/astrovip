name: Tune homepage banners

on:
  push:
    paths:
      - '.github/workflows/tune-banners-once.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase ticker text and double speed
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('assets/homepage-bundle-base.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('body .planet-strip .planet-track{display:flex;width:max-content;gap:0;padding:0;animation:avTicker var(--ticker-duration,70s) linear infinite;will-change:transform}', 'body .planet-strip .planet-track{display:flex;width:max-content;gap:0;padding:0;animation:avTicker var(--ticker-duration,35s) linear infinite;will-change:transform}')
          css = css.replace('body .planet-strip .planet-item{display:inline-flex;flex:none;align-items:center;gap:7px;padding:0;font-size:16px;line-height:1.5;white-space:nowrap}', 'body .planet-strip .planet-item{display:inline-flex;flex:none;align-items:center;gap:8px;padding:0;font-size:22px;line-height:1.45;white-space:nowrap}')
          css = css.replace('body .planet-strip .planet-glyph{font-size:22px;text-shadow:none}', 'body .planet-strip .planet-glyph{font-size:27px;text-shadow:none}')
          css = css.replace('.planet-sign{font-size:20px}', '.planet-sign{font-size:24px}')
          css = css.replace('@media(max-width:820px){body .planet-strip-inner{min-height:48px}body .planet-strip .planet-item{font-size:14px;gap:6px}body .planet-strip .planet-glyph{font-size:21px}.planet-sign{font-size:19px}.planet-sequence{gap:20px;padding:11px 20px 11px 0}}', '@media(max-width:820px){body .planet-strip-inner{min-height:52px}body .planet-strip .planet-item{font-size:19px;gap:7px}body .planet-strip .planet-glyph{font-size:25px}.planet-sign{font-size:22px}.planet-sequence{gap:22px;padding:12px 22px 12px 0}}')
          css_path.write_text(css, encoding='utf-8')

          js_path = Path('assets/planetary-ticker-core.js')
          js = js_path.read_text(encoding='utf-8')
          old = "track.style.setProperty('--ticker-duration',`${Math.max(60,width/35)}s`)"
          new = "track.style.setProperty('--ticker-duration',`${Math.max(30,width/70)}s`)"
          if old not in js:
              raise SystemExit('Primary ticker speed marker not found')
          js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          if '--ticker-duration:34s' not in html:
              raise SystemExit('Secondary ticker speed marker not found')
          html = html.replace('--ticker-duration:34s', '--ticker-duration:17s', 1)
          html = html.replace('planetary-ticker-core.js?v=20260917-mobile-2', 'planetary-ticker-core.js?v=20260917-banners-1', 1)
          html = html.replace('homepage-bundle-base.css?v=a23784fd7131', 'homepage-bundle-base.css?v=20260917-banners-1', 1)
          html_path.write_text(html, encoding='utf-8')

      - name: Commit tuned banners
        run: |
          rm -f .github/workflows/tune-banners-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Increase banner text and double ticker speed"
          git push origin HEAD:main
