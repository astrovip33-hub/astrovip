name: Style trust logos once

on:
  push:
    paths:
      - '.github/workflows/style-trust-logos-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update trust logos layout
        run: python scripts/adjust_trust_logos.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enlarge ANPC and AAR trust logos [skip ci]"
          git push
