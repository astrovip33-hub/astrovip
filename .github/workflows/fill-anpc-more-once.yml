name: Fill ANPC more once

on:
  push:
    paths:
      - '.github/workflows/fill-anpc-more-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand ANPC logo in its trust panel
        run: python scripts/fill_anpc_more.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand ANPC logo inside trust panel [skip ci]"
          git push
