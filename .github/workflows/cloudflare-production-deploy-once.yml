name: AstroVip Cloudflare production deploy probe

on:
  push:
    paths:
      - '.github/workflows/cloudflare-production-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect available Cloudflare auth and deploy
        shell: bash
        env:
          API_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          API_TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          API_KEY_1: ${{ secrets.CLOUDFLARE_API_KEY }}
          API_KEY_2: ${{ secrets.CF_API_KEY }}
          EMAIL_1: ${{ secrets.CLOUDFLARE_EMAIL }}
          EMAIL_2: ${{ secrets.CF_EMAIL }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          HOOK_1: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          HOOK_2: ${{ secrets.CF_DEPLOY_HOOK }}
          HOOK_3: ${{ secrets.DEPLOY_HOOK }}
          VAR_HOOK_1: ${{ vars.CLOUDFLARE_DEPLOY_HOOK }}
          VAR_HOOK_2: ${{ vars.CF_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          HOOK="${HOOK_1:-}"
          if [ -z "$HOOK" ]; then HOOK="${HOOK_2:-}"; fi
          if [ -z "$HOOK" ]; then HOOK="${HOOK_3:-}"; fi
          if [ -z "$HOOK" ]; then HOOK="${VAR_HOOK_1:-}"; fi
          if [ -z "$HOOK" ]; then HOOK="${VAR_HOOK_2:-}"; fi

          if [ -n "$HOOK" ]; then
            echo "Using Cloudflare deploy hook."
            curl -fsS -X POST "$HOOK"
            exit 0
          fi

          TOKEN="${API_TOKEN_1:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${API_TOKEN_2:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${API_TOKEN_3:-}"; fi
          ACCOUNT_ID="${ACCOUNT_1:-}"
          if [ -z "$ACCOUNT_ID" ]; then ACCOUNT_ID="${ACCOUNT_2:-}"; fi

          if [ -n "$TOKEN" ]; then
            echo "Using Cloudflare API token."
            if [ -z "$ACCOUNT_ID" ]; then
              RESPONSE=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
              ACCOUNT_ID=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or [{}])[0].get("id",""))')
            fi
            [ -n "$ACCOUNT_ID" ] || { echo "::error::Cloudflare account ID unavailable."; exit 4; }
            CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx --yes wrangler@latest deploy --config wrangler.jsonc
            exit 0
          fi

          API_KEY="${API_KEY_1:-}"
          if [ -z "$API_KEY" ]; then API_KEY="${API_KEY_2:-}"; fi
          EMAIL="${EMAIL_1:-}"
          if [ -z "$EMAIL" ]; then EMAIL="${EMAIL_2:-}"; fi

          if [ -n "$API_KEY" ] && [ -n "$EMAIL" ]; then
            echo "Using Cloudflare global API key."
            export CLOUDFLARE_API_KEY="$API_KEY"
            export CLOUDFLARE_EMAIL="$EMAIL"
            if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
            npx --yes wrangler@latest deploy --config wrangler.jsonc
            exit 0
          fi

          echo "::error::No Cloudflare auth or deploy hook found in GitHub production environment."
          exit 2
