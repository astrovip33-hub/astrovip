name: Fix AstroVip booking bridge once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-booking-bridge-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject cache-safe booking bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('worker.js')
          text=path.read_text(encoding='utf-8')
          old='      const runtime=heroPreloads+homepageRibbonCleanup+`<script src="/assets/page-editor-runtime.js?v=20261006-premium-wow3" defer></script>`;'
          new='      const runtime=heroPreloads+homepageRibbonCleanup+`<script src="/assets/booking-bridge-20261007.js" defer></script><script src="/assets/page-editor-runtime.js?v=20261006-premium-wow3" defer></script>`;'
          if old not in text:
              raise SystemExit('Runtime injection point not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Commit worker repair
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Fix booking CTA bridge across V63 layouts
          file_pattern: worker.js
