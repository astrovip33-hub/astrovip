name: Deploy AstroVip booking bridge repair

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-booking-bridge-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN"
            exit 2
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy current AstroVip Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy

      - name: Verify booking bridge asset
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://astrovip.ro/assets/booking-bridge-20261007.js?verify=${GITHUB_SHA}" | grep -q "revealBooking"
          echo "Booking bridge asset is live."

      - name: Verify booking bridge injection
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://astrovip.ro/?verify=${GITHUB_SHA}" | grep -q "/assets/booking-bridge-20261007.js"
          echo "Booking bridge is injected into production homepage."
