name: Premium V9 Preview

on:
  push:
    branches: ["feature/premium-platform-v9"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-v9-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd
    steps:
      - name: Checkout V9 branch
        uses: actions/checkout@v4

      - name: Build Swiss Ephemeris and Premium V9
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run build
          test -s assets/vendor/astrovip-swiss-koch.js
          test -s assets/vendor/swisseph.wasm
          test -s assets/premium-v9/main.js
          test -s assets/premium-v9/client.js
          test -s assets/premium-v9/booking.js
          test -s assets/premium-v9/report.js

      - name: Inject Premium V9 runtime
        run: python3 scripts/inject-premium-v9.py

      - name: Validate V9 artifacts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ASTROVIP_PREMIUM_V9" index.html
          grep -q "/assets/premium-v9/main.js" index.html
          grep -q "ASTROVIP_COMMAND_V9" command-center/index.html
          grep -q "Swiss Ephemeris" calculator/index.html
          grep -q "CLIENT PORTAL" client/index.html
          grep -q "PREMIUM BOOKING" booking/index.html
          grep -q "Raport personal" report/index.html
          node --check worker.js

      - name: Deploy isolated Cloudflare preview
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "::add-mask::$TOKEN"
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          npx --yes wrangler@latest deploy --config wrangler.v9-preview.jsonc

      - name: Verify V9 preview
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://astrovip-v9-preview.astrovip33.workers.dev"
          HOME_HTML=""
          for i in 1 2 3 4 5; do
            HOME_HTML="$(curl -fsS "$BASE/?v=${GITHUB_SHA}" || true)"
            if grep -Fq "/assets/premium-v9/main.js" <<<"$HOME_HTML"; then break; fi
            sleep 5
          done
          grep -Fq "/assets/premium-v9/main.js" <<<"$HOME_HTML"
          MAIN_JS="$(curl -fsS "$BASE/assets/premium-v9/main.js?v=${GITHUB_SHA}")"
          CALCULATOR_HTML="$(curl -fsS "$BASE/calculator/?v=${GITHUB_SHA}")"
          CLIENT_HTML="$(curl -fsS "$BASE/client/?v=${GITHUB_SHA}")"
          BOOKING_HTML="$(curl -fsS "$BASE/booking/?v=${GITHUB_SHA}")"
          REPORT_HTML="$(curl -fsS "$BASE/report/?v=${GITHUB_SHA}")"
          COMMAND_HTML="$(curl -fsS "$BASE/command-center/?v=${GITHUB_SHA}")"
          grep -Fq "AstroVip" <<<"$MAIN_JS"
          grep -Fq "Hartă natală interactivă" <<<"$CALCULATOR_HTML"
          grep -Fq "Contul meu AstroVip" <<<"$CLIENT_HTML"
          grep -Fq "Programare AstroVip Premium" <<<"$BOOKING_HTML"
          grep -Fq "Raport personal" <<<"$REPORT_HTML"
          grep -Fq "/command-center/v9-extension.js" <<<"$COMMAND_HTML"
          echo "Premium V9 preview verified."
