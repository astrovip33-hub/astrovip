name: V63 Rebuild Hero Layers

on:
  push:
    branches:
      - preview-mobile-v63-20261006

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-mobile-v63-20261006
      - name: Rebuild mobile Hero with separate clean layers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('premium-preview-v63/index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.hero{position:relative;min-height:680px;overflow:hidden;background:#020706}.hero-media{position:absolute;inset:0}.hero-media img{width:100%;height:100%;object-fit:cover;object-position:center 16%;filter:saturate(.94) contrast(1.06) brightness(.84)}.hero-media:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,4,3,.04) 0%,rgba(0,4,3,.08) 36%,rgba(1,6,5,.78) 63%,#020706 92%),radial-gradient(circle at 50% 28%,transparent 0 34%,rgba(0,0,0,.23) 68%,rgba(0,0,0,.48) 100%)}.hero-content{position:relative;z-index:3;padding:360px 20px 24px;text-align:center}'
          new_css = '.hero{position:relative;min-height:720px;overflow:hidden;background:#020706}.hero-media{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,5,5,.03) 0%,rgba(0,5,5,.08) 38%,rgba(1,7,6,.56) 65%,#020706 96%),url("/assets/hero-bg-textless-mobile.svg") center top/cover no-repeat,radial-gradient(circle at 50% 18%,rgba(24,92,73,.28),transparent 42%),#020706}.hero-media:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,transparent 0 27%,rgba(0,0,0,.09) 53%,rgba(0,0,0,.43) 100%),linear-gradient(180deg,transparent 0 43%,rgba(1,6,5,.18) 54%,rgba(1,6,5,.84) 79%,#020706 100%)}.hero-portrait{position:absolute;z-index:1;top:76px;left:50%;transform:translateX(-50%);width:92%;height:455px;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,#000 0 73%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0 73%,transparent 100%)}.hero-portrait img{display:block;width:100%;height:100%;object-fit:contain;object-position:center top;filter:saturate(.88) contrast(1.08) brightness(.82);opacity:.88}.hero-content{position:relative;z-index:3;padding:395px 20px 24px;text-align:center}'
          if old_css not in s:
              raise SystemExit('Expected V6.3 Hero CSS block not found')
          s = s.replace(old_css, new_css, 1)

          old_html = '  <div class="hero-media"><img src="/assets/astrovip-hero-user-20260921.jpg" alt="AstroVip — astrolog"></div>\n  <div class="hero-content">'
          new_html = '  <div class="hero-media" aria-hidden="true"></div>\n  <div class="hero-portrait"><img src="/assets/hero-final-static.webp" alt="AstroVip — astrolog"></div>\n  <div class="hero-content">'
          if old_html not in s:
              raise SystemExit('Expected V6.3 Hero HTML block not found')
          s = s.replace(old_html, new_html, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit layered Hero rebuild
        run: |
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add premium-preview-v63/index.html
          git commit -m "Rebuild V6.3 Hero with clean layered assets [skip ci]"
          git push origin preview-mobile-v63-20261006
