name: Deploy AstroVip to Cloudflare once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4

      - name: Resolve Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_1:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_2:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_3:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare API token found in repository secrets."
            exit 2
          fi

          ACCOUNT_ID="${ACCOUNT_1:-}"
          if [ -z "$ACCOUNT_ID" ]; then ACCOUNT_ID="${ACCOUNT_2:-}"; fi
          if [ -z "$ACCOUNT_ID" ]; then
            ZONES=$(curl -fsS               -H "Authorization: Bearer $TOKEN"               -H "Content-Type: application/json"               "https://api.cloudflare.com/client/v4/zones?name=astrovip.ro&status=active")
            ACCOUNT_ID=$(printf '%s' "$ZONES" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=(d.get("result") or [{}])[0]; print((r.get("account") or {}).get("id",""))')
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not resolve Cloudflare account ID."
            exit 3
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy Worker and static assets
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Purge AstroVip cache
        shell: bash
        run: |
          set -euo pipefail
          ZONES=$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/zones?name=astrovip.ro&status=active")
          ZONE_ID=$(printf '%s' "$ZONES" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or [{}])[0].get("id",""))')
          [ -n "$ZONE_ID" ]
          curl -fsS -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"purge_everything":true}'             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" >/dev/null
          echo "Deployment and cache purge completed."
