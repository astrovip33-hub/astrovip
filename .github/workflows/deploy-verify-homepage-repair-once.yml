# Verify the current modern homepage after cache-bust repair
name: Verify modern AstroVip homepage live

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-verify-homepage-repair-once.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Deploy exact current main
        run: npx --yes wrangler@latest deploy
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Render current live homepage
        shell: bash
        run: |
          cat > .verify-modern-home.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const results=[];
          for(const [name,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]]){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('https://astrovip.ro/?visual_verify='+Date.now()+'-'+name,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(3500);
            const reject=page.getByRole('button',{name:/Respinge opționale/i});
            if(await reject.count() && await reject.isVisible().catch(()=>false)) await reject.click({force:true}).catch(()=>{});
            await page.waitForTimeout(500);
            const data=await page.evaluate(()=>{
              const norm=s=>(s||'').replace(/\s+/g,' ').trim();
              const text=norm(document.body.innerText);
              const imgs=[...document.images].filter(i=>/hero/i.test((i.currentSrc||i.src||'')+' '+(i.alt||''))).map(i=>{const r=i.getBoundingClientRect(),s=getComputedStyle(i);return {src:i.currentSrc||i.src,alt:i.alt,natural:[i.naturalWidth,i.naturalHeight],rect:[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)],display:s.display,visibility:s.visibility,opacity:s.opacity}});
              const visibleEls=[...document.querySelectorAll('h1,h2,h3,p,div,span')].filter(el=>norm(el.textContent).includes('CUNOȘTI MOMENTUL')&&el.getBoundingClientRect().width>0&&el.getBoundingClientRect().height>0).slice(0,5).map(el=>{const r=el.getBoundingClientRect();return {tag:el.tagName,cls:el.className,rect:[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)],text:norm(el.textContent).slice(0,180)}});
              return {innerWidth,scrollWidth:document.documentElement.scrollWidth,lang:document.documentElement.lang,hasModernText:text.includes('CUNOȘTI MOMENTUL')&&text.includes('TRĂIEȘTI VIITORUL'),has33:text.includes('33')&&text.toLowerCase().includes('recenzi'),premiumCss:!!document.querySelector('#astrovip-premium-home-preview-css'),wowCss:!!document.querySelector('#astrovip-premium-home-wow-css'),bookingBridge:[...document.scripts].some(s=>(s.src||'').includes('booking-bridge-20261007.js')),runtime:[...document.scripts].map(s=>s.src||'').find(x=>x.includes('page-editor-runtime.js'))||'',visibleModern:visibleEls,heroImages:imgs,errors};
            });
            await page.screenshot({path:`modern-${name}.png`,fullPage:false});
            console.log('MODERN_HOME_RESULT '+name+' '+JSON.stringify(data));
            results.push({name,data});
            await context.close();
          }
          await browser.close();
          const fail=[];
          for(const r of results){
            if(!r.data.hasModernText)fail.push(r.name+': modern hero copy missing');
            if(r.data.innerWidth===390 && r.data.scrollWidth>392)fail.push(r.name+': horizontal overflow '+r.data.scrollWidth);
            if(!r.data.premiumCss||!r.data.wowCss)fail.push(r.name+': premium runtime CSS missing');
            if(!r.data.runtime.includes('20261007-1728-fresh'))fail.push(r.name+': fresh runtime query missing '+r.data.runtime);
            if(!r.data.bookingBridge)fail.push(r.name+': booking bridge missing');
          }
          if(fail.length){console.error('MODERN_HOME_FAILURE '+JSON.stringify(fail));process.exit(1)}
          console.log('MODERN_HOME_OK current premium homepage is rendered live');
          JS
          node .verify-modern-home.mjs
      - name: Upload live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-home-live-verification
          path: |
            modern-mobile.png
            modern-desktop.png
