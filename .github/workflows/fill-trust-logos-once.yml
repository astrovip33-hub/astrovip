name: Fill trust logos once

on:
  push:
    paths:
      - '.github/workflows/fill-trust-logos-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fill ANPC and AAR trust panels on mobile
        run: python scripts/fill_trust_logos.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fill ANPC and AAR trust panels on mobile [skip ci]"
          git push
