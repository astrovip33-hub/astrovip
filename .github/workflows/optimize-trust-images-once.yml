name: Optimize trust images once

on:
  push:
    paths:
      - '.github/workflows/optimize-trust-images-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Recompress trust images
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          specs={Path('assets/anpc.webp'):(600,300),Path('assets/codul-etic-astrologului.webp'):(800,260)}
          for path,bounds in specs.items():
              before=path.stat().st_size
              with Image.open(path) as im:
                  im.load()
                  if im.mode not in ('RGB','RGBA'):
                      im=im.convert('RGB')
                  im.thumbnail(bounds,Image.Resampling.LANCZOS)
                  tmp=Path('/tmp')/path.name
                  im.save(tmp,'WEBP',quality=78,method=6)
              after=tmp.stat().st_size
              if after<before:
                  path.write_bytes(tmp.read_bytes())
              print(path,before,'->',min(before,after))

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          html=re.sub(r'/assets/anpc\.webp\?v=[^\"\']+','/assets/anpc.webp?v=20260917-opt1',html,count=1)
          html=re.sub(r'/assets/codul-etic-astrologului\.webp\?v=[^\"\']+','/assets/codul-etic-astrologului.webp?v=20260917-opt1',html,count=1)
          index.write_text(html,encoding='utf-8')
          PY
      - name: Commit optimized assets
        shell: bash
        run: |
          rm -f .github/workflows/optimize-trust-images-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Optimize trust images for faster loading"
          git push origin HEAD:main
