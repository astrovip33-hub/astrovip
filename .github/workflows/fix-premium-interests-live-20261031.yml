name: Fix premium interests live 20261031

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-premium-interests-live-20261031.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append final winning premium interests CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('assets/home-ultra-production-20261010.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* 2026-10-31 — FINAL premium interests cards, winning cascade */'
          block = r'''

/* 2026-10-31 — FINAL premium interests cards, winning cascade */
@media(max-width:820px){
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-interests{
  position:relative!important;
  display:block!important;
  width:auto!important;
  max-width:none!important;
  margin:12px 12px 16px!important;
  padding:22px 12px 24px!important;
  box-sizing:border-box!important;
  overflow:hidden!important;
  border:1px solid rgba(63,255,150,.50)!important;
  border-radius:24px!important;
  background:
    radial-gradient(circle at 8% 7%,rgba(38,255,137,.16),transparent 28%),
    radial-gradient(circle at 90% 92%,rgba(224,183,69,.11),transparent 30%),
    linear-gradient(145deg,#031009 0%,#061a10 46%,#020704 100%)!important;
  box-shadow:inset 0 1px 0 rgba(255,245,201,.10),0 18px 42px rgba(0,0,0,.34),0 0 24px rgba(36,255,132,.07)!important;
}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-interests:before{
  content:""!important;
  position:absolute!important;
  inset:0!important;
  pointer-events:none!important;
  background:linear-gradient(118deg,transparent 0 38%,rgba(255,255,255,.025) 50%,transparent 62%)!important;
}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-interests h2{
  position:relative!important;
  z-index:1!important;
  width:100%!important;
  margin:0 0 20px!important;
  padding:0 4px!important;
  box-sizing:border-box!important;
  text-align:center!important;
  font-family:Georgia,'Times New Roman',serif!important;
  font-size:clamp(27px,8vw,34px)!important;
  line-height:1.04!important;
  letter-spacing:-.025em!important;
  font-weight:900!important;
  background:linear-gradient(180deg,#fff7d0 0%,#efd477 44%,#be8c2c 100%)!important;
  -webkit-background-clip:text!important;
  background-clip:text!important;
  color:transparent!important;
  -webkit-text-fill-color:transparent!important;
  text-shadow:0 0 18px rgba(224,183,69,.08)!important;
}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-grid{
  position:relative!important;
  z-index:1!important;
  display:grid!important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
  gap:12px!important;
  width:100%!important;
  align-items:stretch!important;
}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-card{
  position:relative!important;
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:flex-start!important;
  min-width:0!important;
  min-height:188px!important;
  height:100%!important;
  margin:0!important;
  padding:18px 11px 17px!important;
  box-sizing:border-box!important;
  overflow:hidden!important;
  border:1px solid rgba(71,255,156,.66)!important;
  border-radius:21px!important;
  background:
    radial-gradient(circle at 18% 10%,rgba(36,255,134,.20),transparent 32%),
    radial-gradient(circle at 84% 90%,rgba(26,184,93,.13),transparent 36%),
    linear-gradient(145deg,#072417 0%,#04150d 48%,#020805 100%)!important;
  box-shadow:inset 0 1px 0 rgba(255,246,205,.12),inset 0 0 24px rgba(36,255,134,.045),0 14px 30px rgba(0,0,0,.30),0 0 14px rgba(31,255,128,.08)!important;
  text-align:center!important;
  text-decoration:none!important;
}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-card:before{
  content:"✦"!important;
  display:grid!important;
  place-items:center!important;
  width:35px!important;
  height:35px!important;
  margin:0 auto 10px!important;
  flex:0 0 35px!important;
  border:1px solid rgba(238,205,105,.66)!important;
  border-radius:50%!important;
  background:radial-gradient(circle,rgba(235,195,74,.10),rgba(0,0,0,.12) 72%)!important;
  color:#efd26f!important;
  font:700 16px/1 Georgia,serif!important;
  box-shadow:0 0 14px rgba(236,202,91,.12),inset 0 0 12px rgba(49,255,139,.06)!important;
}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-card b{
  display:block!important;
  width:100%!important;
  margin:0 0 10px!important;
  padding:0!important;
  color:#f1d276!important;
  font-family:Georgia,'Times New Roman',serif!important;
  font-size:clamp(20px,5.9vw,25px)!important;
  line-height:1.08!important;
  font-weight:800!important;
  letter-spacing:-.018em!important;
  text-align:center!important;
  white-space:normal!important;
  word-break:normal!important;
  overflow-wrap:normal!important;
  hyphens:none!important;
  text-wrap:balance!important;
  text-shadow:0 0 14px rgba(225,182,63,.12)!important;
}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-card b:after{
  content:""!important;
  display:block!important;
  width:44px!important;
  height:1px!important;
  margin:9px auto 0!important;
  background:linear-gradient(90deg,transparent,#d7b451,transparent)!important;
  box-shadow:0 0 6px rgba(223,184,66,.30)!important;
}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-card p{
  display:block!important;
  width:100%!important;
  max-width:15ch!important;
  margin:auto auto 0!important;
  padding:0!important;
  color:#f3f6f1!important;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif!important;
  font-size:clamp(14px,4.0vw,17px)!important;
  line-height:1.34!important;
  font-weight:650!important;
  letter-spacing:-.012em!important;
  text-align:center!important;
  white-space:normal!important;
  word-break:normal!important;
  overflow-wrap:normal!important;
  hyphens:none!important;
  text-wrap:balance!important;
}
}
@media(max-width:374px){
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-interests{margin-inline:10px!important;padding-inline:10px!important}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-grid{gap:9px!important}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-card{min-height:184px!important;padding-inline:8px!important}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-card b{font-size:clamp(19px,5.7vw,22px)!important}
html.av-ultra-home-production body:not(.guide-page) #av-mobile-approved-home .avm-card p{font-size:13.5px!important;line-height:1.32!important}
}
'''
          if marker not in css:
              css = css.rstrip() + block + '\n'
              css_path.write_text(css, encoding='utf-8')

          worker = Path('worker-home-ultra.js')
          s = worker.read_text(encoding='utf-8')
          old = '/assets/home-ultra-production-20261010.css?v=20261023-polish-v4'
          new = '/assets/home-ultra-production-20261010.css?v=20261031-interests-final1'
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('Expected home production stylesheet version string not found')
          worker.write_text(s, encoding='utf-8')
          PY

          grep -q 'FINAL premium interests cards, winning cascade' assets/home-ultra-production-20261010.css
          grep -q '20261031-interests-final1' worker-home-ultra.js
          grep -q 'overflow-wrap:normal!important' assets/home-ultra-production-20261010.css

      - name: Commit final live fix
        run: |
          git config user.name "AstroVip Premium UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/home-ultra-production-20261010.css worker-home-ultra.js
          git diff --cached --check
          git commit -m "Fix premium interests cards in winning production cascade" || exit 0
          git push origin HEAD:main
