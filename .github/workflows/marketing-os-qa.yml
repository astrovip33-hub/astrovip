name: Marketing OS QA
on:
  push:
    paths:
      - 'command-center/v10/**'
      - 'command-center/site-builder/**'
      - 'command-center/editor-original/**'
      - 'assets/page-overrides-runtime.js'
      - 'worker-home-ultra.js'
      - 'scripts/test-editor*'
      - 'command*api*.js'
      - 'command-intelligence-snapshot.js'
      - 'scripts/test-marketing*'
      - 'scripts/import_marketing_exports.py'
      - '.github/workflows/marketing-os-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Security, data and regression tests
        run: |
          node --test scripts/test-command-center.mjs scripts/test-command-center-ui.mjs scripts/test-editor-publishing.mjs scripts/test-marketing-os.mjs scripts/test-marketing-workflows.mjs scripts/test-preview-boundaries.mjs
          python3 -m unittest discover -s scripts -p 'test_marketing_import.py'
          python3 -m unittest discover -s scripts -p 'test_operations_health.py'
      - name: Install browser validation runtime
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium --only-shell
      - name: Mobile, desktop, encoding and UI regression checks
        env:
          QA_OUTPUT: marketing-os-qa
        run: |
          node scripts/test-marketing-browser.mjs
          node scripts/test-editor-browser.mjs
      - name: Attach exact-commit QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-os-qa-${{ github.sha }}
          path: marketing-os-qa/
          retention-days: 14
