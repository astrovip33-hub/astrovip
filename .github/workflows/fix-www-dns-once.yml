name: Fix AstroVip www DNS and redirect once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-www-dns-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-www:
    runs-on: ubuntu-latest
    env:
      TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      ACCOUNT_ID_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_ID_1: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ZONE_ID_2: ${{ secrets.CF_ZONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find a Cloudflare token with DNS access
        shell: bash
        run: |
          set -u

          normalize() {
            printf '%s' "$1" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | sed -E 's/^[Bb]earer[[:space:]]+//; s/^"//; s/"$//'
          }

          SELECTED=""
          SELECTED_ZONE=""

          for RAW in "${TOKEN_1:-}" "${TOKEN_2:-}" "${TOKEN_3:-}"
          do
            [ -z "$RAW" ] && continue
            TOKEN=$(normalize "$RAW")
            [ -z "$TOKEN" ] && continue

            echo "::add-mask::$TOKEN"

            ZONE_ID="${ZONE_ID_1:-}"
            if [ -z "$ZONE_ID" ]; then ZONE_ID="${ZONE_ID_2:-}"; fi

            if [ -z "$ZONE_ID" ]; then
              HTTP=$(curl -sS -o /tmp/zones.json -w '%{http_code}' \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones?name=astrovip.ro&status=active")
              if [ "$HTTP" != "200" ]; then
                continue
              fi
              ZONE_ID=$(python3 -c 'import json; d=json.load(open("/tmp/zones.json")); r=d.get("result") or []; print(r[0].get("id","") if r else "")')
            fi

            [ -z "$ZONE_ID" ] && continue
            echo "::add-mask::$ZONE_ID"

            HTTP=$(curl -sS -o /tmp/dns.json -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=www.astrovip.ro")

            if [ "$HTTP" = "200" ]; then
              SELECTED="$TOKEN"
              SELECTED_ZONE="$ZONE_ID"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::None of the saved Cloudflare tokens can read DNS records for astrovip.ro."
            exit 20
          fi

          echo "::add-mask::$SELECTED"
          echo "::add-mask::$SELECTED_ZONE"
          echo "CLOUDFLARE_API_TOKEN=$SELECTED" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ZONE_ID=$SELECTED_ZONE" >> "$GITHUB_ENV"

          ACCOUNT_ID="${ACCOUNT_ID_1:-}"
          if [ -z "$ACCOUNT_ID" ]; then
            HTTP=$(curl -sS -o /tmp/accounts.json -w '%{http_code}' \
              -H "Authorization: Bearer $SELECTED" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts")
            if [ "$HTTP" = "200" ]; then
              ACCOUNT_ID=$(python3 -c 'import json; d=json.load(open("/tmp/accounts.json")); r=d.get("result") or []; print(r[0].get("id","") if len(r)==1 else "")')
            fi
          fi

          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not resolve Cloudflare account ID."
            exit 21
          fi

          echo "::add-mask::$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Ensure www.astrovip.ro is proxied
        shell: bash
        run: |
          set -euo pipefail

          DNS=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?name=www.astrovip.ro")

          python3 - <<'PY' > /tmp/records.tsv
import json
d=json.loads('''$DNS''')
for r in d.get("result") or []:
    if r.get("type") in {"A","AAAA","CNAME"}:
        print(r.get("id",""), str(r.get("proxied",False)).lower(), r.get("type",""), r.get("content",""), sep="\t")
PY

          if [ ! -s /tmp/records.tsv ]; then
            echo "No proxy-capable www record found; creating proxied CNAME."
            RESP=$(curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"type":"CNAME","name":"www","content":"astrovip.ro","ttl":1,"proxied":true}' \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records")
            printf '%s' "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success"), d'
          else
            while IFS=$'\t' read -r RECORD_ID PROXIED TYPE CONTENT
            do
              echo "www record: type=$TYPE content=$CONTENT proxied=$PROXIED"
              if [ "$PROXIED" != "true" ]; then
                RESP=$(curl -fsS -X PATCH \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data '{"proxied":true}' \
                  "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$RECORD_ID")
                printf '%s' "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success"), d'
              fi
            done < /tmp/records.tsv
          fi

      - name: Deploy www redirect Worker on route
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wrangler-www-route.jsonc <<'EOF'
          {
            "name": "astrovip-www-redirect",
            "main": "www-redirect-worker.js",
            "compatibility_date": "2026-09-20",
            "workers_dev": false,
            "routes": [
              { "pattern": "www.astrovip.ro/*", "zone_name": "astrovip.ro" }
            ]
          }
          EOF
          npx --yes wrangler@latest deploy --config /tmp/wrangler-www-route.jsonc

      - name: Verify www redirect
        shell: bash
        run: |
          set -euo pipefail
          sleep 10

          for SCHEME in https http
          do
            HDR=$(mktemp)
            STATUS=$(curl -sS -o /dev/null -D "$HDR" -w '%{http_code}' --max-redirs 0 --retry 8 --retry-delay 4 "$SCHEME://www.astrovip.ro/numerologie/?www_fix=1")
            LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$HDR")
            echo "$SCHEME www status: $STATUS"
            echo "$SCHEME www location: $LOCATION"

            if [ "$STATUS" != "301" ] || [ "$LOCATION" != "https://astrovip.ro/numerologie/?www_fix=1" ]; then
              echo "::error::$SCHEME www redirect verification failed."
              exit 30
            fi
          done

          echo "www.astrovip.ro now redirects canonically to https://astrovip.ro."
