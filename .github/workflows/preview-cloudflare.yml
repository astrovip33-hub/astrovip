name: AstroVip Preview

on:
  push:
    branches: ["preview/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "astrovip-preview-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 3; }
      - name: Deploy isolated preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.137.0 deploy \
            --config wrangler.preview.jsonc \
            --name astrovip-preview-mobile-hero \
            --no-routes
      - name: Verify preview
        shell: bash
        run: |
          set -euo pipefail
          URL="https://astrovip-preview-mobile-hero.astrovip33.workers.dev/"
          STATUS=$(curl -sS -o /tmp/preview.html -w '%{http_code}' --retry 8 --retry-delay 3 "$URL")
          test "$STATUS" = "200" || { echo "::error::Preview HTTP $STATUS"; exit 10; }
          grep -q 'mobile-hero-clean-20260924.css' /tmp/preview.html || { echo "::error::Clean mobile stylesheet missing"; exit 11; }
          grep -q '<h3>RELOCARE</h3>' /tmp/preview.html || { echo "::error::Hero relocation card missing"; exit 12; }
          echo "Preview URL: $URL"
