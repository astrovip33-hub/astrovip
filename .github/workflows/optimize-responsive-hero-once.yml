name: Optimize responsive mobile hero once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/optimize-responsive-hero-once.yml"

permissions:
  contents: write

concurrency:
  group: "astrovip-responsive-hero-optimizer"
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install WebP encoder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y webp

      - name: Build responsive WebP variants
        shell: bash
        run: |
          set -euo pipefail
          INPUT="assets/astrovip-hero-lux-clean-20260922.png"
          test -f "$INPUT"
          cwebp -quiet -mt -m 6 -q 87 -alpha_q 100 -metadata none -resize 640 0 "$INPUT" -o assets/astrovip-hero-lux-clean-20260922-640.webp
          cwebp -quiet -mt -m 6 -q 87 -alpha_q 100 -metadata none -resize 960 0 "$INPUT" -o assets/astrovip-hero-lux-clean-20260922-960.webp
          echo "640 bytes: $(stat -c%s assets/astrovip-hero-lux-clean-20260922-640.webp)"
          echo "960 bytes: $(stat -c%s assets/astrovip-hero-lux-clean-20260922-960.webp)"

      - name: Wire responsive Hero sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old_preload='<link rel="preload" as="image" href="/assets/astrovip-hero-lux-clean-20260922.webp?v=20260922-speed1" type="image/webp" media="(max-width:820px)" fetchpriority="high"/>'
          new_preload='<link rel="preload" as="image" imagesrcset="/assets/astrovip-hero-lux-clean-20260922-640.webp?v=20260922-rsp1 640w, /assets/astrovip-hero-lux-clean-20260922-960.webp?v=20260922-rsp1 960w" imagesizes="100vw" type="image/webp" media="(max-width:820px)" fetchpriority="high"/>'
          old_source='<source media="(max-width:820px)" srcset="/assets/astrovip-hero-lux-clean-20260922.webp?v=20260922-speed1" type="image/webp"/>'
          new_source='<source media="(max-width:820px)" srcset="/assets/astrovip-hero-lux-clean-20260922-640.webp?v=20260922-rsp1 640w, /assets/astrovip-hero-lux-clean-20260922-960.webp?v=20260922-rsp1 960w" sizes="100vw" type="image/webp"/>'

          if old_preload not in s:
              raise SystemExit("Expected current WebP preload not found")
          if old_source not in s:
              raise SystemExit("Expected current WebP source not found")

          s=s.replace(old_preload,new_preload,1)
          s=s.replace(old_source,new_source,1)
          p.write_text(s,encoding="utf-8")

          h=Path("_headers")
          hs=h.read_text(encoding="utf-8")
          rules=[]
          for name in ("astrovip-hero-lux-clean-20260922-640.webp","astrovip-hero-lux-clean-20260922-960.webp"):
              if f"/assets/{name}" not in hs:
                  rules.append(f"/assets/{name}\n  Cache-Control: public, max-age=31536000, immutable\n")
          if rules:
              h.write_text(hs.rstrip()+"\n\n"+"\n".join(rules),encoding="utf-8")
          PY

      - name: Commit responsive Hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add assets/astrovip-hero-lux-clean-20260922-640.webp assets/astrovip-hero-lux-clean-20260922-960.webp index.html _headers
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Serve responsive mobile Hero images"
          git push origin HEAD:main
