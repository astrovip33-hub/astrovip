name: About home live check

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/about-home-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for About asset live
        run: |
          set -euo pipefail
          OK=0
          for ATTEMPT in $(seq 1 30); do
            ASSET=$(curl -fsSL --retry 2 --retry-delay 2 "https://astrovip.ro/assets/home-case-studies-premium-20261014.js?about=${GITHUB_SHA}&attempt=${ATTEMPT}" || true)
            if grep -Fq 'av-about-home' <<< "$ASSET" && grep -Fq 'Cătălin Smaranda' <<< "$ASSET"; then
              echo "About asset live on attempt ${ATTEMPT}."
              OK=1
              break
            fi
            sleep 5
          done
          test "$OK" = "1"
      - name: Install browser driver
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          npm install --no-save --ignore-scripts puppeteer-core@24.26.1
      - name: Verify About section live on mobile
        run: |
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p=>fs.existsSync(p));
            const browser=await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
            await page.setUserAgent('Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 Chrome/141.0 Mobile Safari/537.36 AstroVipAboutHealth/1.0');
            await page.goto(`https://astrovip.ro/?about-live=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForSelector('#studii-de-caz-home',{visible:true,timeout:30000});
            await page.waitForSelector('#studii-de-caz-home .av-about-home',{visible:true,timeout:30000});
            await new Promise(r=>setTimeout(r,2200));
            await page.evaluate(()=>{const c=document.querySelector('#av-consent');if(c)c.setAttribute('hidden','');});
            const state=await page.evaluate(()=>{
              const section=document.querySelector('#studii-de-caz-home');
              const about=section?.querySelector('.av-about-home');
              const card=about?.querySelector('.av-about-home-card');
              const head=section?.querySelector('.av-case-showcase-head,.av-case-lux-head');
              const track=section?.querySelector('.av-case-showcase-grid');
              const nav=section?.querySelector('.av-case-mobile-nav-v7');
              const ar=about?.getBoundingClientRect(), hr=head?.getBoundingClientRect();
              return {
                text:(about?.innerText||'').replace(/\s+/g,' ').trim(),
                display:about?getComputedStyle(about).display:'missing',
                width:ar?Math.round(ar.width):0,
                height:ar?Math.round(ar.height):0,
                aboutTop:ar?Math.round(ar.top):0,
                casesTop:hr?Math.round(hr.top):0,
                cardBorder:card?getComputedStyle(card).borderTopWidth:'missing',
                cards:track?track.querySelectorAll('.av-case-showcase-card').length:0,
                nav:nav?getComputedStyle(nav).display:'missing'
              };
            });
            console.log('ABOUT LIVE',JSON.stringify(state));
            const errors=[];
            if(state.display==='none'||state.display==='missing') errors.push('about not visible');
            if(!state.text.includes('DESPRE MINE')) errors.push('missing DESPRE MINE');
            if(!state.text.includes('Cătălin Smaranda')) errors.push('missing name');
            if(!state.text.includes('33+ ANI EXPERIENȚĂ')) errors.push('missing experience');
            if(state.height<90||state.height>300) errors.push(`height=${state.height}`);
            if(state.width<330||state.width>390) errors.push(`width=${state.width}`);
            if(state.casesTop && state.aboutTop>=state.casesTop) errors.push(`order=${state.aboutTop}/${state.casesTop}`);
            if(state.cards<3) errors.push(`cards=${state.cards}`);
            const section=await page.$('#studii-de-caz-home');
            await section.screenshot({path:'/tmp/about-home-mobile-live.png'});
            await browser.close();
            if(errors.length){console.error('ABOUT LIVE FAILED:',errors.join(' | '));process.exit(1);}
            console.log('ABOUT LIVE OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload live screenshot
        uses: actions/upload-artifact@v4
        with:
          name: about-home-live-mobile
          path: /tmp/about-home-mobile-live.png
          retention-days: 7
