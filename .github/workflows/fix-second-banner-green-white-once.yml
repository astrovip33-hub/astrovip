name: Fix second banner green white

on:
  push:
    paths:
      - '.github/workflows/fix-second-banner-green-white-once.yml'

permissions:
  contents: write

jobs:
  fix-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace red-gold with glossy green-white on second banner
        shell: python
        run: |
          from pathlib import Path
          import re

          css_path = Path('assets/homepage-bundle-base.css')
          css = css_path.read_text(encoding='utf-8')

          pattern = re.compile(r'/\* AstroVip second banner glossy red-gold \*/.*?body #planet-strip-secondary \.planet-item > strong\{letter-spacing:\.025em;\}\n?', re.S)
          replacement = '''/* AstroVip second banner glossy green-white */
body #planet-strip-secondary .planet-item > strong,
body #planet-strip-secondary .planet-item > span{
  background:linear-gradient(180deg,#ffffff 0%,#f3fff7 14%,#caffdc 30%,#68ff9e 52%,#20df73 72%,#079c50 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent!important;
  font-weight:950;
  text-shadow:none;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.88)) drop-shadow(0 0 4px rgba(190,255,215,.62)) drop-shadow(0 0 9px rgba(32,223,115,.42));
}
body #planet-strip-secondary .planet-item > strong{letter-spacing:.025em;}
'''
          css2, n = pattern.subn(replacement, css, count=1)
          if n != 1:
              if '/* AstroVip second banner glossy green-white */' not in css:
                  css2 = css.rstrip() + '\n\n' + replacement
              else:
                  css2 = css
          css_path.write_text(css2, encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          html = re.sub(r'homepage-bundle-base\.css\?v=[^\"\']+', 'homepage-bundle-base.css?v=20260917-banners-green-1', html, count=1)
          html_path.write_text(html, encoding='utf-8')

      - name: Commit and publish
        run: |
          rm -f .github/workflows/fix-second-banner-green-white-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Make second banner glossy green white"
          git push origin HEAD:main
