name: Install Consent Mode v2

on:
  push:
    paths:
      - '.github/workflows/add-consent-mode-v2.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject consent bootstrap in public pages
        shell: python
        run: |
          from pathlib import Path
          snippet = '<script id="astrovip-consent-default">window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("consent","default",{analytics_storage:"denied",ad_storage:"denied",ad_user_data:"denied",ad_personalization:"denied",personalization_storage:"denied",functionality_storage:"granted",security_storage:"granted",wait_for_update:500});gtag("set","ads_data_redaction",true);</script><link rel="stylesheet" href="/assets/consent-v2.css?v=2"><script defer src="/assets/consent-v2.js?v=2"></script>'
          for p in Path('.').rglob('index.html'):
              if p.as_posix() == 'politica-cookie/index.html':
                  continue
              text = p.read_text(encoding='utf-8')
              if 'astrovip-consent-default' in text:
                  continue
              if '<head>' in text:
                  text = text.replace('<head>', '<head>' + snippet, 1)
                  p.write_text(text, encoding='utf-8')
          sm = Path('sitemap.xml')
          if sm.exists():
              s = sm.read_text(encoding='utf-8')
              entry = '<url><loc>https://astrovip.ro/politica-cookie/</loc></url>\n'
              if 'https://astrovip.ro/politica-cookie/' not in s:
                  sm.write_text(s.replace('</urlset>', entry + '</urlset>'), encoding='utf-8')
      - name: Commit consent integration
        run: |
          rm -f .github/workflows/add-consent-mode-v2.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Enable Consent Mode v2 across public pages"
          git push origin HEAD:main
