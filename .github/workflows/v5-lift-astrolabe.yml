name: V5 Lift Astrolabe

on:
  push:
    branches: ["preview-premium-home-v5-20261006"]
    paths:
      - ".github/workflows/v5-lift-astrolabe.yml"

permissions:
  contents: write

jobs:
  lift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-premium-home-v5-20261006
          fetch-depth: 0
      - name: Lift rotating astrolabe toward header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('premium-preview-v5/index.html')
          s = p.read_text(encoding='utf-8')
          reps = {
            '.hero-art{position:absolute;right:-3vw;top:50%;transform:translateY(-48%);width:min(58vw,850px);aspect-ratio:1;z-index:0}': '.hero-art{position:absolute;right:-1vw;top:13%;transform:none;width:min(54vw,780px);aspect-ratio:1;z-index:0}',
            '.hero-art{right:-12vw;width:70vw}': '.hero-art{top:12%;right:-10vw;width:66vw}',
            '.hero-art{right:-26vw;top:54%;width:92vw;opacity:.72}': '.hero-art{right:-24vw;top:11%;width:88vw;opacity:.68}',
            '.hero-art{width:114vw;right:-58vw;top:62%;opacity:.48}': '.hero-art{width:108vw;right:-54vw;top:9%;opacity:.44}',
            '.hero-art{width:122vw;right:-66vw;top:64%}': '.hero-art{width:116vw;right:-62vw;top:8%}'
          }
          for old, new in reps.items():
              if old not in s:
                  raise SystemExit(f'Missing expected CSS: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/v5-lift-astrolabe.yml
      - name: Commit preview adjustment
        run: |
          git config user.name "astrovip33-hub"
          git config user.email "actions@users.noreply.github.com"
          git add premium-preview-v5/index.html .github/workflows/v5-lift-astrolabe.yml
          git commit -m "Lift V5 astrolabe toward header [skip ci]"
          git push origin HEAD:preview-premium-home-v5-20261006
