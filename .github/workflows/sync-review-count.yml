name: Sync homepage Google reviews count

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-review-count.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize homepage review count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          replacements = (
              ("25+ RECENZII", "33+ RECENZII"),
              ("CELE 25 DE RECENZII", "CELE 33 DE RECENZII"),
              ("25 DE RECENZII", "33 DE RECENZII"),
              ("25 de recenzii", "33 de recenzii"),
              ('<div class="av-gr-count"><b>25</b><span>recenzii Google</span></div>', '<div class="av-gr-count"><b>33</b><span>recenzii Google</span></div>'),
          )
          for old, new in replacements:
              html = html.replace(old, new)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit source sync
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- index.html; then
            echo "Homepage source already uses 33 reviews."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync Google reviews count to 33 in homepage source [skip ci]"
          git push
