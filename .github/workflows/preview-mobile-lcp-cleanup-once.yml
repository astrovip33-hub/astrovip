name: Preview mobile LCP cleanup once

on:
  push:
    branches:
      - perf/mobile-lcp-cleanup-20261027
    paths:
      - .github/workflows/preview-mobile-lcp-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: perf/mobile-lcp-cleanup-20261027
          fetch-depth: 0

      - name: Remove stale competing Hero preloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          stale_mobile = '<link rel="preload" as="image" imagesrcset="/assets/astrovip-hero-mobile-clean-cards-480.avif 480w, /assets/astrovip-hero-mobile-clean-cards-640.avif 640w, /assets/astrovip-hero-mobile-clean-cards-736.avif 736w, /assets/astrovip-hero-mobile-clean-cards-941.avif 941w" imagesizes="100vw" type="image/avif" media="(max-width:820px)" fetchpriority="high"/>'
          stale_desktop = '<link rel="preload" as="image" imagesrcset="/assets/astrovip-hero-lux-clean-20260922-640.webp?v=20260922-desktop1 640w, /assets/astrovip-hero-lux-clean-20260922-960.webp?v=20260922-desktop1 960w, /assets/astrovip-hero-lux-clean-20260922.webp?v=20260922-desktop1 1672w" imagesizes="(min-width:1280px) 1400px, 100vw" type="image/webp" media="(min-width:821px)" fetchpriority="high"/>'

          current_mobile = '<link rel="preload" as="image" href="/assets/astrovip-hero-premium-mobile-20261001.webp?v=20261008-ux1" type="image/webp" media="(max-width:760px)" fetchpriority="high">'
          current_desktop = '<link rel="preload" as="image" href="/assets/astrovip-hero-desktop-final-20261002.avif?v=20261008-ux1" type="image/avif" media="(min-width:761px)" fetchpriority="high">'
          picture_mobile = '<source media="(max-width:760px)" srcset="/assets/astrovip-hero-premium-mobile-20261001.webp?v=20261008-ux1" type="image/webp" width="600" height="496">'
          picture_desktop = '<source media="(min-width:761px)" srcset="/assets/astrovip-hero-desktop-final-20261002.avif?v=20261008-ux1" type="image/avif" width="1280" height="720">'

          for label, needle in (
              ('stale mobile preload', stale_mobile),
              ('stale desktop preload', stale_desktop),
              ('current mobile preload', current_mobile),
              ('current desktop preload', current_desktop),
              ('current mobile picture source', picture_mobile),
              ('current desktop picture source', picture_desktop),
          ):
              count = s.count(needle)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')

          s = s.replace(stale_mobile, '', 1)
          s = s.replace(stale_desktop, '', 1)

          if 'astrovip-hero-mobile-clean-cards-480.avif' in s.split('</head>',1)[0]:
              raise SystemExit('stale mobile Hero preload still present in head')
          if 'astrovip-hero-lux-clean-20260922-640.webp?v=20260922-desktop1' in s.split('</head>',1)[0]:
              raise SystemExit('stale desktop Hero preload still present in head')
          if s.count(current_mobile) != 1 or s.count(current_desktop) != 1:
              raise SystemExit('current Hero preload pair changed unexpectedly')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Keep preview diff limited to index.html
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/preview-mobile-lcp-cleanup-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add index.html
          git commit -m "Perf: remove stale competing Hero preloads"
          git push origin HEAD:perf/mobile-lcp-cleanup-20261027
