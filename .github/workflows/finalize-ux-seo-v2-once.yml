name: Finalize UX navigation and SEO graph v2 once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-ux-seo-v2-once.yml"

permissions:
  contents: write

concurrency:
  group: "astrovip-finalize-ux-seo-v2"
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair compact navigation and current SEO graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Homepage: keep visible navigation compact while restoring crawlable hub links.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          compact = '''<a href="/despre-astrovip/">Despre mine</a>\n<a href="#contact">Contact</a>\n<a class="av-menu-booking" href="#programari">Programare</a>'''
          extended = '''<a href="/despre-astrovip/">Despre mine</a>\n<details class="av-menu-more">\n<summary>Mai multe</summary>\n<div class="av-menu-more-links">\n<a href="/biblioteca-astrologie/">Bibliotecă</a>\n<a href="/research/">Research</a>\n<a href="/video/">Video</a>\n<a href="/algoritm-pariuri-sportive/">Algoritm pariuri sportive</a>\n<a href="/astrolog/">Astrolog București</a>\n</div>\n</details>\n<a href="#contact">Contact</a>\n<a class="av-menu-booking" href="#programari">Programare</a>'''

          if 'class="av-menu-more"' not in s:
              if compact not in s:
                  raise SystemExit('Compact menu sequence not found')
              s = s.replace(compact, extended, 1)
          else:
              if '/algoritm-pariuri-sportive/' not in s:
                  s = s.replace('<a href="/video/">Video</a>', '<a href="/video/">Video</a>\n<a href="/algoritm-pariuri-sportive/">Algoritm pariuri sportive</a>', 1)
              if '/astrolog/' not in s:
                  s = s.replace('<a href="/algoritm-pariuri-sportive/">Algoritm pariuri sportive</a>', '<a href="/algoritm-pariuri-sportive/">Algoritm pariuri sportive</a>\n<a href="/astrolog/">Astrolog București</a>', 1)

          css = '''\n<style id="av-menu-more-ux-20261007">\n.menu .av-menu-more{position:relative;color:#fff;font-weight:800}\n.menu .av-menu-more>summary{list-style:none;cursor:pointer;opacity:.9;user-select:none}\n.menu .av-menu-more>summary::-webkit-details-marker{display:none}\n.menu .av-menu-more>summary::after{content:" ▾";color:#d8f500;font-size:.85em}\n.menu .av-menu-more[open]>summary::after{content:" ▴"}\n.menu .av-menu-more-links{position:absolute;top:calc(100% + 10px);right:0;min-width:220px;padding:10px;display:grid;gap:4px;background:rgba(4,17,38,.98);border:1px solid rgba(216,245,0,.34);border-radius:14px;box-shadow:0 18px 45px rgba(0,0,0,.38);z-index:50}\n.menu .av-menu-more-links a{padding:8px 10px;border-radius:9px;white-space:nowrap}\n.menu .av-menu-more-links a:hover{background:rgba(216,245,0,.08)}\n@media(max-width:820px){.menu .av-menu-more{width:100%}.menu .av-menu-more>summary{padding:8px 0}.menu .av-menu-more-links{position:static;min-width:0;margin-top:6px;box-shadow:none;background:rgba(255,255,255,.025)}.menu .av-menu-more-links a{width:100%}}\n</style>\n'''
          if 'id="av-menu-more-ux-20261007"' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          # /astrolog/: repair invalid internal links introduced by the new canonical landing page.
          ap = Path('astrolog/index.html')
          a = ap.read_text(encoding='utf-8')
          a = a.replace('href="/contact/"', 'href="/#contact"')
          # No privacy page exists in the repository; remove only the broken footer anchor.
          a = re.sub(r'\s*·\s*<a href="/politica-confidentialitate/">Confidențialitate</a>', '', a)
          ap.write_text(a, encoding='utf-8')
          PY

          python3 scripts/audit_seo_graph.py

      - name: Clean temporary remediation artifacts
        shell: bash
        run: |
          rm -f tmp/seo-audit-report.txt tmp/seo-audit-report-v2.txt
          rm -f .github/workflows/ux-ui-seo-link-fix-once.yml
          rm -f .github/workflows/ux-ui-seo-link-fix-v2-once.yml
          rm -f .github/workflows/seo-audit-diagnostic-once.yml
          rm -f .github/workflows/seo-audit-diagnostic-v2-once.yml
          rm -f .github/workflows/finalize-ux-seo-once.yml
          rm -f .github/workflows/finalize-ux-seo-v2-once.yml

      - name: Commit validated final state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "Finalize UX navigation and repair SEO graph"
          git push origin HEAD:main
