name: Remove About Me card and reviews once 20261101

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-about-reviews-once-20261101.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove About Me artwork card and public reviews
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []

          def write_if_changed(path, before, after):
              if after != before:
                  Path(path).write_text(after, encoding='utf-8')
                  changed.append(path)

          # 1) Homepage: remove the visible Google reviews block completely.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          s, n = re.subn(
              r'<section id="av-home-reviews"\b.*?</section>',
              '',
              s,
              count=1,
              flags=re.S | re.I,
          )
          if n != 1:
              raise SystemExit(f'Expected exactly one #av-home-reviews section, removed {n}')
          # Remove legacy reviews-only style block if still present.
          s = re.sub(
              r'\s*<style id="av-google-reviews-premium-20261004">.*?</style>\s*',
              '\n',
              s,
              count=1,
              flags=re.S | re.I,
          )
          write_if_changed(p, original, s)

          # 2) Case-studies module: remove the injected About Me card shown in the supplied image.
          p = Path('assets/home-case-studies-premium-20261014.js')
          s = p.read_text(encoding='utf-8')
          original = s
          s, n = re.subn(
              r'\s*<section class="av-about-home"\b.*?</section>\s*',
              '\n',
              s,
              count=1,
              flags=re.S | re.I,
          )
          if n != 1:
              raise SystemExit(f'Expected exactly one .av-about-home section, removed {n}')
          write_if_changed(p, original, s)

          # 3) Remove the homepage mobile allow-list exception for the now-deleted review section.
          p = Path('assets/home-ultra-production-20261010.css')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              original = s
              s = s.replace(':not(#av-home-reviews)', '')
              write_if_changed(p, original, s)

          # 4) Remove public navigation/AI references to the dedicated reviews page.
          p = Path('llms.txt')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              original = s
              lines = [line for line in s.splitlines() if '/recenzii/' not in line and 'Recenzii Google AstroVip' not in line]
              s = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')
              write_if_changed(p, original, s)

          # 5) Remove /recenzii/ from XML sitemaps.
          for p in Path('.').rglob('sitemap*.xml'):
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              s = re.sub(r'\s*<url>(?:(?!</url>).)*https://astrovip\.ro/recenzii/?(?:(?!</url>).)*</url>\s*', '\n', s, flags=re.S | re.I)
              s = re.sub(r'^.*https://astrovip\.ro/recenzii/?[^\n]*\n?', '', s, flags=re.M | re.I)
              write_if_changed(p, original, s)

          # 6) Remove ordinary HTML links to /recenzii/ across remaining pages.
          anchor_re = re.compile(r'\s*<a\b[^>]*href=["\']/recenzii/?["\'][^>]*>.*?</a>', re.S | re.I)
          for p in Path('.').rglob('*.html'):
              if p.as_posix() in {'index.html', 'recenzii/index.html'}:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              s = anchor_re.sub('', s)
              write_if_changed(p, original, s)

          # 7) Delete the dedicated reviews page itself.
          reviews_page = Path('recenzii/index.html')
          if reviews_page.exists():
              reviews_page.unlink()
              changed.append('recenzii/index.html (deleted)')

          print('Changed files:')
          for item in changed:
              print(' -', item)
          PY

          # Verification: the visible homepage blocks and dedicated page must be gone.
          ! grep -q 'id="av-home-reviews"' index.html
          ! grep -q '<section class="av-about-home"' assets/home-case-studies-premium-20261014.js
          test ! -f recenzii/index.html
          ! grep -RIl --include='*.html' --include='*.xml' --include='llms.txt' 'href="/recenzii/"\|https://astrovip.ro/recenzii/' . | grep -v '^./.git/'

      - name: Commit removal
        shell: bash
        run: |
          git config user.name "AstroVip Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove About Me card and reviews from public site" || exit 0
          git push origin HEAD:main
