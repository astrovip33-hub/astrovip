name: SEO entity homepage one-time normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-entity-homepage-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize canonical AstroVip entity on homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          index_path = Path('index.html')
          entity_path = Path('astrovip-entity.json')
          workflow_path = Path('.github/workflows/seo-entity-homepage-once.yml')

          html = index_path.read_text(encoding='utf-8')
          entity = json.loads(entity_path.read_text(encoding='utf-8'))

          # 1) Point the homepage Service to the canonical AstroVip organization.
          old_provider = '"provider":{"@type":"ProfessionalService","name":"AstroVip","url":"https://astrovip.ro/"}'
          new_provider = '"provider":{"@id":"https://astrovip.ro/#organization"}'
          provider_count = html.count(old_provider)
          if provider_count == 1:
              html = html.replace(old_provider, new_provider, 1)
          elif provider_count == 0 and new_provider in html:
              print('Service.provider already canonical; no replacement needed.')
          else:
              raise SystemExit(f'Unexpected provider match count: {provider_count}')

          # 2) Add only the canonical Organization + Person graph if homepage lacks it.
          graph_id = 'id="astrovip-entity-graph"'
          if graph_id not in html:
              nodes = entity.get('@graph', [])
              wanted_ids = {
                  'https://astrovip.ro/#organization',
                  'https://astrovip.ro/despre-astrovip/#catalin-smaranda',
              }
              core_nodes = [node for node in nodes if isinstance(node, dict) and node.get('@id') in wanted_ids]
              if {node.get('@id') for node in core_nodes} != wanted_ids:
                  raise SystemExit('Canonical Organization/Person nodes missing from astrovip-entity.json')
              core = {'@context': 'https://schema.org', '@graph': core_nodes}
              json.loads(json.dumps(core, ensure_ascii=False))
              script = '<script id="astrovip-entity-graph" type="application/ld+json">' + json.dumps(core, ensure_ascii=False, separators=(',', ':')) + '</script>\n'
              marker = '<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite"'
              if marker not in html:
                  raise SystemExit('WebSite JSON-LD insertion marker not found in index.html')
              html = html.replace(marker, script + marker, 1)
          else:
              print('Canonical entity graph already present on homepage; no insertion needed.')

          # 3) Guardrails: no aggregateRating introduced; every JSON-LD script remains valid JSON.
          if 'aggregateRating' in html:
              raise SystemExit('Guardrail failed: aggregateRating detected in homepage HTML')

          blocks = re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', html, flags=re.I | re.S)
          if not blocks:
              raise SystemExit('No JSON-LD blocks found after patch')
          for i, block in enumerate(blocks, 1):
              try:
                  json.loads(block.strip())
              except Exception as exc:
                  raise SystemExit(f'Invalid JSON-LD block #{i}: {exc}')

          # 4) Assert canonical relationship exists exactly as intended.
          if '"provider":{"@id":"https://astrovip.ro/#organization"}' not in html:
              raise SystemExit('Canonical Service.provider relation missing after patch')
          if graph_id not in html:
              raise SystemExit('Canonical entity graph missing after patch')

          index_path.write_text(html, encoding='utf-8')

          # One-time workflow: remove itself from the final normalization commit.
          if workflow_path.exists():
              workflow_path.unlink()

          print(f'Validated {len(blocks)} JSON-LD blocks. Homepage entity normalization ready.')
          PY

      - name: Commit normalized homepage
        shell: bash
        run: |
          git config user.name "AstroVip SEO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "SEO normalize canonical entity on homepage"
          git push origin HEAD:main
