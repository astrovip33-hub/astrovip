name: Switch homepage to CWV runtime

on:
  push:
    paths:
      - '.github/workflows/cwv-home-switch-once.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch homepage critical path
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's#<script[^>]*src="/assets/vendor/astronomy-engine-2\.1\.19\.min\.js"[^>]*></script>\s*##i' index.html
          perl -0pi -e 's#<script[^>]*src="/assets/planetary-ticker-core\.js\?v=[^"]+"[^>]*></script>\s*##i' index.html
          perl -0pi -e 's#</head>#<link rel="stylesheet" href="/assets/cwv-lite.css?v=20260917-cwv-2"/><script defer src="/assets/cwv-runtime.js?v=20260917-cwv-2"></script></head>#' index.html
          perl -0pi -e 's#id="visitorCount"#id="visitorCountIdle"#' index.html
          perl -0pi -e 's#\s*<aside aria-label="Toate paginile AstroVip" class="av-directory">.*?</aside>\s*#\n#s' index.html
          grep -q '/assets/cwv-runtime.js?v=20260917-cwv-2' index.html
          grep -q 'id="visitorCountIdle"' index.html
          if grep -q '/assets/vendor/astronomy-engine-2.1.19.min.js' index.html; then exit 21; fi
          if grep -q '/assets/planetary-ticker-core.js?v=' index.html; then exit 22; fi
      - name: Commit switch
        shell: bash
        run: |
          rm -f .github/workflows/cwv-home-switch-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Move homepage astronomy off critical path"
          git push origin HEAD:main
