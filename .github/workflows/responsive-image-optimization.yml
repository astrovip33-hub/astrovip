name: Materialize responsive homepage images

on:
  push:
    branches: ["fix/site-audit-20261024"]
    paths:
      - "scripts/optimize_responsive_images.py"
      - ".github/workflows/responsive-image-optimization.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: responsive-homepage-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate homepage image consumers
        shell: bash
        run: |
          set -euo pipefail
          echo 'ABOUT_IMAGE_REFERENCES'
          grep -RIn --exclude-dir=.git --exclude='*.webp' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' 'astrovip-despre-mine-20261020-960.webp' . || true
          echo 'CASE_IMAGE_REFERENCES'
          grep -RIn --exclude-dir=.git --exclude='*.webp' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' 'fundal-loto-premium-20261016-720.webp' . || true
          echo 'LOGO_REFERENCES'
          grep -RIn --exclude-dir=.git --exclude='*.webp' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' 'astrovip-logo-144-v1.png' . || true

      - name: Generate responsive variants and srcsets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 scripts/optimize_responsive_images.py
          git diff --check

      - name: Commit optimized assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html assets images/studii-de-caz; then
            echo "Responsive image assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add index.html assets images/studii-de-caz
          git commit -m "perf(images): add responsive homepage variants"
          git push origin HEAD:fix/site-audit-20261024
