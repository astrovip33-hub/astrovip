name: Materialize responsive homepage images

on:
  push:
    branches: ["fix/site-audit-20261024"]
    paths:
      - "scripts/optimize_responsive_images.py"
      - ".github/workflows/responsive-image-optimization.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: responsive-homepage-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and wire responsive image variants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 scripts/optimize_responsive_images.py
          git diff --check

      - name: Commit optimized assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html assets images/studii-de-caz studii-de-caz; then
            echo "Responsive image assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets images/studii-de-caz studii-de-caz
          git commit -m "perf(images): wire responsive homepage variants"
          git push origin HEAD:fix/site-audit-20261024
