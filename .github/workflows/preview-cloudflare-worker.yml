name: Preview AstroVip on Cloudflare

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build Swiss Ephemeris Koch browser bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run build:swiss
          test -s assets/vendor/astrovip-swiss-koch.js
          test -s assets/vendor/swisseph.wasm

      - name: Enforce AstroVip SEO quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality_gate_new_pages.py

      - name: Validate SEO links, metadata and canonical URLs
        run: python3 scripts/audit_seo_graph.py

      - name: Enrich structured data at deploy time
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/enrich_structured_data.py

      - name: Prepare clean mobile Hero image
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow pillow-avif-plugin
          python3 scripts/build_mobile_hero_clean.py

      - name: Validate Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          STATUS=$(curl -sS -o /tmp/cf-token.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          test "$STATUS" = "200"

      - name: Deploy preview to Cloudflare Workers
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.preview.jsonc

      - name: Verify preview
        shell: bash
        run: |
          set -euo pipefail
          URL="https://astrovip-preview-ux-compact.astrovip33.workers.dev/"
          STATUS=$(curl -sS -o /tmp/preview.html -w '%{http_code}' --retry 8 --retry-delay 3 "$URL")
          test "$STATUS" = "200"
          grep -q 'id="av-pro-title"' /tmp/preview.html
          grep -q 'ux-refresh-20261008.css?v=20261008-compact4' /tmp/preview.html
          grep -q 'site-editor-runtime.js' /tmp/preview.html
          echo "Preview live: $URL"

      - name: Verify visual editor
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://astrovip-preview-ux-compact.astrovip33.workers.dev"
          EDITOR_STATUS=$(curl -sSL -o /tmp/editor.html -w '%{http_code}' --retry 8 --retry-delay 3 "$BASE/command-center/editor/")
          echo "EDITOR_STATUS=$EDITOR_STATUS"
          test "$EDITOR_STATUS" = "200"
          grep -q 'Editor Vizual AstroVip' /tmp/editor.html
          API_STATUS=$(curl -sS -o /tmp/command-api.json -w '%{http_code}' "$BASE/api/command/ping")
          echo "API_STATUS=$API_STATUS"
          if [ "$API_STATUS" = "401" ]; then
            echo "Visual editor route OK; preview command API has auth configured."
          elif [ "$API_STATUS" = "503" ] && grep -q 'command_center_token_not_configured' /tmp/command-api.json; then
            echo "Visual editor route OK; preview command secret is intentionally not configured."
          else
            cat /tmp/command-api.json
            exit 1
          fi
