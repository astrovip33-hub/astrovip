name: Preview AstroVip on Cloudflare

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build Swiss Ephemeris Koch browser bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run build:swiss
          test -s assets/vendor/astrovip-swiss-koch.js
          test -s assets/vendor/swisseph.wasm

      - name: Enforce AstroVip SEO quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality_gate_new_pages.py

      - name: Validate SEO links, metadata and canonical URLs
        run: python3 scripts/audit_seo_graph.py

      - name: Validate site builder JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('command-center/site-builder/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No inline Site Builder script found')
          for i, script in enumerate(scripts):
              Path(f'/tmp/astrovip-site-builder-{i}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} Site Builder script(s)')
          PY
          for JS in /tmp/astrovip-site-builder-*.js; do node --check "$JS"; done

      - name: Enrich structured data at deploy time
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/enrich_structured_data.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="/assets/preview-home-ultra-premium-20261010.js?v=20261010-ultra1" defer></script>'
          if tag not in html:
              marker = '</body>'
              pos = html.lower().rfind(marker)
              if pos == -1:
                  raise SystemExit('Homepage body close tag not found')
              html = html[:pos] + tag + '\n' + html[pos:]
              path.write_text(html, encoding='utf-8')
          print('Ultra premium short homepage preview runtime injected')
          PY

      - name: Prepare clean mobile Hero image
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow pillow-avif-plugin
          python3 scripts/build_mobile_hero_clean.py

      - name: Validate Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          STATUS=$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          test "$STATUS" = "200"

      - name: Deploy preview to Cloudflare Workers
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.preview.jsonc

      - name: Verify preview
        shell: bash
        run: |
          set -euo pipefail
          URL="https://astrovip-preview-ux-compact.astrovip33.workers.dev/"
          READY=0
          for ATTEMPT in $(seq 1 12); do
            STATUS=$(curl -sS -o /tmp/preview.html -w '%{http_code}' "$URL")
            if [ "$STATUS" = "200" ] &&
               grep -Fq 'id="av-pro-title"' /tmp/preview.html &&
               grep -Fq 'ux-refresh-20261008.css?v=20261008-header1' /tmp/preview.html &&
               grep -Fq 'site-editor-runtime.js' /tmp/preview.html &&
               grep -Fq 'preview-home-ultra-premium-20261010.js?v=20261010-ultra1' /tmp/preview.html; then
              READY=1
              break
            fi
            echo "Waiting for current preview: attempt=$ATTEMPT status=$STATUS"
            sleep 3
          done
          test "$READY" = "1"
          echo "Preview live: $URL"

      - name: Verify premium site builder
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://astrovip-preview-ux-compact.astrovip33.workers.dev"

          EDITOR_STATUS=$(curl -sSL -o /tmp/editor.html -w '%{http_code}' --retry 8 --retry-delay 3 "$BASE/command-center/editor/")
          echo "EDITOR_STATUS=$EDITOR_STATUS"
          test "$EDITOR_STATUS" = "200"
          grep -Fq 'AstroVip Site Builder' /tmp/editor.html

          BUILDER_STATUS=$(curl -sS -o /tmp/site-builder.html -w '%{http_code}' --retry 8 --retry-delay 3 "$BASE/command-center/site-builder/")
          echo "BUILDER_STATUS=$BUILDER_STATUS"
          test "$BUILDER_STATUS" = "200"
          grep -Fq 'ASTROVIP SITE BUILDER' /tmp/site-builder.html
          grep -Fq 'SECTION LIBRARY' /tmp/site-builder.html
          grep -Fq 'PREFLIGHT' /tmp/site-builder.html
          grep -Fq '/command-center/editor-original/' /tmp/site-builder.html

          ENGINE_STATUS=$(curl -sS -o /tmp/editor-original.html -w '%{http_code}' --retry 8 --retry-delay 3 "$BASE/command-center/editor-original/")
          echo "ENGINE_STATUS=$ENGINE_STATUS"
          test "$ENGINE_STATUS" = "200"
          grep -Fq 'Editor Vizual AstroVip' /tmp/editor-original.html

          API_STATUS=$(curl -sS -o /tmp/command-api.json -w '%{http_code}' "$BASE/api/command/ping")
          echo "API_STATUS=$API_STATUS"
          if [ "$API_STATUS" = "401" ]; then
            echo "Premium builder routes OK; preview command API has auth configured."
          elif [ "$API_STATUS" = "503" ] && grep -q 'command_center_token_not_configured' /tmp/command-api.json; then
            echo "Premium builder routes OK; preview command secret is intentionally not configured."
          else
            cat /tmp/command-api.json
            exit 1
          fi
