name: Preview AstroVip on Cloudflare

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build lean 480px mobile Hero asset
        shell: bash
        run: |
          set -euo pipefail
          OUT="assets/astrovip-hero-lux-clean-20260922-480.webp"
          if [ ! -f "$OUT" ]; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y webp >/dev/null
            cwebp -quiet -mt -m 6 -q 80 -alpha_q 100 -metadata none -resize 480 0 assets/astrovip-hero-lux-clean-20260922.png -o "$OUT"
            echo "480 bytes: $(stat -c%s "$OUT")"
            git config user.name "astrovip33-hub"
            git config user.email "astrovip33@gmail.com"
            git add "$OUT"
            git commit -m "Perf: add 480px mobile Hero asset"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "480 Hero asset already exists: $(stat -c%s "$OUT") bytes"
          fi

      - name: Enforce AstroVip SEO quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality_gate_new_pages.py

      - name: Enrich structured data at deploy time
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/enrich_structured_data.py

      - name: Validate Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          STATUS=$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          test "$STATUS" = "200"

      - name: Deploy preview to Cloudflare Workers
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.preview.jsonc

      - name: Verify preview
        shell: bash
        run: |
          set -euo pipefail
          URL="https://astrovip-preview.astrovip33.workers.dev/"
          STATUS=$(curl -sS -o /tmp/preview.html -w '%{http_code}' --retry 8 --retry-delay 3 "$URL")
          test "$STATUS" = "200"
          grep -q 'ASTROLOGIE' /tmp/preview.html
          echo "Preview live: $URL"

      - name: Lighthouse mobile metrics
        shell: bash
        run: |
          set -euo pipefail
          URL="https://astrovip-preview.astrovip33.workers.dev/"
          npx --yes lighthouse "$URL" --only-categories=performance --form-factor=mobile --output=json --output-path=/tmp/lighthouse.json --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/lighthouse.json','utf8'));
          const a = d.audits;
          console.log('LH_PERF=' + Math.round(d.categories.performance.score*100));
          console.log('LH_FCP=' + a['first-contentful-paint'].displayValue);
          console.log('LH_LCP=' + a['largest-contentful-paint'].displayValue);
          console.log('LH_SPEED_INDEX=' + a['speed-index'].displayValue);
          console.log('LH_TBT=' + a['total-blocking-time'].displayValue);
          console.log('LH_CLS=' + a['cumulative-layout-shift'].displayValue);
          const rows = Object.values(a).filter(x => x && x.scoreDisplayMode !== 'notApplicable' && (x.score === null || x.score < 1)).map(x => ({
            id:x.id,
            score:x.score,
            title:x.title,
            display:x.displayValue || '',
            ms:x.numericValue || 0,
            savingsMs:(x.details && x.details.overallSavingsMs) || 0,
            savingsBytes:(x.details && x.details.overallSavingsBytes) || 0
          })).sort((p,q)=>(q.savingsMs-p.savingsMs)||(q.ms-p.ms));
          console.log('LH_DIAGNOSTICS_START');
          for (const x of rows.slice(0,24)) console.log(JSON.stringify(x));
          console.log('LH_DIAGNOSTICS_END');
          for (const id of ['image-delivery-insight','render-blocking-insight','mainthread-work-breakdown','network-requests']) {
            const x=a[id];
            if (!x) continue;
            console.log('LH_DETAIL_' + id + '_START');
            const items=(x.details && x.details.items) || [];
            for (const item of items.slice(0,20)) console.log(JSON.stringify(item));
            console.log('LH_DETAIL_' + id + '_END');
          }
          NODE
