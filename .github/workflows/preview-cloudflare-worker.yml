name: Preview AstroVip on Cloudflare

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce AstroVip SEO quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality_gate_new_pages.py

      - name: Enrich structured data at deploy time
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/enrich_structured_data.py

      - name: Validate Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          STATUS=$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          test "$STATUS" = "200"

      - name: Deploy preview to Cloudflare Workers
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.preview.jsonc

      - name: Verify preview
        shell: bash
        run: |
          set -euo pipefail
          URL="https://astrovip-preview.astrovip33.workers.dev/"
          STATUS=$(curl -sS -o /tmp/preview.html -w '%{http_code}' --retry 8 --retry-delay 3 "$URL")
          test "$STATUS" = "200"
          grep -q 'ASTROLOGIE' /tmp/preview.html
          echo "Preview live: $URL"

      - name: Lighthouse mobile metrics
        shell: bash
        run: |
          set -euo pipefail
          URL="https://astrovip-preview.astrovip33.workers.dev/"
          npx --yes lighthouse "$URL" --only-categories=performance --form-factor=mobile --output=json --output-path=/tmp/lighthouse.json --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/lighthouse.json','utf8'));
          const a = d.audits;
          console.log('LH_PERF=' + Math.round(d.categories.performance.score*100));
          console.log('LH_FCP=' + a['first-contentful-paint'].displayValue);
          console.log('LH_LCP=' + a['largest-contentful-paint'].displayValue);
          console.log('LH_SPEED_INDEX=' + a['speed-index'].displayValue);
          console.log('LH_TBT=' + a['total-blocking-time'].displayValue);
          console.log('LH_CLS=' + a['cumulative-layout-shift'].displayValue);
          NODE
