name: V63 Use User Photo

on:
  push:
    branches:
      - preview-mobile-v63-20261006

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-mobile-v63-20261006
      - name: Use clean user Hero photo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('premium-preview-v63/index.html')
          s = p.read_text(encoding='utf-8')
          old = '/assets/astrovip-hero-signature-mobile-clean-20261001.webp'
          new = '/assets/astrovip-hero-user-20260921.jpg'
          if old not in s:
              raise SystemExit('Expected current Hero asset not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Hero photo fix
        run: |
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add premium-preview-v63/index.html
          git commit -m "Use clean user photo in V6.3 Hero [skip ci]"
          git push origin preview-mobile-v63-20261006
