name: Remediate SE Ranking audit 2026-10-05

on:
  push:
    branches:
      - seo-remediate-2026-10-05
    paths:
      - scripts/remediate_se_audit_20261005.py
      - .github/workflows/seo-remediate-audit-20261005.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: seo-remediate-2026-10-05
          fetch-depth: 0

      - name: Install remediation tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          npm install --global terser clean-css-cli

      - name: Apply SE Ranking remediation outside Atlas
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/remediate_se_audit_20261005.py

      - name: Run existing AstroVip SEO graph audit
        shell: bash
        run: |
          python3 scripts/audit_seo_graph.py --json > /tmp/seo-graph.json || true
          cat /tmp/seo-graph.json

      - name: Commit remediation results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip SEO Bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation changes to commit."
            exit 0
          fi
          git commit -m "SEO: remediate SE Ranking audit outside Atlas"
          git push origin HEAD:seo-remediate-2026-10-05
