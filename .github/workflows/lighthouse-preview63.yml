name: Lighthouse preview 63
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-preview63.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g lighthouse@12
      - name: Audit preview
        run: |
          sleep 25
          lighthouse https://perf-lcp-20260923-astrovip.astrovip33.workers.dev/ --chrome-flags="--headless --no-sandbox" --only-categories=performance --output=json --output-path=preview.json
      - name: Print metrics
        run: |
          node <<'NODE'
          const j=require('./preview.json'); const a=j.audits;
          console.log('score',Math.round(j.categories.performance.score*100));
          for(const id of ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive']) console.log(id,a[id]?.displayValue||a[id]?.numericValue);
          const x=a['lcp-breakdown-insight']; if(x) console.log('lcp-breakdown',JSON.stringify(x.details));
          for(const id of ['uses-rel-preconnect','unused-css-rules','render-blocking-resources']) if(a[id]) console.log(id,JSON.stringify({displayValue:a[id].displayValue,details:a[id].details}));
          NODE
