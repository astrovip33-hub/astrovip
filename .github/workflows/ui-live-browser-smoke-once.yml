name: UI live browser smoke once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ui-live-browser-smoke-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run exact live browser checks
        shell: bash
        run: |
          cat > .astrovip-ui-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const results=[];
          async function test(name,viewport){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            await page.goto('https://astrovip.ro/?ui_smoke='+Date.now()+'-'+name,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2500);
            const reject=page.getByRole('button',{name:/Respinge opționale/i});
            if(await reject.count() && await reject.isVisible().catch(()=>false)) await reject.click().catch(()=>{});
            await page.waitForTimeout(500);
            const base=await page.evaluate(()=>({
              innerWidth,
              clientWidth:document.documentElement.clientWidth,
              scrollWidth:document.documentElement.scrollWidth,
              lang:document.documentElement.lang,
              title:document.title,
              overflowX:getComputedStyle(document.body).overflowX
            }));
            const hero=await page.evaluate(()=>{
              const imgs=[...document.images].map(img=>{const r=img.getBoundingClientRect();const s=getComputedStyle(img);return {src:img.currentSrc||img.src,natural:[img.naturalWidth,img.naturalHeight],rect:[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)],display:s.display,visibility:s.visibility,opacity:s.opacity,objectFit:s.objectFit,objectPosition:s.objectPosition}});
              const exact=imgs.filter(x=>/astrovip-hero-premium-mobile-20261001\.webp|astrovip-hero-desktop-final-20261002\.avif/i.test(x.src));
              return {exact,allHero:imgs.filter(x=>/hero/i.test(x.src)).slice(0,12)};
            });
            let menu=null;
            if(name==='mobile'){
              const hamb=page.locator('#hamb');
              const nav=page.locator('#menu');
              menu={hambVisible:await hamb.isVisible(),beforeExpanded:await hamb.getAttribute('aria-expanded'),beforeDisplay:await nav.evaluate(el=>getComputedStyle(el).display)};
              await hamb.click();
              await page.waitForTimeout(350);
              Object.assign(menu,await page.evaluate(()=>{
                const h=document.querySelector('#hamb'),m=document.querySelector('#menu');
                const mr=m.getBoundingClientRect();
                const lines=[...document.querySelectorAll('#hamb .hamb-line')].map(el=>{const s=getComputedStyle(el);const r=el.getBoundingClientRect();return {transform:s.transform,opacity:s.opacity,rect:[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)]}});
                const links=[...m.querySelectorAll('a')].map(a=>({text:(a.textContent||'').replace(/\s+/g,' ').trim(),href:a.getAttribute('href')}));
                return {afterExpanded:h.getAttribute('aria-expanded'),iconState:h.dataset.iconState||'',label:h.getAttribute('aria-label'),afterClass:m.className,display:getComputedStyle(m).display,visibility:getComputedStyle(m).visibility,rect:[Math.round(mr.x),Math.round(mr.y),Math.round(mr.width),Math.round(mr.height),Math.round(mr.right)],lines,links};
              }));
              await hamb.click();
              await page.waitForTimeout(180);
              menu.closed=await page.evaluate(()=>({expanded:document.querySelector('#hamb').getAttribute('aria-expanded'),iconState:document.querySelector('#hamb').dataset.iconState||'',display:getComputedStyle(document.querySelector('#menu')).display}));
            }
            await page.screenshot({path:`${name}.png`,fullPage:false});
            const out={name,viewport,base,hero,menu};
            console.log('ASTROVIP_EXACT_RESULT '+JSON.stringify(out));
            results.push(out);
            await context.close();
          }
          await test('mobile',{width:390,height:844});
          await test('desktop',{width:1440,height:900});
          await browser.close();
          const m=results.find(x=>x.name==='mobile'),d=results.find(x=>x.name==='desktop');
          const fail=[];
          if(m.base.innerWidth!==390||m.base.clientWidth!==390) fail.push(`mobile viewport wrong ${m.base.innerWidth}/${m.base.clientWidth}`);
          if(d.base.innerWidth!==1440||d.base.clientWidth!==1440) fail.push(`desktop viewport wrong ${d.base.innerWidth}/${d.base.clientWidth}`);
          if(m.base.scrollWidth>392) fail.push(`mobile horizontal overflow ${m.base.scrollWidth}`);
          if(m.base.lang!=='ro') fail.push('Romanian lang missing');
          if(m.hero.exact.length!==1 || !/premium-mobile/.test(m.hero.exact[0]?.src||'')) fail.push('exact mobile Hero not selected');
          if(d.hero.exact.length!==1 || !/desktop-final/.test(d.hero.exact[0]?.src||'')) fail.push('exact desktop Hero not selected');
          for(const [label,h] of [['mobile',m.hero.exact[0]],['desktop',d.hero.exact[0]]]){
            if(!h||h.natural[0]<1||h.natural[1]<1) fail.push(`${label} Hero not loaded`);
            if(h&&(h.display==='none'||h.visibility==='hidden'||h.opacity==='0'||h.rect[2]<10||h.rect[3]<10)) fail.push(`${label} Hero not visible`);
          }
          if(!m.menu?.hambVisible) fail.push('hamburger not visible at 390');
          if(m.menu?.beforeExpanded!=='false'||m.menu?.afterExpanded!=='true'||m.menu?.closed?.expanded!=='false') fail.push('hamburger open/close state broken');
          if(m.menu?.iconState!=='open'||m.menu?.closed?.iconState!=='closed') fail.push('hamburger icon state broken');
          if(m.menu?.display==='none'||m.menu?.visibility==='hidden') fail.push('Romanian menu not visible after click');
          if((m.menu?.rect?.[0]??-99)<-2||(m.menu?.rect?.[4]??999)>392) fail.push(`Romanian menu outside viewport ${JSON.stringify(m.menu?.rect)}`);
          const texts=(m.menu?.links||[]).map(x=>x.text).join(' | ');
          if(!texts.includes('Acasă')||!texts.includes('Programare')||!texts.includes('Contact')) fail.push('Romanian menu links incomplete');
          const program=(m.menu?.links||[]).find(x=>x.text==='Programare');
          if(program?.href!=='#programari') fail.push(`Programare href wrong ${program?.href}`);
          const transformed=(m.menu?.lines||[]).some(x=>x.transform!=='none')||(m.menu?.lines||[]).some(x=>x.opacity==='0');
          if(!transformed) fail.push('hamburger does not visually transform to close/X state');
          if(fail.length){console.error('ASTROVIP_EXACT_FAILURES '+JSON.stringify(fail));process.exit(1)}
          console.log('ASTROVIP_EXACT_OK mobile Hero, desktop Hero and Romanian menu passed exact checks');
          JS
          node .astrovip-ui-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrovip-ui-exact-screenshots
          path: |
            mobile.png
            desktop.png
