name: Remove homepage certification card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-footer-cert-cache.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove certification card loader from homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the exact CSS/JS loaders that dynamically create #av-cert-l7x.
          s = re.sub(r'\s*<link\s+id=["\']av-cert-l7x-css["\'][^>]*>\s*', '\n', s, flags=re.I)
          s = re.sub(r'\s*<script\s+id=["\']av-cert-l7x-js["\'][^>]*>\s*</script>\s*', '\n', s, flags=re.I)

          # Defensive cleanup if a static copy was ever inserted directly.
          s = re.sub(r'\s*<section\b[^>]*\bid=["\']av-cert-l7x["\'][\s\S]*?</section>\s*', '\n', s, count=1, flags=re.I)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit removal
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(home): remove astrolog certification card"
          git push origin HEAD:main
