name: Fix footer certification cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-footer-cert-cache.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force direct certification card assets into homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '/assets/footer-premium-runtime-20260923.css?v=20261026-singlecert3',
              '/assets/footer-premium-runtime-20260923.css?v=20261026-singlecert4'
          )
          s = s.replace(
              '/assets/footer-orbit-20261026.js?v=20261026-vivid1',
              '/assets/footer-orbit-20261026.js?v=20261026-vivid2'
          )

          marker = '<style id="av-footer-cert-extra-kill">'
          rules = '''<style id="av-footer-cert-extra-kill">
#astrovip-footer .av-footer-grid::after{
  content:none!important;
  display:none!important;
  background:none!important;
  background-image:none!important;
  width:0!important;
  height:0!important;
  min-width:0!important;
  min-height:0!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  box-shadow:none!important;
}
</style>'''
          if marker not in s:
              if '</head>' not in s:
                  raise SystemExit('Missing </head> in index.html')
              s = s.replace('</head>', rules + '\n</head>', 1)

          direct = '''<link id="av-cert-l7x-css" rel="stylesheet" href="/assets/certificare-card-20261026.css?v=20261026-live3">
<script id="av-cert-l7x-js" defer src="/assets/certificare-card-20261026.js?v=20261026-live3"></script>'''
          if 'id="av-cert-l7x-js"' not in s:
              if '</head>' not in s:
                  raise SystemExit('Missing </head> in index.html')
              s = s.replace('</head>', direct + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit direct homepage certification loader
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(home): load certification card directly"
          git push origin HEAD:main
