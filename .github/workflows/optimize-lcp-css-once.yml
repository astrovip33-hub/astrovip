name: Optimize LCP and below-fold CSS once

on:
  push:
    paths:
      - '.github/workflows/optimize-lcp-css-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Optimize hero and defer below-fold CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          hero=Path('assets/1000049884.webp')
          before=hero.stat().st_size
          with Image.open(hero) as im:
              im.load()
              if im.mode not in ('RGB','RGBA'):
                  im=im.convert('RGB')
              tmp=Path('/tmp/1000049884.webp')
              im.save(tmp,'WEBP',quality=80,method=6)
          after=tmp.stat().st_size
          if after < before:
              hero.write_bytes(tmp.read_bytes())
          print('hero',before,'->',min(before,after))

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<link href="/assets/homepage-trust-lux.css?v=d44f8e6dec9b" rel="stylesheet"/>', '<link href="/assets/homepage-trust-lux.css?v=20260917-nb1" rel="stylesheet" media="print" onload="this.media=\'all\'"/><noscript><link href="/assets/homepage-trust-lux.css?v=20260917-nb1" rel="stylesheet"/></noscript>', 1)
          s=s.replace('<link href="/assets/studiu-caz-scoala.css?v=20260917-1" rel="stylesheet"/>', '<link href="/assets/studiu-caz-scoala.css?v=20260917-nb1" rel="stylesheet" media="print" onload="this.media=\'all\'"/><noscript><link href="/assets/studiu-caz-scoala.css?v=20260917-nb1" rel="stylesheet"/></noscript>', 1)
          s=re.sub(r'/assets/1000049884\.webp\?v=[^\"\']+', '/assets/1000049884.webp?v=20260917-lcp1', s)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'homepage-trust-lux.css?v=20260917-nb1.*media="print"' index.html
          grep -q 'studiu-caz-scoala.css?v=20260917-nb1.*media="print"' index.html
      - name: Commit optimized assets
        shell: bash
        run: |
          rm -f .github/workflows/optimize-lcp-css-once.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Optimize hero LCP and defer below-fold CSS"
          git push origin HEAD:main
