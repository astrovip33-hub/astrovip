name: Preserve SEO graph in simplified UX navigation once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ux-ui-seo-link-fix-once.yml"

permissions:
  contents: write

concurrency:
  group: "astrovip-ux-ui-seo-link-fix"
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore crawlable hub links without re-bloating UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          needle='''<a href="/despre-astrovip/">Despre mine</a>\n          <a href="#contact">Contact</a>\n          <a class="av-menu-booking" href="#programari">Programare</a>'''
          replacement='''<a href="/despre-astrovip/">Despre mine</a>\n          <details class="av-menu-more">\n            <summary>Mai multe</summary>\n            <div class="av-menu-more-links">\n              <a href="/biblioteca-astrologie/">Bibliotecă</a>\n              <a href="/research/">Research</a>\n              <a href="/video/">Video</a>\n            </div>\n          </details>\n          <a href="#contact">Contact</a>\n          <a class="av-menu-booking" href="#programari">Programare</a>'''
          if needle not in s:
              raise SystemExit('Simplified menu anchor sequence not found')
          s=s.replace(needle,replacement,1)

          css='''\n<style id="av-menu-more-ux-20261007">\n.menu .av-menu-more{position:relative;color:#fff;font-weight:800}\n.menu .av-menu-more>summary{list-style:none;cursor:pointer;opacity:.9;user-select:none}\n.menu .av-menu-more>summary::-webkit-details-marker{display:none}\n.menu .av-menu-more>summary::after{content:" ▾";color:#d8f500;font-size:.85em}\n.menu .av-menu-more[open]>summary::after{content:" ▴"}\n.menu .av-menu-more-links{position:absolute;top:calc(100% + 10px);right:0;min-width:180px;padding:10px;display:grid;gap:4px;background:rgba(4,17,38,.98);border:1px solid rgba(216,245,0,.34);border-radius:14px;box-shadow:0 18px 45px rgba(0,0,0,.38)}\n.menu .av-menu-more-links a{padding:8px 10px;border-radius:9px;white-space:nowrap}\n.menu .av-menu-more-links a:hover{background:rgba(216,245,0,.08)}\n@media(max-width:820px){.menu .av-menu-more{width:100%}.menu .av-menu-more>summary{padding:8px 0}.menu .av-menu-more-links{position:static;min-width:0;margin-top:6px;box-shadow:none;background:rgba(255,255,255,.025)}.menu .av-menu-more-links a{width:100%}}\n</style>\n'''
          if 'id="av-menu-more-ux-20261007"' not in s:
              s=s.replace('</head>',css+'</head>',1)

          p.write_text(s,encoding='utf-8')
          PY

          python3 scripts/audit_seo_graph.py

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add index.html
          git commit -m "Keep SEO hubs reachable in compact navigation"
          git push origin HEAD:main
