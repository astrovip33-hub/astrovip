name: Inspect homepage UX source
on:
  push:
    branches: [preview/ux-ui-perfect-20261007]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print UX source context
        shell: bash
        run: |
          echo '=== HERO ==='
          grep -n -C 18 'av-hero-mobile-restore' index.html | head -n 180 || true
          echo '=== HERO CSS ==='
          grep -n -C 10 'av-hero-v2' index.html | head -n 320 || true
          echo '=== CASE STUDIES ==='
          grep -n -C 20 'studii-de-caz-home' index.html | head -n 260 || true
          echo '=== CASE CSS ==='
          grep -n -C 10 'av-case-showcase' index.html | head -n 320 || true
          echo '=== OFFERS ==='
          grep -n -C 12 'av-offers' index.html | head -n 260 || true
          echo '=== REVIEWS ==='
          grep -n -C 12 'av-google-reviews' index.html | head -n 260 || true
