name: V6.3 verified portrait once

on:
  push:
    branches:
      - preview-mobile-v63-20261006
    paths:
      - '.github/workflows/v63-verified-portrait-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-mobile-v63-20261006
          fetch-depth: 0
      - name: Rebuild verified portrait asset
        shell: bash
        run: |
          set -euo pipefail
          cat premium-preview-v63/.portrait.part0 premium-preview-v63/.portrait.part1 premium-preview-v63/.portrait.part2 premium-preview-v63/.portrait.part3 premium-preview-v63/.portrait.part4 > /tmp/v63-portrait.b64
          base64 -d /tmp/v63-portrait.b64 > assets/astrovip-hero-premium-mobile-20261001.webp
          test "$(wc -c < assets/astrovip-hero-premium-mobile-20261001.webp)" -eq 37380
          rm -f premium-preview-v63/.portrait.part0 premium-preview-v63/.portrait.part1 premium-preview-v63/.portrait.part2 premium-preview-v63/.portrait.part3 premium-preview-v63/.portrait.part4 premium-preview-v63/hero-portrait-verified.txt
          rm -f .github/workflows/v63-verified-portrait-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Use verified portrait in V6.3 mobile preview'
          git push origin HEAD:preview-mobile-v63-20261006
