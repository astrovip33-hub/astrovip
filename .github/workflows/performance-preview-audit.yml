name: AstroVip Desktop CLS Audit

on:
  push:
    branches:
      - "perf/cwv-mobile-desktop-20260922-v1"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run desktop Lighthouse
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_PATH
          npx --yes lighthouse@latest http://127.0.0.1:8080/ --preset=desktop --output=json --output-path=/tmp/desktop.json --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Print metrics
        shell: bash
        run: |
          node <<'NODE'
          const j=require('/tmp/desktop.json'),a=j.audits;
          console.log('SCORE='+Math.round(j.categories.performance.score*100));
          for(const id of ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','total-byte-weight']) console.log(id+'='+(a[id]?.displayValue||a[id]?.numericValue||''));
          if(a['layout-shifts']?.details?.items) console.log('SHIFTS='+JSON.stringify(a['layout-shifts'].details.items.slice(0,10)));
          NODE
