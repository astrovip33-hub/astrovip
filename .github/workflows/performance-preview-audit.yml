name: AstroVip CLS Diagnostic

on:
  push:
    branches:
      - "perf/cwv-mobile-desktop-20260922-v1"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run desktop Lighthouse on live
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_PATH
          npx --yes lighthouse@latest https://astrovip.ro/ --preset=desktop --output=json --output-path=/tmp/live-desktop.json --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Print CLS diagnostics
        shell: bash
        run: |
          node <<'NODE'
          const j=require('/tmp/live-desktop.json');
          const a=j.audits;
          console.log('SCORE='+Math.round(j.categories.performance.score*100));
          console.log('CLS='+(a['cumulative-layout-shift']?.displayValue||a['cumulative-layout-shift']?.numericValue));
          for (const [id,x] of Object.entries(a)) {
            if (!/(layout|shift|cls)/i.test(id+' '+(x.title||''))) continue;
            console.log('AUDIT '+id+' title='+(x.title||'')+' score='+x.score+' display='+(x.displayValue||''));
            if (x.details?.items) console.log(JSON.stringify(x.details.items.slice(0,20)));
          }
          NODE
