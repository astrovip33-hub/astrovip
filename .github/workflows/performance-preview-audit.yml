name: AstroVip Cloudflare Preview Mobile Audit

on:
  push:
    branches:
      - "perf/cwv-mobile-desktop-20260922-v1"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse on Cloudflare version preview
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_PATH
          URL="https://18a75d39-astrovip.astrovip33.workers.dev/"
          npx --yes lighthouse@latest "$URL" --output=json --output-path=/tmp/mobile.json --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Print mobile metrics
        shell: bash
        run: |
          node <<'NODE'
          const j=require('/tmp/mobile.json'),a=j.audits;
          console.log('SCORE='+Math.round(j.categories.performance.score*100));
          for(const id of ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','total-byte-weight']) console.log(id+'='+(a[id]?.displayValue||a[id]?.numericValue||''));
          for(const id of ['unused-javascript','unused-css-rules','render-blocking-insight','third-parties-insight']){
            const x=a[id]; if(!x) continue; console.log('AUDIT '+id+' '+(x.displayValue||''));
            if(x.details?.items) console.log(JSON.stringify(x.details.items.slice(0,12)));
          }
          NODE
