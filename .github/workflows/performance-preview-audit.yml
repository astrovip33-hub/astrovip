name: AstroVip Performance Preview Audit

on:
  push:
    branches:
      - "perf/cwv-mobile-desktop-20260922-v1"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse mobile and desktop
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_PATH
          echo "Chrome: $CHROME_PATH"
          npx --yes lighthouse@latest https://6ab2cfc808be260008ad726d--astrovip33.netlify.app/             --output=json --output-path=/tmp/lh-mobile.json             --only-categories=performance             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          npx --yes lighthouse@latest https://6ab2cfc808be260008ad726d--astrovip33.netlify.app/             --preset=desktop             --output=json --output-path=/tmp/lh-desktop.json             --only-categories=performance             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

      - name: Print scores and Core Web Vitals
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files={
            PREVIEW_MOBILE:'/tmp/lh-mobile.json',
            PREVIEW_DESKTOP:'/tmp/lh-desktop.json',
            LIVE_MOBILE:'/tmp/lh-live-mobile.json',
            LIVE_DESKTOP:'/tmp/lh-live-desktop.json'
          };
          for (const [label,file] of Object.entries(files)) {
            const j=JSON.parse(fs.readFileSync(file,'utf8'));
            const a=j.audits;
            const score=Math.round(j.categories.performance.score*100);
            console.log('ASTROVIP_'+label+'_SCORE='+score);
            for(const id of ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','total-byte-weight','dom-size']){
              if(a[id]) console.log('ASTROVIP_'+label+'_'+id.toUpperCase().replaceAll('-','_')+'='+(a[id].displayValue||a[id].numericValue||''));
            }
            for(const id of ['bootup-time','mainthread-work-breakdown','unused-javascript','unused-css-rules','render-blocking-insight','third-parties-insight']){
              const x=a[id];
              if(!x) continue;
              console.log('ASTROVIP_'+label+'_AUDIT_'+id+' score='+x.score+' value='+(x.displayValue||''));
              const items=x.details&&x.details.items;
              if(Array.isArray(items)) console.log(JSON.stringify(items.slice(0,8)));
            }
          }
          NODE
