name: Upgrade AstroVip Operations Center V8 once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-operations-v8-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Patch Operations Center V8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          api = Path('command-center-api.js')
          a = api.read_text(encoding='utf-8')

          if 'async function recoveryPoints(env)' not in a:
              helpers = r'''
          async function githubControl(env, path, { method = 'GET', body } = {}) {
            if (!has(env, 'GITHUB_ADMIN_TOKEN')) return { ok: false, status: 503, data: { error: 'github_admin_token_not_configured' } };
            const response = await fetch(`https://api.github.com${path}`, {
              method,
              headers: {
                authorization: `Bearer ${String(env.GITHUB_ADMIN_TOKEN).trim()}`,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
                'user-agent': 'AstroVip-Operations-Center/8.0',
                ...(body === undefined ? {} : { 'content-type': 'application/json' }),
              },
              body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(20000),
            });
            if (response.status === 204) return { ok: true, status: 204, data: null };
            const text = await response.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch { data = { message: text.slice(0, 500) }; }
            return { ok: response.ok, status: response.status, data };
          }

          async function recoveryPoints(env) {
            const result = await githubControl(env, `/repos/${REPO}/commits?sha=main&per_page=10`);
            if (!result.ok) return { ok: false, status: result.status, error: result.data?.message || result.data?.error || 'github_recovery_points_failed' };
            const points = (Array.isArray(result.data) ? result.data : []).map(item => ({
              sha: item.sha || null,
              shortSha: item.sha ? item.sha.slice(0, 7) : null,
              message: item.commit?.message?.split('\n')[0] || 'Commit AstroVip',
              date: item.commit?.committer?.date || item.commit?.author?.date || null,
              url: item.html_url || null,
            })).filter(x => x.sha);
            return { ok: true, points };
          }

          async function autopilotStatus(env) {
            const result = await githubControl(env, `/repos/${REPO}/actions/workflows/operations-autopilot.yml/runs?per_page=1`);
            if (!result.ok) return { ok: false, status: result.status, error: result.data?.message || result.data?.error || 'autopilot_status_failed' };
            const run = result.data?.workflow_runs?.[0] || null;
            return { ok: true, enabled: true, cadence: 'la fiecare 4 ore', run: run ? {
              id: run.id || null, status: run.status || null, conclusion: run.conclusion || null,
              event: run.event || null, createdAt: run.created_at || null, updatedAt: run.updated_at || null,
              url: run.html_url || null,
            } : null };
          }

          async function restoreProduction(env, requestedRef) {
            const ref = String(requestedRef || '').trim();
            if (!/^[0-9a-f]{7,40}$/i.test(ref)) return { ok: false, status: 400, error: 'invalid_restore_ref' };
            const commit = await githubControl(env, `/repos/${REPO}/commits/${encodeURIComponent(ref)}`);
            if (!commit.ok || !commit.data?.sha) return { ok: false, status: commit.status || 404, error: commit.data?.message || 'restore_commit_not_found' };
            const sha = String(commit.data.sha);
            const dispatch = await githubControl(env, `/repos/${REPO}/actions/workflows/restore-production.yml/dispatches`, {
              method: 'POST', body: { ref: 'main', inputs: { target_ref: sha } },
            });
            if (!dispatch.ok) return { ok: false, status: dispatch.status || 502, error: dispatch.data?.message || 'restore_dispatch_failed' };
            return { ok: true, target: {
              sha, shortSha: sha.slice(0, 7), message: commit.data?.commit?.message?.split('\n')[0] || 'AstroVip restore point',
              date: commit.data?.commit?.committer?.date || null, url: commit.data?.html_url || null,
            }, workflow: 'restore-production.yml', note: 'Production restore started. Main branch was not changed.' };
          }

          '''
              marker = 'async function siteHealth() {'
              if marker not in a: raise SystemExit('siteHealth marker missing')
              a = a.replace(marker, helpers + marker, 1)

          if "'/api/command/recovery-points'" not in a:
              routes = r'''
            if (url.pathname === '/api/command/recovery-points') {
              const gate = await authGate(request, env);
              if (!gate?.ok) return gate;
              if (request.method !== 'GET') return json({ ok: false, error: 'method_not_allowed' }, 405, { allow: 'GET' });
              const result = await recoveryPoints(env);
              return json(result, result.ok ? 200 : (result.status || 500));
            }

            if (url.pathname === '/api/command/autopilot-status') {
              const gate = await authGate(request, env);
              if (!gate?.ok) return gate;
              if (request.method !== 'GET') return json({ ok: false, error: 'method_not_allowed' }, 405, { allow: 'GET' });
              const result = await autopilotStatus(env);
              return json(result, result.ok ? 200 : (result.status || 500));
            }

            if (url.pathname === '/api/command/restore') {
              const gate = await authGate(request, env);
              if (!gate?.ok) return gate;
              if (request.method !== 'POST') return json({ ok: false, error: 'method_not_allowed' }, 405, { allow: 'POST' });
              if (Number(request.headers.get('content-length') || 0) > 2048) return json({ ok: false, error: 'payload_too_large' }, 413);
              const body = await request.json().catch(() => ({}));
              const result = await restoreProduction(env, body?.ref);
              return json(result, result.ok ? 202 : (result.status || 500));
            }

          '''
              marker = "  if (url.pathname === '/api/command/site-health') {"
              if marker not in a: raise SystemExit('site health route marker missing')
              a = a.replace(marker, routes + marker, 1)

          api.write_text(a, encoding='utf-8')

          page = Path('command-center/index.html')
          s = page.read_text(encoding='utf-8')
          s = s.replace('AstroVip Operations Center V7', 'AstroVip Operations Center V8')
          s = s.replace('OPERATIONS CENTER V7', 'OPERATIONS CENTER V8')
          s = s.replace('V7 · control · SEO · health · deploy · backup · revenue · alerts', 'V8 · control · SEO · health · deploy · backup · recovery · autopilot · revenue · alerts')
          s = s.replace('AstroVip Operations Center V7 ·', 'AstroVip Operations Center V8 ·')

          if 'id="restorePoints"' not in s:
              backup_old = r'<section class="card exec"><div class="sec"><b>BACKUP & RECOVERY</b><span id="backupBadge" class="badge warn">STATUS</span></div><div class="list"><div class="row"><span>Google Drive</span><span id="driveState" class="v">—</span></div><div class="row"><span>Folder</span><span class="v">AstroVip Backups</span></div><div class="row"><span>Sursă</span><span class="v">main</span></div><div class="row"><span>Ultima acțiune</span><span id="lastBackup" class="v">—</span></div></div><div class="card-actions"><button class="btn primary" onclick="backupDrive()">Backup Drive</button><button class="btn" onclick="backupLocal()">Backup local</button><a class="btn" href="https://drive.google.com/" target="_blank" rel="noopener">Drive</a></div></section>'
              backup_new = r'<section class="card exec"><div class="sec"><b>BACKUP & RECOVERY</b><span id="backupBadge" class="badge warn">STATUS</span></div><div class="list"><div class="row"><span>Google Drive</span><span id="driveState" class="v">—</span></div><div class="row"><span>Folder</span><span class="v">AstroVip Backups</span></div><div class="row"><span>Ultima acțiune</span><span id="lastBackup" class="v">—</span></div></div><div class="mut" style="margin-top:10px">Restore points · ultimele commituri main</div><div id="restorePoints" class="list"><div class="mut">Încarc punctele de restaurare…</div></div><div class="card-actions"><button class="btn primary" onclick="backupDrive()">Backup Drive</button><button class="btn" onclick="backupLocal()">Backup local</button><button class="btn" onclick="recovery(true)">Refresh restore points</button><a class="btn" href="https://drive.google.com/" target="_blank" rel="noopener">Drive</a></div></section>'
              if backup_old not in s: raise SystemExit('backup card marker missing')
              s = s.replace(backup_old, backup_new, 1)

          if 'AUTO-PILOT 24/7' not in s:
              alerts = r'<section class="card exec red"><div class="sec"><b>ALERTS CENTER</b><span id="alertBadge" class="badge warn">CALCUL</span></div><div id="alerts" class="alerts"><div class="alert warn">Analizez starea sistemului…</div></div><div class="card-actions"><button class="btn primary" onclick="refreshAll(true)">Reverifică tot</button><a class="btn" href="/command-center/connections/">Rezolvă conexiuni</a></div></section>'
              auto = r'<section class="card exec"><div class="sec"><b>AUTO-PILOT 24/7</b><span id="autoBadge" class="badge warn">STATUS</span></div><div class="list"><div class="row"><span>Mod</span><span class="v">MONITOR + GUARD</span></div><div class="row"><span>Frecvență</span><span id="autoCadence" class="v">4 ORE</span></div><div class="row"><span>Ultimul run</span><span id="autoRun" class="v">—</span></div><div class="row"><span>Rezultat</span><span id="autoResult" class="v">—</span></div><div class="row"><span>Backup tehnic</span><span class="v">ARTIFACT 14 ZILE</span></div></div><div class="mut" style="margin-top:10px">Verifică HTTPS, homepage, robots, sitemap, canonical și structured data. Nu publică modificări autonom.</div><div class="card-actions"><button class="btn primary" onclick="autopilot(true)">Verifică status</button><a class="btn" href="https://github.com/astrovip33-hub/astrovip/actions/workflows/operations-autopilot.yml" target="_blank" rel="noopener">Workflow</a></div></section>'
              if alerts not in s: raise SystemExit('alerts card marker missing')
              s = s.replace(alerts, alerts + '\n\n' + auto, 1)

          if "setCommand('verifică auto-pilot')" not in s:
              chip = r'''<button class="chip" onclick="setCommand('verifică SE Ranking')">SE Ranking</button><button class="chip" onclick="setCommand('actualizează tot')">Refresh complet</button>'''
              chip_new = r'''<button class="chip" onclick="setCommand('verifică SE Ranking')">SE Ranking</button><button class="chip" onclick="setCommand('verifică auto-pilot')">Auto-Pilot</button><button class="chip" onclick="setCommand('arată recovery')">Recovery</button><button class="chip" onclick="setCommand('actualizează tot')">Refresh complet</button>'''
              if chip not in s: raise SystemExit('operator chips marker missing')
              s = s.replace(chip, chip_new, 1)

          state_old = 'const S={overview:null,connections:null,gsc:null,ga4:null,seranking:null,health:null,errors:{}};'
          state_new = 'const S={overview:null,connections:null,gsc:null,ga4:null,seranking:null,health:null,autopilot:null,recovery:null,errors:{}};'
          if state_old in s: s = s.replace(state_old, state_new, 1)

          if 'async function recovery(loud=false)' not in s:
              functions = r'''renderStatus()}
          async function recovery(loud=false){try{const d=await api('/api/command/recovery-points');S.recovery=d;const pts=d.points||[];$('restorePoints').innerHTML=pts.length?pts.slice(0,5).map(x=>`<div class="row"><span><b>${esc(x.shortSha)}</b><br><span class="mut">${esc(x.message)}</span></span><span style="text-align:right"><span class="mut">${x.date?new Date(x.date).toLocaleString('ro-RO'):''}</span><br><button class="btn" style="padding:4px 7px;margin-top:3px;font-size:9px" onclick="restorePoint('${esc(x.sha)}')">RESTORE</button></span></div>`).join(''):'<div class="mut">Nu există restore points disponibile.</div>';delete S.errors.recovery;if(loud)toast('Restore points actualizate')}catch(e){S.errors.recovery=e.message;$('restorePoints').innerHTML=`<div class="alert warn">${esc(e.message)}</div>`;if(loud)toast(e.message)}renderStatus()}
          async function restorePoint(ref){if(isSafe()){toast('SAFE MODE este ON. Dezactivează-l înainte de restore.');logAction('security','Restore blocat de Safe Mode','warn');return}const point=S.recovery?.points?.find(x=>x.sha===ref);const label=point?`${point.shortSha} · ${point.message}`:ref.slice(0,7);if(!confirm(`RESTORE producție la ${label}?\n\nBranch-ul main NU va fi modificat.`))return;try{toast('Pornesc restore-ul controlat…');const d=await api('/api/command/restore',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ref})});logAction('recovery','Restore pornit la '+(d.target?.shortSha||ref.slice(0,7)),'warn');toast('Restore pornit: '+(d.target?.shortSha||ref.slice(0,7)));setTimeout(()=>overview().then(renderStatus),3000)}catch(e){logAction('recovery','Restore eșuat: '+e.message,'warn');toast(e.message)}}
          async function autopilot(loud=false){try{const d=await api('/api/command/autopilot-status');S.autopilot=d;const r=d.run||{};$('autoCadence').textContent=(d.cadence||'la fiecare 4 ore').toUpperCase();$('autoRun').textContent=r.updatedAt?new Date(r.updatedAt).toLocaleString('ro-RO'):'ÎNCĂ NU';const state=(r.conclusion||r.status||'READY').toUpperCase();$('autoResult').textContent=state;$('autoBadge').className='badge '+(r.conclusion&&r.conclusion!=='success'?'red':r.status==='in_progress'?'warn':'');$('autoBadge').textContent=r.conclusion==='success'?'ACTIVE · OK':state;delete S.errors.autopilot;if(loud)toast('Auto-Pilot status actualizat')}catch(e){S.errors.autopilot=e.message;$('autoBadge').className='badge red';$('autoBadge').textContent='ATENȚIE';if(loud)toast(e.message)}renderStatus()}
          function coreConnection'''
              marker = 'renderStatus()}\nfunction coreConnection'
              if marker not in s: raise SystemExit('health/core marker missing')
              s = s.replace(marker, functions, 1)

          old_refresh = "async function refreshAll(loud=false){try{await overview();await Promise.all([connectionStatus(),gsc(false),ga4(false),seranking(false),health(false)]);renderStatus();if(loud){logAction('system','Refresh complet executat');toast('Operations Center actualizat')}}catch(e){S.errors.overview=e.message;$('bdot').className='dot bad';$('btxt').textContent='Backend EROARE';renderStatus();toast(e.message)}}"
          new_refresh = "async function refreshAll(loud=false){try{await overview();await Promise.all([connectionStatus(),gsc(false),ga4(false),seranking(false),health(false),recovery(false),autopilot(false)]);renderStatus();if(loud){logAction('system','Refresh complet executat');toast('Operations Center actualizat')}}catch(e){S.errors.overview=e.message;$('bdot').className='dot bad';$('btxt').textContent='Backend EROARE';renderStatus();toast(e.message)}}"
          if old_refresh in s: s = s.replace(old_refresh, new_refresh, 1)

          if "Auto-Pilot a detectat" not in s:
              alert_marker = "const core=[['gsc','Search Console'],['ga4','GA4'],['seranking','SE Ranking'],['driveAutoBackup','Drive Backup'],['stripe','Stripe']];"
              alert_new = "const ar=S.autopilot?.run;if(ar&&ar.status==='completed'&&ar.conclusion!=='success')a.push(['bad','Auto-Pilot a detectat o problemă la ultima verificare.']);" + alert_marker
              if alert_marker in s: s = s.replace(alert_marker, alert_new, 1)

          old_operator = "async function runOperator(){const raw=$('command').value.trim(),q=raw.toLowerCase();if(!q)return;logAction('operator',raw);if(q.includes('backup'))return backupDrive();if(q.includes('seo')||q.includes('search console')||q.includes('gsc'))return gsc(true);if(q.includes('trafic')||q.includes('ga4')||q.includes('analytics'))return ga4(true);if(q.includes('ranking'))return seranking(true);if(q.includes('health')||q.includes('site'))return health(true);if(q.includes('actualiz')||q.includes('refresh')||q.includes('tot'))return refreshAll(true);if(q.includes('deploy')||q.includes('public'))return deployNow();if(q.includes('conex')){location.href='/command-center/connections/';return}toast('Comandă necunoscută. Încearcă: SEO, trafic, site health, backup, SE Ranking, actualizează tot sau deploy.')}"
          new_operator = "async function runOperator(){const raw=$('command').value.trim(),q=raw.toLowerCase();if(!q)return;logAction('operator',raw);if(q.includes('backup'))return backupDrive();if(q.includes('restore')||q.includes('recovery'))return recovery(true);if(q.includes('pilot')||q.includes('autopilot')||q.includes('auto-pilot'))return autopilot(true);if(q.includes('seo')||q.includes('search console')||q.includes('gsc'))return gsc(true);if(q.includes('trafic')||q.includes('ga4')||q.includes('analytics'))return ga4(true);if(q.includes('ranking'))return seranking(true);if(q.includes('health')||q.includes('site'))return health(true);if(q.includes('actualiz')||q.includes('refresh')||q.includes('tot'))return refreshAll(true);if(q.includes('deploy')||q.includes('public'))return deployNow();if(q.includes('conex')){location.href='/command-center/connections/';return}toast('Comandă necunoscută. Încearcă: SEO, trafic, site health, backup, recovery, auto-pilot, SE Ranking, actualizează tot sau deploy.')}"
          if old_operator in s: s = s.replace(old_operator, new_operator, 1)

          page.write_text(s, encoding='utf-8')
          print('Operations Center V8 patched.')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check command-center-api.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('command-center/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('Inline Command Center script missing')
          Path('/tmp/command-center-v8.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/command-center-v8.js

      - name: Commit V8 upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip Operations Bot"
          git config user.email "astrovip33@gmail.com"
          git add command-center/index.html command-center-api.js
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add Auto-Pilot and one-click Recovery Center"
          git push origin HEAD:main
