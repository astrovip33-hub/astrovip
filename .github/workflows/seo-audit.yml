name: SEO audit (read only)
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit sitemap, structured data and live HTTP
        run: python3 scripts/audit-seo.py
      - uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: seo-audit-report.json
