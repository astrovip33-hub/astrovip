name: Remove About Me card and reviews once 20261101 v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-about-reviews-once-20261101-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove About Me artwork card and public reviews
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []

          def write_if_changed(path, before, after):
              if after != before:
                  Path(path).write_text(after, encoding='utf-8')
                  changed.append(str(path))

          # Homepage: remove visible/stale reviews blocks, if present.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          s = re.sub(r'\s*<section id="av-home-reviews"\b.*?</section>\s*', '\n', s, count=1, flags=re.S | re.I)
          s = re.sub(r'\s*<style id="av-google-reviews-premium-20261004">.*?</style>\s*', '\n', s, count=1, flags=re.S | re.I)
          s = re.sub(r'\s*<style id="av-home-reviews-override-v2">.*?</style>\s*', '\n', s, count=1, flags=re.S | re.I)
          write_if_changed(p, original, s)

          # Case studies module: remove only the injected About Me card and its helper code.
          p = Path('assets/home-case-studies-premium-20261014.js')
          s = p.read_text(encoding='utf-8')
          original = s
          s, n = re.subn(
              r'\n\s*const ABOUT_HTML\s*=.*?\n\s*const install\s*=\s*\(\)\s*=>\s*\{',
              '\n\n  const install = () => {',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected About Me helper block once, removed {n}')
          s = re.sub(r'^\s*ensureAboutStyle\(\);\s*\n?', '', s, flags=re.M)
          s = re.sub(r'^\s*ensureAbout\(section\);\s*\n?', '', s, flags=re.M)
          write_if_changed(p, original, s)

          # Remove obsolete homepage allow-list exception for reviews.
          p = Path('assets/home-ultra-production-20261010.css')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              original = s
              s = s.replace(':not(#av-home-reviews)', '')
              write_if_changed(p, original, s)

          # Remove review page references from AI index.
          p = Path('llms.txt')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              original = s
              lines = [line for line in s.splitlines() if '/recenzii/' not in line and 'Recenzii Google AstroVip' not in line]
              s = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')
              write_if_changed(p, original, s)

          # Remove /recenzii/ from sitemaps.
          for p in Path('.').rglob('sitemap*.xml'):
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              s = re.sub(r'\s*<url>(?:(?!</url>).)*https://astrovip\.ro/recenzii/?(?:(?!</url>).)*</url>\s*', '\n', s, flags=re.S | re.I)
              s = re.sub(r'^.*https://astrovip\.ro/recenzii/?[^\n]*\n?', '', s, flags=re.M | re.I)
              write_if_changed(p, original, s)

          # Remove direct HTML links to /recenzii/ across remaining pages.
          anchor_re = re.compile(r'\s*<a\b[^>]*href=["\']/recenzii/?["\'][^>]*>.*?</a>', re.S | re.I)
          for p in Path('.').rglob('*.html'):
              if p.as_posix() == 'recenzii/index.html':
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              s = anchor_re.sub('', s)
              write_if_changed(p, original, s)

          # Delete dedicated reviews page.
          reviews_page = Path('recenzii/index.html')
          if reviews_page.exists():
              reviews_page.unlink()
              changed.append('recenzii/index.html (deleted)')

          # Remove card-only image assets if they are tracked in the repo.
          assets = Path('assets')
          if assets.exists():
              for p in assets.glob('astrovip-despre-mine-20261101-*.webp'):
                  p.unlink()
                  changed.append(f'{p} (deleted)')

          print('Changed files:')
          for item in changed:
              print(' -', item)
          PY

          # Verify the requested public content is gone without touching other homepage sections.
          ! grep -q 'id="av-home-reviews"' index.html
          ! grep -q 'av-google-reviews-premium-20261004' index.html
          ! grep -q 'av-home-reviews-override-v2' index.html
          ! grep -Eq 'av-about-home|ABOUT_HTML|ensureAbout\(' assets/home-case-studies-premium-20261014.js
          test ! -f recenzii/index.html

          if grep -RIl --exclude-dir=.git --include='*.html' --include='*.xml' --include='llms.txt' -E 'href=["'"']/recenzii/?["'"']|https://astrovip\.ro/recenzii/?' . | grep -q .; then
            echo 'Residual review references found:'
            grep -RIn --exclude-dir=.git --include='*.html' --include='*.xml' --include='llms.txt' -E 'href=["'"']/recenzii/?["'"']|https://astrovip\.ro/recenzii/?' . || true
            exit 1
          fi

      - name: Commit removal
        shell: bash
        run: |
          git config user.name "AstroVip Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove About Me card and reviews from public site" || exit 0
          git push origin HEAD:main
