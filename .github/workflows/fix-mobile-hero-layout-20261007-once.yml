name: Fix mobile hero layout 20261007

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-mobile-hero-layout-20261007-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add mobile stylesheet link
        run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); m="<link id=\"av-mobile-layout-polish-20261007\" rel=\"stylesheet\" href=\"/assets/mobile-layout-polish-20261007.css?v=20261007\">"; p.write_text(s if m in s else s.replace("</body>",m+"\\n</body>",1),encoding="utf-8")'
      - name: Commit patch
        run: |
          git config user.name "AstroVip Mobile Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Apply mobile hero layout polish" || exit 0
          git push origin HEAD:main
