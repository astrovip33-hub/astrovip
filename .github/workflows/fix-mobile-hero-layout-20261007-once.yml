name: Fix AstroVip mobile hero layout once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mobile-hero-layout-20261007-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-mobile-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authoritative mobile hero polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'av-mobile-layout-polish-20261007'
          if marker in s:
              print('mobile polish already present')
              raise SystemExit(0)

          css = r'''
<style id="av-mobile-layout-polish-20261007">
@media(max-width:820px){
  html body:not(.guide-page) section.hero.hero-split.av-hero-v2{
    display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;
    margin:0!important;padding:0!important;overflow:hidden!important;background:#020302!important;border:0!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-visual{
    position:relative!important;display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;
    margin:0!important;padding:0!important;overflow:visible!important;line-height:0!important;background:#020302!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-visual picture{
    display:block!important;width:100%!important;height:auto!important;margin:0!important;padding:0!important;line-height:0!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-visual picture img,
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-visual > img{
    display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;aspect-ratio:auto!important;
    margin:0!important;padding:0!important;object-fit:contain!important;object-position:center top!important;vertical-align:top!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-image-service-cards{
    position:relative!important;inset:auto!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;
    display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;align-items:stretch!important;
    width:calc(100% - 24px)!important;max-width:520px!important;height:auto!important;margin:10px auto 0!important;padding:0!important;
    gap:7px!important;transform:none!important;z-index:7!important;line-height:1.2!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-image-service-cards span{
    display:flex!important;align-items:center!important;justify-content:center!important;min-width:0!important;min-height:34px!important;
    padding:7px 8px!important;border:1.5px solid #39ff14!important;border-radius:10px!important;
    background:linear-gradient(180deg,rgba(13,38,18,.98),rgba(2,8,4,.99))!important;color:#fff8d8!important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 9px rgba(57,255,20,.18),0 6px 16px rgba(0,0,0,.34)!important;
    font-size:10.5px!important;line-height:1.15!important;font-weight:950!important;letter-spacing:.04em!important;text-align:center!important;white-space:nowrap!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-copy{
    position:relative!important;display:block!important;box-sizing:border-box!important;width:calc(100% - 24px)!important;max-width:520px!important;
    margin:10px auto 12px!important;padding:12px 12px 13px!important;text-align:center!important;transform:none!important;
    border:1.5px solid #39ff14!important;border-radius:16px!important;
    background:radial-gradient(ellipse at 50% 0%,rgba(40,105,42,.30),transparent 76%),linear-gradient(145deg,rgba(10,27,16,.98),rgba(3,11,6,.99))!important;
    box-shadow:inset 0 1px 0 rgba(225,255,220,.10),0 0 10px rgba(57,255,20,.20),0 10px 24px rgba(0,0,0,.36)!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-title{
    display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;margin:0!important;
    font-family:Georgia,'Times New Roman',serif!important;font-size:clamp(28px,7.8vw,36px)!important;line-height:.96!important;font-weight:900!important;
    letter-spacing:.01em!important;text-align:center!important;
    background:linear-gradient(180deg,#fff5c4 0%,#f1cf61 42%,#bd851d 76%,#f8e9a5 100%)!important;
    -webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;color:transparent!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-title .av-hero-v2-line-main,
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-title .av-hero-v2-line-premium{
    display:block!important;width:auto!important;max-width:100%!important;margin:0 auto!important;padding:0!important;text-align:center!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-title .av-hero-v2-line-premium{
    margin-top:3px!important;font-size:.54em!important;line-height:1!important;letter-spacing:.18em!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-subtitle{
    display:block!important;margin:8px 0 0!important;color:#fff8e8!important;font-size:10.5px!important;line-height:1.25!important;
    font-weight:850!important;letter-spacing:.075em!important;text-align:center!important;
  }
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-actions,
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-cards,
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-bottom,
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-sidecopy{display:none!important;}
  html body:not(.guide-page) .av-hero-freeq-separator{display:block!important;height:10px!important;min-height:10px!important;margin:0!important;padding:0!important;}
  html body:not(.guide-page) section.hero.av-hero-v2 + .av-hero-freeq-separator + section.freeq-home,
  html body:not(.guide-page) section.hero.av-hero-v2 + section.freeq-home{
    margin-top:0!important;padding-top:14px!important;
  }
}
@media(max-width:390px){
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-image-service-cards{width:calc(100% - 20px)!important;gap:6px!important;}
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-image-service-cards span{min-height:32px!important;padding:6px 6px!important;font-size:9.8px!important;}
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-copy{width:calc(100% - 20px)!important;margin-top:9px!important;padding:11px 9px 12px!important;}
  html body:not(.guide-page) .hero.av-hero-v2 .av-hero-v2-title{font-size:30px!important;}
}
</style>
'''
          if '</body>' not in s:
              raise SystemExit('index.html has no </body>')
          s = s.replace('</body>', css + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('inserted authoritative mobile polish')
          PY

      - name: Commit mobile fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip Mobile Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Fix mobile hero proportions and spacing" || exit 0
          git push origin HEAD:main
