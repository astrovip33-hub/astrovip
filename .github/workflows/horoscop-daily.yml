name: Refresh daily horoscope

on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: astrovip-horoscop-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render current Bucharest horoscope
        run: node scripts/render-horoscop-static.mjs

      - name: Test daily horoscope
        run: node scripts/test-horoscop-daily.mjs

      - name: Commit daily freshness
        id: freshness
        shell: bash
        run: |
          if git diff --quiet -- horoscop-azi sitemap-core.xml; then
            echo "Horoscope already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horoscop-azi sitemap-core.xml
          git commit -m "seo(horoscop): refresh daily content"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy refreshed horoscope
        if: steps.freshness.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare-worker.yml --ref main
