name: Case studies DOM diagnostic

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/case-slider-dom-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install Puppeteer
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          npm install --no-save --ignore-scripts puppeteer-core@24.26.1

      - name: Trace live replacement
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p=>fs.existsSync(p));
            const browser=await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
            await page.setUserAgent('Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 Chrome/141.0 Mobile Safari/537.36 AstroVipDOMTrace/1.0');
            page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
            page.on('pageerror',e=>console.log('PAGEERROR',e.stack||e.message));

            await page.evaluateOnNewDocument(()=>{
              window.__avWrites=[];
              const hit=el=>el&&el.nodeType===1&&(el.id==='studii-de-caz-home'||el.closest?.('#studii-de-caz-home'));
              const record=(kind,el,value)=>{
                if(!hit(el)) return;
                window.__avWrites.push({
                  t:Math.round(performance.now()),kind,
                  target:el.tagName+'#'+(el.id||'')+'.'+(typeof el.className==='string'?el.className:''),
                  value:String(value||'').replace(/\s+/g,' ').slice(0,240),
                  stack:(new Error('case-study mutation')).stack||''
                });
              };

              const desc=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
              if(desc&&desc.get&&desc.set){
                Object.defineProperty(Element.prototype,'innerHTML',{
                  configurable:desc.configurable,enumerable:desc.enumerable,
                  get(){return desc.get.call(this)},
                  set(v){record('innerHTML',this,v);return desc.set.call(this,v)}
                });
              }
              const origReplace=Element.prototype.replaceChildren;
              Element.prototype.replaceChildren=function(...nodes){record('replaceChildren',this,nodes.map(n=>n?.outerHTML||n?.textContent||n).join(' '));return origReplace.apply(this,nodes)};
              const origInsert=Element.prototype.insertAdjacentHTML;
              Element.prototype.insertAdjacentHTML=function(pos,html){record('insertAdjacentHTML:'+pos,this,html);return origInsert.call(this,pos,html)};
              const origRemove=Element.prototype.remove;
              Element.prototype.remove=function(){record('remove',this,this.outerHTML);return origRemove.call(this)};
            });

            await page.goto(`https://astrovip.ro/?domtrace=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:90000});
            await new Promise(r=>setTimeout(r,1800));
            const state=await page.evaluate(()=>({
              writes:window.__avWrites||[],
              sections:[...document.querySelectorAll('[id="studii-de-caz-home"]')].map(s=>({html:s.innerHTML.slice(0,800),cards:s.querySelectorAll('.av-case-showcase-card').length,grids:s.querySelectorAll('.av-case-showcase-grid').length,text:(s.textContent||'').trim().slice(0,260)}))
            }));
            console.log('TRACE_RESULT '+JSON.stringify(state));
            await page.screenshot({path:'/tmp/astrovip-mobile-domtrace.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload trace screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrovip-case-slider-dom-trace
          path: /tmp/astrovip-mobile-domtrace.png
          if-no-files-found: warn
          retention-days: 7
