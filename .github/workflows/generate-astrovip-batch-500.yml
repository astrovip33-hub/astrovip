name: Generate AstroVip Batch 500

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_astrovip_batch_500.py"
      - ".github/workflows/generate-astrovip-batch-500.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astrovip-batch-500
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate 500 AstroVip pages
        run: python3 scripts/generate_astrovip_batch_500.py

      - name: Validate page count
        run: |
          test "$(find atlas -name index.html | wc -l)" -eq 500
          test -f academia-astrologie/atlas-500/index.html
          grep -q "Atlas AstroVip 500" academia-astrologie/atlas-500/index.html

      - name: Commit generated pages
        run: |
          git config user.name "astrovip-auto"
          git config user.email "actions@users.noreply.github.com"
          git add atlas academia-astrologie/atlas-500 academia-astrologie/index.html toate-paginile/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate AstroVip Atlas 500 [skip ci]"
          git push origin HEAD:main
