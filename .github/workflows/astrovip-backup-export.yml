name: AstroVip Backup Export

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/astrovip-backup-export.yml'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4

      - name: Prepare clean site backup
        shell: bash
        run: |
          mkdir -p _astrovip_backup
          rsync -a \
            --exclude='.git' \
            --exclude='_astrovip_backup' \
            --exclude='.github/workflows/astrovip-backup-export.yml' \
            ./ _astrovip_backup/
          printf '%s\n' "${{ github.sha }}" > _astrovip_backup/BACKUP_COMMIT.txt
          printf '%s\n' '2026-09-21' > _astrovip_backup/BACKUP_DATE.txt

      - name: Upload complete backup
        uses: actions/upload-artifact@v4
        with:
          name: astrovip-backup-2026-09-21
          path: _astrovip_backup/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
