name: Purge AstroVip Cloudflare cache once

on:
  push:
    paths:
      - '.github/workflows/purge-cloudflare-cache-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    env:
      TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      ZONE_1: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ZONE_2: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: Purge Cloudflare cache for astrovip.ro
        shell: bash
        run: |
          set -euo pipefail

          TOKEN="${TOKEN_1:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_2:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_3:-}"; fi

          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare API token was found in GitHub Actions secrets (checked CLOUDFLARE_API_TOKEN, CF_API_TOKEN, CLOUDFLARE_TOKEN)."
            exit 2
          fi

          ZONE_ID="${ZONE_1:-}"
          if [ -z "$ZONE_ID" ]; then ZONE_ID="${ZONE_2:-}"; fi

          if [ -z "$ZONE_ID" ]; then
            ZONES=$(curl -fsS \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=astrovip.ro&status=active")
            ZONE_ID=$(printf '%s' "$ZONES" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or [{}])[0].get("id", ""))')
          fi

          if [ -z "$ZONE_ID" ]; then
            echo "::error::Could not resolve Cloudflare zone ID for astrovip.ro."
            exit 3
          fi

          RESPONSE=$(curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache")

          SUCCESS=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("success", False)).lower())')
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Cloudflare purge API did not report success."
            printf '%s\n' "$RESPONSE"
            exit 4
          fi

          echo "Cloudflare cache purge completed successfully for astrovip.ro."
