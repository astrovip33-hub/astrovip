name: Remove Vercel DNS records once

on:
  push:
    paths:
      - '.github/workflows/remove-vercel-dns-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-vercel-dns:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Remove only DNS records pointing to Vercel
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"

          if [ -z "$TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN."
            exit 2
          fi

          ZONES=$(curl -fsS             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/zones?name=astrovip.ro&status=active")

          ZONE_ID=$(printf '%s' "$ZONES" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0].get("id","") if r else "")')
          if [ -z "$ZONE_ID" ]; then
            echo "::error::Could not resolve astrovip.ro zone."
            exit 3
          fi

          RECORDS=$(curl -fsS             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=500")

          printf '%s' "$RECORDS" | python3 -c 'import json,sys
d=json.load(sys.stdin)
for r in d.get("result", []):
    name=(r.get("name") or "").lower()
    content=(r.get("content") or "").lower()
    if "vercel" in name or "vercel" in content:
        print("\t".join([r.get("id",""),r.get("type",""),r.get("name",""),r.get("content","")]))' > /tmp/vercel-records.tsv

          if [ ! -s /tmp/vercel-records.tsv ]; then
            echo "VERCEL_DNS_FOUND=0"
            exit 0
          fi

          COUNT=0
          while IFS=$'\t' read -r ID TYPE NAME CONTENT; do
            echo "Deleting Vercel DNS record: $TYPE $NAME -> $CONTENT"
            curl -fsS -X DELETE               -H "Authorization: Bearer $TOKEN"               -H "Content-Type: application/json"               "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID" >/tmp/delete.json
            OK=$(python3 -c 'import json; print(str(json.load(open("/tmp/delete.json")).get("success",False)).lower())')
            if [ "$OK" != "true" ]; then
              echo "::error::Failed deleting $NAME"
              cat /tmp/delete.json
              exit 4
            fi
            COUNT=$((COUNT+1))
          done < /tmp/vercel-records.tsv

          echo "VERCEL_DNS_REMOVED=$COUNT"