name: Repository hygiene once

on:
  push:
    branches: [main]
    paths:
      - '.repo-hygiene-20261102'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete one-off workflows and triggers
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/cleanup-homepage-source-once.yml \
            .cleanup-homepage-source-20261102 \
            .github/workflows/deploy-verify-homepage-repair-once.yml \
            .github/workflows/fix-booking-bridge-once.yml \
            .github/workflows/fix-footer-cert-cache-trigger.yml \
            .github/workflows/fix-footer-cert-cache.yml \
            .github/workflows/fix-footer-extra-cert-hardkill-once.yml \
            .github/workflows/fix-homepage-hero-menu-once.yml \
            .github/workflows/fix-mobile-hero-layout-20261007-once.yml \
            .github/workflows/fix-mobile-hero-visible-once.yml \
            .github/workflows/live-home-snapshot-once.yml \
            .github/workflows/mobile-layout-audit-once.yml \
            .github/workflows/optimize-hero-once.yml \
            .github/workflows/optimize-responsive-hero-once.yml \
            .github/workflows/pagespeed-cleanup-20261009-once.yml \
            .github/workflows/pagespeed-consent-cls-20261009-once.yml \
            .github/workflows/pagespeed-images-20261009-once.yml \
            .github/workflows/remove-about-reviews-once-20261101.yml \
            .github/workflows/remove-about-reviews-once-20261101-v2.yml \
            .github/workflows/remove-about-reviews-once-20261101-v3.yml \
            .github/workflows/remove-hero-payment-once-20261031.yml \
            .github/workflows/ui-live-browser-smoke-once.yml \
            .github/workflows/ux-ui-remediation-once.yml \
            .github/workflows/verify-ux-live-once.yml \
            .github/workflows/repo-hygiene-once.yml \
            .repo-hygiene-20261102
      - name: Commit repository cleanup
        shell: bash
        run: |
          git config user.name 'astrovip33-hub'
          git config user.email 'astrovip33@gmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Clean obsolete one-off workflows and repository triggers'
          git push origin HEAD:main
