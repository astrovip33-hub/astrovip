name: Import optimized hero video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-hero-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore video blob and wire hero
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os, re, urllib.request
          from pathlib import Path

          owner_repo = "astrovip33-hub/astrovip"
          blob_sha = "5225f09f4f377f2abbb615d9b78b4bd388dcf94d"
          url = f"https://api.github.com/repos/{owner_repo}/git/blobs/{blob_sha}"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req) as resp:
              payload = json.load(resp)

          raw = base64.b64decode(payload["content"])
          out = Path("assets/astrovip-hero-optimized.mp4")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(raw)

          page = Path("index.html")
          html = page.read_text(encoding="utf-8")
          video = '''<video id="astrovipHeroVideo" class="astrovip-hero-video" autoplay muted loop playsinline preload="metadata" disablepictureinpicture poster="/assets/1000049884.webp?v=20260917-lcp1" aria-label="AstroVip Premium — prezentare video">
          <source src="/assets/astrovip-hero-optimized.mp4?v=20260918-hero4" type="video/mp4"/>
          </video>'''
          html, n = re.subn(r'<video id="astrovipHeroVideo"[\s\S]*?</video>', video, html, count=1)
          if n != 1:
              raise SystemExit("Hero video element not found")
          html = re.sub(r'<script id="astrovip-hero-video-loader">[\s\S]*?</script>\s*', '', html, count=1)
          html = re.sub(r'<meta content="[^"]*" name="astrovip-release"/>',
                        '<meta content="20260918-hero-video-4" name="astrovip-release"/>',
                        html, count=1)
          if "__ASTROVIP_VIDEO_B64_" in html:
              raise SystemExit("Legacy hero placeholder still present")
          page.write_text(html, encoding="utf-8")
          print(f"video_bytes={len(raw)}")
          PY

      - name: Commit production assets
        run: |
          rm -f .github/workflows/import-hero-video.yml
          git config user.name "AstroVip Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/astrovip-hero-optimized.mp4 index.html .github/workflows/import-hero-video.yml
          git commit -m "Publică video optimizat în hero"
          git push origin HEAD:main
