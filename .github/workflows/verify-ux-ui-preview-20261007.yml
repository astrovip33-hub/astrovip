name: Verify AstroVip final UX UI
on:
  push:
    branches: [preview/ux-ui-perfect-20261007]
permissions:
  contents: read
concurrency:
  group: astrovip-final-ux-verification
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for matching preview release
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 120); do
            if curl -fsS 'https://astrovip-preview.astrovip33.workers.dev/?ux_final=20261007-ux5' | grep -q 'ux-final-20261007.js?v=20261007-ux5'; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify responsive navigation, languages, chat and booking
        run: node scripts/test-ux-final.mjs
      - name: Upload visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrovip-final-ux-ui
          path: |
            ux-final-results.json
            ux-final-*.png
