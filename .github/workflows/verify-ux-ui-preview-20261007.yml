name: Verify UX UI preview 2026-10-07
on:
  push:
    branches: [preview/ux-ui-perfect-20261007]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for UX UI V2 Cloudflare preview
        shell: bash
        run: |
          set -euo pipefail
          URL='https://astrovip-preview.astrovip33.workers.dev/assets/ux-ui-perfect-v2-20261007.css?ux=20261007v2'
          ok=0
          for i in $(seq 1 35); do
            if curl -fsS "$URL&n=$i" | grep -q 'ASTROVIP UX/UI PERFECT V2'; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Render and measure V2 preview
        shell: bash
        run: |
          cat > .verify-ux-preview.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const base='https://astrovip-preview.astrovip33.workers.dev/?ux_v2='+Date.now();
          const browser=await chromium.launch({headless:true});
          const results=[];
          for(const [name,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]]){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto(base+'&vp='+name,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(3200);
            const reject=page.getByRole('button',{name:/Respinge opționale/i});
            if(await reject.count()&&await reject.isVisible().catch(()=>false)) await reject.click({force:true}).catch(()=>{});
            await page.evaluate(()=>document.documentElement.style.setProperty('scroll-behavior','auto','important'));
            const cases=page.locator('#studii-de-caz-home');
            if(await cases.count()){await cases.scrollIntoViewIfNeeded();await page.waitForTimeout(450)}
            const total=await page.evaluate(()=>document.documentElement.scrollHeight);
            for(let y=0;y<total;y+=850){await page.evaluate(y=>window.scrollTo(0,y),y);await page.waitForTimeout(40)}
            await page.evaluate(()=>window.scrollTo(0,0)); await page.waitForTimeout(250);
            const data=await page.evaluate(()=>{
              const q=s=>document.querySelector(s), r=e=>{if(!e)return null;const x=e.getBoundingClientRect();return {x:Math.round(x.x),y:Math.round(x.y),w:Math.round(x.width),h:Math.round(x.height),bottom:Math.round(x.bottom)}};
              const hero=q('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore');
              const img=hero?.querySelector('.av-hero-v2-visual picture img');
              const copy=hero?.querySelector('.av-hero-v2-copy');
              const cta=hero?.querySelector('.av-hero-v2-actions a[href="#programari"]');
              const cases=q('#studii-de-caz-home'),reviews=q('#recenzii-google'),offers=q('#oferte'),hamb=q('#hamb');
              const caseCards=[...document.querySelectorAll('#studii-de-caz-home article.av-case-showcase-card')].map(e=>({rect:r(e),cv:getComputedStyle(e).contentVisibility,contain:getComputedStyle(e).contain,intrinsic:getComputedStyle(e).containIntrinsicSize,figure:r(e.querySelector('figure.av-case-showcase-visual'))}));
              const title=hero?.querySelector('.av-hero-v2-title');
              return {doc:{w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight},hero:r(hero),image:{rect:r(img),natural:img?[img.naturalWidth,img.naturalHeight]:null,src:img?.currentSrc||img?.src||null},copy:r(copy),cta:r(cta),title:r(title),titleOverflow:title?title.scrollWidth-title.clientWidth:null,cases:r(cases),caseCards,reviews:r(reviews),offers:r(offers),hamb:r(hamb),programare:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='#programari')};
            });
            await page.screenshot({path:`ux-v2-${name}-viewport.png`,fullPage:false});
            await page.screenshot({path:`ux-v2-${name}-full.png`,fullPage:true});
            const row={name,viewport,data,errors}; results.push(row); console.log('UX_V2 '+JSON.stringify(row));
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('ux-v2.json',JSON.stringify(results,null,2));
          const m=results.find(x=>x.name==='mobile'),d=results.find(x=>x.name==='desktop'),fail=[];
          if(m.data.doc.w>392)fail.push('mobile overflow '+m.data.doc.w);
          if(m.data.doc.h>14000)fail.push('mobile page still too long '+m.data.doc.h);
          if(!m.data.image.natural||m.data.image.natural[0]<1)fail.push('mobile hero missing');
          if(!m.data.cta||m.data.cta.h<44)fail.push('mobile hero CTA '+JSON.stringify(m.data.cta));
          if(!m.data.hamb||m.data.hamb.w<44||m.data.hamb.h<44)fail.push('mobile hamburger '+JSON.stringify(m.data.hamb));
          if(!m.data.programare)fail.push('booking anchor missing');
          if(m.data.cases?.h>1650)fail.push('cases too tall '+m.data.cases.h);
          if(m.data.caseCards.some(c=>c.rect?.h>470||c.cv!=='visible'))fail.push('case card intrinsic sizing '+JSON.stringify(m.data.caseCards));
          if(m.data.reviews?.h>1200)fail.push('reviews too tall '+m.data.reviews.h);
          if(m.data.offers?.h>1950)fail.push('offers too tall '+m.data.offers.h);
          if(!d.data.cta||d.data.cta.y>820||d.data.cta.h<44)fail.push('desktop CTA '+JSON.stringify(d.data.cta));
          if(d.data.hero?.h>760)fail.push('desktop hero '+d.data.hero.h);
          if((d.data.titleOverflow??0)>4)fail.push('desktop title clipped '+d.data.titleOverflow);
          if(m.errors.length||d.errors.length)fail.push('page errors '+JSON.stringify({m:m.errors,d:d.errors}));
          if(fail.length){console.error('UX_V2_FAIL '+JSON.stringify(fail));process.exit(1)}
          console.log('UX_V2_OK');
          JS
          node .verify-ux-preview.mjs
      - name: Upload V2 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-ui-perfect-v2-preview-20261007
          path: |
            ux-v2.json
            ux-v2-mobile-viewport.png
            ux-v2-mobile-full.png
            ux-v2-desktop-viewport.png
            ux-v2-desktop-full.png
