# trigger 2026-10-07T17:23+03:00
name: Live homepage snapshot once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-home-snapshot-once.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Capture live homepage
        run: |
          cat > .live-snapshot.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          for (const [name,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]]) {
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            await page.goto('https://astrovip.ro/?snapshot='+Date.now()+'-'+name,{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1500);
            const reject=page.getByRole('button',{name:/Respinge opționale/i});
            if(await reject.count() && await reject.isVisible().catch(()=>false)) await reject.click({force:true}).catch(()=>{});
            await page.screenshot({path:`live-${name}.png`,fullPage:true});
            console.log('LIVE_SNAPSHOT',name,JSON.stringify(await page.evaluate(()=>({title:document.title,bodyClass:document.body.className,hasV63Mobile:!!document.querySelector('#v63-mobile-prod'),hasV63Desktop:!!document.querySelector('#v63-desktop-prod'),v63MobileDisplay:document.querySelector('#v63-mobile-prod')?getComputedStyle(document.querySelector('#v63-mobile-prod')).display:null,v63DesktopDisplay:document.querySelector('#v63-desktop-prod')?getComputedStyle(document.querySelector('#v63-desktop-prod')).display:null,hasLegacyHero:!!document.querySelector('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore'),legacyHeroDisplay:document.querySelector('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore')?getComputedStyle(document.querySelector('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore')).display:null,hasPremiumCss:!!document.querySelector('#astrovip-premium-home-preview-css'),hasWowCss:!!document.querySelector('#astrovip-premium-home-wow-css'),text:document.body.innerText.slice(0,800)}))));
            await context.close();
          }
          await browser.close();
          JS
          node .live-snapshot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-home-snapshot
          path: |
            live-mobile.png
            live-desktop.png
