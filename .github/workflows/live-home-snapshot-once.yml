# trigger 2026-10-14 footer-v13-live
name: Live homepage snapshot once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-home-snapshot-once.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Capture live footer
        run: |
          cat > .live-snapshot.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          for (const [name,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]]) {
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            await page.goto('https://astrovip.ro/?footer-snapshot='+Date.now()+'-'+name,{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1800);
            const reject=page.getByRole('button',{name:/Respinge opționale/i});
            if(await reject.count() && await reject.isVisible().catch(()=>false)) await reject.click({force:true}).catch(()=>{});
            const footer=page.locator('footer.foot.av-footer-premium');
            await footer.scrollIntoViewIfNeeded();
            await page.waitForTimeout(400);
            const state=await page.evaluate(()=>{
              const q=s=>document.querySelector(s), rect=e=>e?e.getBoundingClientRect():null;
              const f=q('footer.foot.av-footer-premium'), services=q('.av-footer-card--services'), contact=q('.av-footer-card--contact'), bottom=q('.av-footer-bottom'), sticky=q('.av-mobile-sticky');
              const fr=rect(f), sr=rect(services), cr=rect(contact), br=rect(bottom), tr=rect(sticky);
              const before=bottom?getComputedStyle(bottom,'::before'):null;
              return {
                viewport:[innerWidth,innerHeight],
                footerHeight:fr?Math.round(fr.height):0,
                services:{display:services?getComputedStyle(services).display:'missing',w:sr?Math.round(sr.width):0,h:sr?Math.round(sr.height):0,border:services?getComputedStyle(services).borderTopWidth:'missing',radius:services?getComputedStyle(services).borderRadius:'missing'},
                contact:{display:contact?getComputedStyle(contact).display:'missing',w:cr?Math.round(cr.width):0,h:cr?Math.round(cr.height):0,border:contact?getComputedStyle(contact).borderTopWidth:'missing',radius:contact?getComputedStyle(contact).borderRadius:'missing'},
                bottom:{h:br?Math.round(br.height):0,padding:bottom?getComputedStyle(bottom).padding:'missing',beforeContent:before?.content,beforePosition:before?.position},
                sticky:{display:sticky?getComputedStyle(sticky).display:'missing',top:tr?Math.round(tr.top):null,h:tr?Math.round(tr.height):0},
                scrollHeight:document.documentElement.scrollHeight
              };
            });
            console.log('FOOTER_LIVE',name,JSON.stringify(state));
            await footer.screenshot({path:`live-footer-${name}.png`});
            await context.close();
          }
          await browser.close();
          JS
          node .live-snapshot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-footer-snapshot
          path: |
            live-footer-mobile.png
            live-footer-desktop.png
