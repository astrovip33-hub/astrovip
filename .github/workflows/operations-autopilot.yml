name: AstroVip Operations Auto-Pilot 24-7

on:
  workflow_run:
    workflows: ["Deploy AstroVip to Cloudflare Worker"]
    types: [completed]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astrovip-operations-autopilot
  cancel-in-progress: true

jobs:
  monitor:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Run production guard checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/operations_health.py

      - name: Create technical source snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=astrovip-autopilot-snapshot.zip HEAD

      - name: Upload Auto-Pilot report and snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrovip-autopilot-${{ github.run_id }}
          path: |
            autopilot-report.json
            astrovip-autopilot-snapshot.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          echo "## AstroVip Auto-Pilot 24/7" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cadence: every 4 hours" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: https://astrovip.ro" >> "$GITHUB_STEP_SUMMARY"
          echo "- Snapshot retention: 14 days" >> "$GITHUB_STEP_SUMMARY"
          if [ -f autopilot-report.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('autopilot-report.json',encoding='utf-8'))
          print(f"- Overall: {'OK' if d.get('ok') else 'ATTENTION'}")
          print(f"- Checked at: {d.get('checkedAt','—')}")
          for x in d.get('checks',[]):
              print(f"- {'✅' if x.get('ok') else '❌'} {x.get('key')}: {x.get('status', x.get('effective',''))}")
          PY
          fi
