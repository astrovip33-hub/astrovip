name: Tune midpoint cards and Uranus Pluto image

on:
  push:
    paths:
      - '.github/workflows/tune-midpoint-compact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compact midpoint UI and optimize Uranus Pluto visual
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Marker not found in {path}: {old[:90]}')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          js='assets/footer-orbit-20261026.js'
          replace(js, '.av-midpoint-shell{width:min(980px,100%);margin:auto}', '.av-midpoint-shell{width:min(760px,100%);margin:auto}')
          replace(js, '.av-midpoint-viewport{overflow:hidden;border-radius:23px;box-shadow:0 20px 62px rgba(0,0,0,.42),0 0 40px rgba(47,131,181,.08)}', '.av-midpoint-viewport{overflow:hidden;border-radius:18px;box-shadow:0 14px 42px rgba(0,0,0,.38),0 0 28px rgba(47,131,181,.07)}')
          replace(js, 'grid-template-columns:238px minmax(0,1fr);min-height:380px', 'grid-template-columns:190px minmax(0,1fr);min-height:300px')
          replace(js, 'border-radius:23px;overflow:hidden;background:radial-gradient', 'border-radius:18px;overflow:hidden;background:radial-gradient')
          replace(js, 'min-height:380px;object-fit:cover;object-position:center 48%', 'min-height:300px;object-fit:cover;object-position:center 48%')
          replace(js, '.av-midpoint-copy{display:flex;flex-direction:column;justify-content:center;padding:30px 32px}', '.av-midpoint-copy{display:flex;flex-direction:column;justify-content:center;padding:22px 24px}')
          replace(js, 'font:700 clamp(31px,5vw,52px)/.98 Georgia,serif', 'font:700 clamp(27px,4.5vw,42px)/.98 Georgia,serif')
          replace(js, '.av-midpoint-desc{max-width:600px;margin:14px 0 16px;color:#bed0dc;font:600 14px/1.58', '.av-midpoint-desc{max-width:600px;margin:11px 0 13px;color:#bed0dc;font:600 13px/1.5')
          replace(js, '.av-midpoint-planets{margin:0 0 18px;color:#8fa9bc;font:800 10px/1.5', '.av-midpoint-planets{margin:0 0 13px;color:#8fa9bc;font:800 9px/1.45')
          replace(js, 'min-height:42px;padding:9px 15px', 'min-height:38px;padding:8px 13px')
          replace(js, 'font:950 12px/1 Inter,system-ui,sans-serif', 'font:950 11px/1 Inter,system-ui,sans-serif')
          replace(js, '.av-midpoint-shell{width:min(100%,520px)}', '.av-midpoint-shell{width:min(100%,430px)}')
          replace(js, '.av-midpoint-slide{grid-template-columns:38% 62%;min-height:286px}', '.av-midpoint-slide{grid-template-columns:36% 64%;min-height:230px}')
          replace(js, '.av-midpoint-art img{min-height:286px;height:286px;object-position:center 47%}', '.av-midpoint-art img{min-height:230px;height:230px;object-position:center 47%}')
          replace(js, '.av-midpoint-copy{padding:18px 15px 17px 16px}', '.av-midpoint-copy{padding:13px 12px 13px 13px}')
          replace(js, '.av-midpoint-copy h3{font-size:clamp(25px,8vw,34px)}', '.av-midpoint-copy h3{font-size:clamp(22px,7vw,29px)}')
          replace(js, '.av-midpoint-copy h3 span{font-size:.52em}.av-midpoint-desc{margin:10px 0 11px;font-size:12px;line-height:1.48}', '.av-midpoint-copy h3 span{font-size:.5em}.av-midpoint-desc{margin:7px 0 9px;font-size:11px;line-height:1.42}')
          replace(js, '.av-midpoint-cta{min-height:38px;padding:8px 11px;font-size:10px}', '.av-midpoint-cta{min-height:34px;padding:7px 10px;font-size:9px}')
          replace(js, '.av-midpoint-note{font-size:8px;margin-top:9px}', '.av-midpoint-note{font-size:7px;margin-top:7px}')
          replace(js, '.av-midpoint-slide{grid-template-columns:39% 61%;min-height:268px}.av-midpoint-art img{height:268px;min-height:268px}', '.av-midpoint-slide{grid-template-columns:37% 63%;min-height:215px}.av-midpoint-art img{height:215px;min-height:215px}')
          replace(js, '.av-midpoint-copy{padding:15px 12px}.av-midpoint-desc{font-size:11px}', '.av-midpoint-copy{padding:12px 10px}.av-midpoint-desc{font-size:10.5px}')
          replace(js, '.av-midpoint-slide{grid-template-columns:40% 60%}.av-midpoint-copy h3{font-size:24px}', '.av-midpoint-slide{grid-template-columns:38% 62%}.av-midpoint-copy h3{font-size:21px}')

          page='puncte-mijlocii/uranus-pluto/index.html'
          replace(page, 'grid-template-columns:minmax(0,1.04fr) minmax(320px,.72fr);gap:34px', 'grid-template-columns:minmax(0,1.18fr) minmax(240px,.48fr);gap:28px')
          replace(page, '.avpm-visual{position:relative;overflow:hidden;border-radius:28px;', '.avpm-visual{position:relative;overflow:hidden;width:min(100%,300px);justify-self:end;border-radius:22px;')
          replace(page, '.avpm-card{position:relative;overflow:hidden;min-height:230px;border:1px', '.avpm-card{position:relative;overflow:hidden;min-height:185px;border:1px')
          replace(page, 'border-radius:22px;padding:24px;background:radial-gradient', 'border-radius:18px;padding:19px;background:radial-gradient')
          replace(page, '.avpm-card-head{display:flex;align-items:center;gap:14px}', '.avpm-card-head{display:flex;align-items:center;gap:11px}')
          replace(page, '.avpm-glyph{width:49px;height:49px;', '.avpm-glyph{width:42px;height:42px;')
          replace(page, 'font:700 27px/1 Georgia,serif', 'font:700 23px/1 Georgia,serif')
          replace(page, '.avpm-card h3{margin:0;color:#fff;font-size:21px}', '.avpm-card h3{margin:0;color:#fff;font-size:18px}')
          replace(page, '.avpm-card p{margin:15px 0 0;color:#b8c9d6;font-size:14px;line-height:1.58}', '.avpm-card p{margin:11px 0 0;color:#b8c9d6;font-size:13px;line-height:1.48}')
          replace(page, '.avpm-key{margin-top:15px;', '.avpm-key{margin-top:11px;')
          replace(page, '.avpm-visual{order:2;width:min(82vw,390px);margin:auto;border-radius:22px}', '.avpm-visual{order:2;width:min(64vw,250px);margin:auto;border-radius:18px}')
          replace(page, '.avpm-card{min-height:0;padding:21px}', '.avpm-card{min-height:0;padding:16px}')
          replace(page, '.avpm-visual{width:min(84vw,330px)}', '.avpm-visual{width:min(62vw,235px)}')
          replace(page, 'alt="Uranus și Pluto unite printr-un punct mijlociu luminos" fetchpriority="high">', 'alt="Uranus și Pluto unite printr-un punct mijlociu luminos" fetchpriority="high" decoding="async" sizes="(max-width:390px) 235px, (max-width:820px) 250px, 300px">')

          svg='assets/puncte-mijlocii-uranus-pluto-premium.svg'
          replace(svg, '<filter id="glow"><feGaussianBlur stdDeviation="14"', '<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"')
          replace(svg, '<filter id="soft"><feGaussianBlur stdDeviation="48"/></filter>', '<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>')
          PY

      - name: Commit compact midpoint UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'astrovip33-hub'
          git config user.email 'astrovip33@gmail.com'
          git add assets/footer-orbit-20261026.js puncte-mijlocii/uranus-pluto/index.html assets/puncte-mijlocii-uranus-pluto-premium.svg
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'Compact midpoint cards and optimize Uranus Pluto image'
          git push
