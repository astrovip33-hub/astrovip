# Final mobile Hero source pass 2026-10-07
name: Fix homepage Hero and Romanian menu once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-homepage-hero-menu-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile Hero source repair
        run: |
          python3 scripts/fix_mobile_hero_source_20261007.py
          node --check worker.js
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "AstroVip Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js
          git commit -m "Fix mobile Hero image source"
          git push origin HEAD:main
