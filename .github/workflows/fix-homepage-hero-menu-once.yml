name: Restore current AstroVip homepage visibility

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-homepage-hero-menu-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd

jobs:
  repair-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove orphaned V63 CSS blocks at source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          blocks=[
            ('<!-- V63-MOBILE-PROD-CSS-START -->','<!-- V63-MOBILE-PROD-CSS-END -->'),
            ('<!-- V63-DESKTOP-PROD-CSS-START -->','<!-- V63-DESKTOP-PROD-CSS-END -->'),
          ]
          for start,end in blocks:
              if start in s:
                  a=s.index(start)
                  b=s.index(end,a)+len(end)
                  s=s[:a]+'\n<!-- V63 orphan CSS removed 2026-10-07; current authored homepage retained -->\n'+s[b:]
          old="const clock=document.getElementById('av-bucharest-clock');\n  const format="
          new="const clock=document.getElementById('av-bucharest-clock');\n  if(!clock)return;\n  const format="
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          ! grep -q 'V63-MOBILE-PROD-CSS-START' index.html
          ! grep -q 'V63-DESKTOP-PROD-CSS-START' index.html
          ! grep -q 'id="v63-mobile-prod-css"' index.html
          ! grep -q 'id="v63-desktop-prod-css"' index.html

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Remove orphaned V63 CSS hiding current homepage"
            git push origin HEAD:main
          fi

      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy exact repaired source
        run: npx --yes wrangler@latest deploy

      - name: Inspect production HTML without blocking visual test
        shell: bash
        run: |
          tmp="$(mktemp)"
          curl -fsS "https://astrovip.ro/?source_repair=$RANDOM" -o "$tmp" || true
          echo "mobile_style_count=$(grep -c 'id=\"v63-mobile-prod-css\"' "$tmp" || true)"
          echo "desktop_style_count=$(grep -c 'id=\"v63-desktop-prod-css\"' "$tmp" || true)"
          echo "booking_bridge_count=$(grep -c 'booking-bridge-20261007.js' "$tmp" || true)"

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Render current homepage live
        shell: bash
        run: |
          cat > .verify-current-home.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const results=[];
          for(const [name,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]]){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('https://astrovip.ro/?current_home='+Date.now()+'-'+name,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(4000);
            const reject=page.getByRole('button',{name:/Respinge opționale/i});
            if(await reject.count() && await reject.isVisible().catch(()=>false)) await reject.click({force:true}).catch(()=>{});
            await page.waitForTimeout(500);
            const data=await page.evaluate(()=>{
              const main=document.querySelector('main#top');
              const hero=document.querySelector('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore');
              const hr=hero?.getBoundingClientRect();
              const visibleMainChildren=main?[...main.children].filter(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'}).length:0;
              const text=(document.body.innerText||'').replace(/\s+/g,' ').trim();
              const imgs=[...(hero?.querySelectorAll('img')||[])].map(i=>{const r=i.getBoundingClientRect();return {src:i.currentSrc||i.src,natural:[i.naturalWidth,i.naturalHeight],rect:[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)]}});
              return {innerWidth,scrollWidth:document.documentElement.scrollWidth,textLength:text.length,visibleMainChildren,heroRect:hr?[Math.round(hr.x),Math.round(hr.y),Math.round(hr.width),Math.round(hr.height)]:null,heroImgs:imgs,v63MobileCss:!!document.querySelector('#v63-mobile-prod-css'),v63DesktopCss:!!document.querySelector('#v63-desktop-prod-css'),hasPremium:text.toUpperCase().includes('ASTROLOGIE PREMIUM')};
            });
            data.errors=errors;
            await page.screenshot({path:`current-${name}.png`,fullPage:false});
            console.log('CURRENT_HOME_RESULT '+name+' '+JSON.stringify(data));
            results.push({name,data});
            await context.close();
          }
          await browser.close();
          const fail=[];
          for(const r of results){
            if(r.data.v63MobileCss||r.data.v63DesktopCss)fail.push(r.name+': orphan V63 CSS still present');
            if(r.data.visibleMainChildren<1)fail.push(r.name+': main has no visible children');
            if(!r.data.heroRect||r.data.heroRect[2]<100||r.data.heroRect[3]<100)fail.push(r.name+': current Hero not visible '+JSON.stringify(r.data.heroRect));
            if(r.name==='mobile'&&r.data.scrollWidth>392)fail.push('mobile overflow '+r.data.scrollWidth);
          }
          if(fail.length){console.error('CURRENT_HOME_FAILURE '+JSON.stringify(fail));process.exit(1)}
          console.log('CURRENT_HOME_OK current homepage is visible on mobile and desktop');
          JS
          node .verify-current-home.mjs

      - name: Upload current homepage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-homepage-visible
          path: |
            current-mobile.png
            current-desktop.png
