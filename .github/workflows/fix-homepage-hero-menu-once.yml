name: Force fresh AstroVip homepage assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-homepage-hero-menu-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache-bust homepage runtime and keep authored Hero
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          s=s.replace('/assets/page-editor-runtime.js?v=20261006-premium-wow3','/assets/page-editor-runtime.js?v=20261007-1728-fresh')
          s=s.replace('/assets/astrovip-hero-premium-mobile-20261001.webp?v=20261006-v63','/assets/astrovip-hero-premium-mobile-20261001.webp?v=20261007-1728-fresh')
          s=s.replace('/assets/astrovip-hero-desktop-final-20261002.avif?v=20261006-v63-desktop','/assets/astrovip-hero-desktop-final-20261002.avif?v=20261007-1728-fresh')
          stale="          .on('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore .av-hero-v2-visual picture',{element(el){el.remove()}})\n"
          s=s.replace(stale,'')
          p.write_text(s)
          PY
          node --check worker.js
          git diff --check
          grep -q '20261007-1728-fresh' worker.js
          ! grep -q "av-hero-mobile-restore .av-hero-v2-visual picture',{element(el){el.remove()}}" worker.js

      - name: Commit homepage freshness repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js
          git commit -m "Force fresh homepage assets and preserve Hero"
          git push origin HEAD:main

      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy repaired Worker
        run: npx --yes wrangler@latest deploy

      - name: Verify fresh production HTML
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl -fsS "https://astrovip.ro/?fresh_home=$GITHUB_SHA" -o "$tmp"
          test -s "$tmp"
          grep -q '20261007-1728-fresh' "$tmp"
          grep -q 'CUNOȘTI MOMENTUL' "$tmp"
          grep -q 'booking-bridge-20261007.js' "$tmp"
