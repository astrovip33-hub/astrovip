name: Deploy AstroVip to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'scripts' \
            --exclude 'supabase' \
            --exclude 'node_modules' \
            --exclude 'vercel.json' \
            --exclude 'wrangler.jsonc' \
            --exclude '.assetsignore' \
            --exclude '.deploy-trigger' \
            --exclude 'atlas-10000-generation-report.json' \
            --exclude 'assets/hero-responsive-vivid'
          touch _site/.nojekyll
          printf 'astrovip.ro\n' > _site/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
