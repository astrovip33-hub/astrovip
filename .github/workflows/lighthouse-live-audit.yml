name: Lighthouse live audit

on:
  workflow_run:
    workflows: ["Deploy AstroVip to Cloudflare Worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-live-audit
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Start verified Chrome for Lighthouse
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/astrovip-lighthouse-profile" about:blank \
            > /tmp/astrovip-lighthouse-chrome.log 2>&1 &
          echo "ASTROVIP_LIGHTHOUSE_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 1 http://127.0.0.1:9222/json/version > /tmp/astrovip-lighthouse-chrome-version.json; then
              echo "Chrome debugging endpoint is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astrovip-lighthouse-chrome.log
          exit 1

      - name: Audit mobile
        shell: bash
        run: |
          set -euo pipefail
          npx --yes lighthouse@12 https://astrovip.ro/ \
            --port=9222 \
            --output=json \
            --output-path=/tmp/lh-mobile.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --form-factor=mobile \
            --only-categories=performance,accessibility,best-practices,seo

      - name: Audit desktop
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes lighthouse@12 https://astrovip.ro/ \
            --port=9222 \
            --output=json \
            --output-path=/tmp/lh-desktop.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo

      - name: Print actionable report
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const compact = v => JSON.stringify(v).slice(0,1600);
          for (const [label, file] of [['MOBILE','/tmp/lh-mobile.json'],['DESKTOP','/tmp/lh-desktop.json']]) {
            const r = JSON.parse(fs.readFileSync(file,'utf8'));
            const a = r.audits;
            const cat = r.categories;
            const pct = x => Math.round((x?.score ?? 0) * 100);
            console.log(`\n===== ${label} =====`);
            console.log(`Performance ${pct(cat.performance)} | Accessibility ${pct(cat.accessibility)} | Best Practices ${pct(cat['best-practices'])} | SEO ${pct(cat.seo)}`);
            for (const id of ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive','server-response-time']) {
              if (a[id]) console.log(`${id}: ${a[id].displayValue ?? a[id].numericValue}`);
            }
            const opps = Object.values(a)
              .filter(x => x.details && x.details.type === 'opportunity' && x.score !== 1)
              .map(x => ({id:x.id,title:x.title,s:x.details.overallSavingsMs || 0,b:x.details.overallSavingsBytes || 0,display:x.displayValue || ''}))
              .sort((x,y)=>(y.s-x.s)||(y.b-x.b))
              .slice(0,15);
            console.log('\nTOP OPPORTUNITIES');
            for (const x of opps) console.log(`${x.id} | ${x.title} | save_ms=${Math.round(x.s)} | save_bytes=${Math.round(x.b)} | ${x.display}`);
            const ids = ['render-blocking-resources','unused-css-rules','unused-javascript','uses-optimized-images','uses-responsive-images','modern-image-formats','offscreen-images','uses-text-compression','uses-long-cache-ttl','font-display','third-party-summary','mainthread-work-breakdown','bootup-time','dom-size','lcp-lazy-loaded','largest-contentful-paint-element','prioritize-lcp-image','network-dependency-tree-insight','image-delivery-insight','document-latency-insight','render-blocking-insight','lcp-discovery-insight'];
            console.log('\nKEY DIAGNOSTICS');
            for (const id of ids) if (a[id] && a[id].score !== 1) console.log(`${id} | score=${a[id].score} | ${a[id].title} | ${a[id].displayValue || ''}`);

            console.log('\nDETAILED ITEMS');
            for (const id of ['largest-contentful-paint-element','prioritize-lcp-image','unused-css-rules','unused-javascript','uses-responsive-images','uses-long-cache-ttl','bootup-time','mainthread-work-breakdown','render-blocking-resources','network-dependency-tree-insight','image-delivery-insight','lcp-discovery-insight']) {
              const audit = a[id];
              const items = audit?.details?.items;
              if (!Array.isArray(items) || !items.length) continue;
              console.log(`-- ${id} --`);
              for (const item of items.slice(0,12)) {
                const picked = {
                  url:item.url,
                  totalBytes:item.totalBytes,
                  transferSize:item.transferSize,
                  wastedBytes:item.wastedBytes,
                  wastedMs:item.wastedMs,
                  total:item.total,
                  scripting:item.scripting,
                  scriptParseCompile:item.scriptParseCompile,
                  selector:item.node?.selector,
                  snippet:item.node?.snippet,
                  label:item.label,
                  duration:item.duration,
                  mainThreadTime:item.mainThreadTime,
                  cacheLifetimeMs:item.cacheLifetimeMs,
                  requestCount:item.requestCount
                };
                console.log(compact(picked));
              }
            }

            const net = a['network-requests']?.details?.items || [];
            console.log('\nLARGEST NETWORK RESOURCES');
            net.filter(x => x.url && !x.url.startsWith('data:'))
              .sort((x,y)=>(y.transferSize||0)-(x.transferSize||0))
              .slice(0,20)
              .forEach(x => console.log(compact({url:x.url,transferSize:x.transferSize,resourceSize:x.resourceSize,mimeType:x.mimeType,resourceType:x.resourceType,statusCode:x.statusCode}))); 
          }
          NODE

      - name: Save Lighthouse reports and Chrome diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrovip-lighthouse-${{ github.run_id }}
          path: |
            /tmp/lh-mobile.json
            /tmp/lh-desktop.json
            /tmp/astrovip-lighthouse-chrome.log
            /tmp/astrovip-lighthouse-chrome-version.json
          if-no-files-found: warn
          retention-days: 14
