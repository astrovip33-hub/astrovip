name: Normalize AstroVip entity identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-astrovip-entity.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'chore: normalize AstroVip entity Instagram'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace stale Instagram identity
        shell: bash
        run: |
          mapfile -t files < <(git grep -Il 'https://www.instagram.com/astrovip77/' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No stale Instagram URLs found.'
            exit 0
          fi
          printf 'Updating %s\n' "${files[@]}"
          for file in "${files[@]}"; do
            sed -i 's#https://www.instagram.com/astrovip77/#https://www.instagram.com/astrovip333/#g' "$file"
          done
          git diff --check
          git diff --stat
      - name: Commit normalized identity
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SEO/GEO: normalize official Instagram identity'
          git push origin HEAD:main
