name: Normalize AstroVip entity identity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-astrovip-entity.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace stale Instagram identity
        run: |
          git grep -Il 'https://www.instagram.com/astrovip77/' -- ':!.github/workflows/*' > /tmp/astrovip-files.txt || true
          if [ ! -s /tmp/astrovip-files.txt ]; then
            echo 'No stale Instagram URLs found outside workflows.'
            exit 0
          fi
          while IFS= read -r file; do
            sed -i 's#https://www.instagram.com/astrovip77/#https://www.instagram.com/astrovip333/#g' "$file"
          done < /tmp/astrovip-files.txt
          git diff --check
          git diff --stat
      - name: Commit normalized identity
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SEO/GEO: normalize official Instagram identity'
          git push origin HEAD:main
