name: Preview Homepage Visual Dedupe Check

on:
  push:
    branches:
      - preview/homepage-hard-dedupe-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for current preview marker
        shell: bash
        run: |
          set -euo pipefail
          URL="https://astrovip-preview-ux-compact.astrovip33.workers.dev/?marker=${GITHUB_SHA}"
          READY=0
          for ATTEMPT in $(seq 1 30); do
            curl -fsSL "$URL&attempt=$ATTEMPT" -o /tmp/current-preview.html || true
            if grep -Fq '20261013-hard-mobile-main-only-preview2' /tmp/current-preview.html; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" = "1"
          echo "Current preview marker confirmed."

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Assert rendered mobile homepage has one visible main block
        shell: bash
        run: |
          cat > .audit-preview.mjs <<'JS'
          import { chromium } from 'playwright';
          const url='https://astrovip-preview-ux-compact.astrovip33.workers.dev/?visual-audit='+Date.now();
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await page.goto(url,{waitUntil:'networkidle',timeout:90000});
          const reject=page.getByRole('button',{name:/Respinge opționale/i});
          if(await reject.count() && await reject.isVisible().catch(()=>false)) await reject.click({force:true}).catch(()=>{});
          await page.waitForTimeout(1200);
          const result=await page.evaluate(()=>{
            const rectInfo=(el)=>{if(!el)return null;const r=el.getBoundingClientRect();const s=getComputedStyle(el);return {display:s.display,visibility:s.visibility,h:+r.height.toFixed(1),y:+r.y.toFixed(1),text:(el.innerText||'').replace(/\s+/g,' ').trim().slice(0,120)}};
            const main=document.querySelector('main#top')||document.querySelector('main');
            const visibleMain=main?[...main.children].filter(el=>{if(['STYLE','SCRIPT'].includes(el.tagName))return false;const r=el.getBoundingClientRect();const s=getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&r.height>1;}).map(el=>({id:el.id||'',cls:String(el.className||''),...rectInfo(el)})):[];
            return {
              marker:document.querySelector('meta[name="astrovip-home-render"]')?.content||'',
              visibleMain,
              mobile:rectInfo(document.querySelector('#av-mobile-approved-home')),
              legacyHero:rectInfo(document.querySelector('section.av-pro-hero')),
              legacyServices:rectInfo(document.querySelector('#servicii.av-pro-interests'))
            };
          });
          console.log(JSON.stringify(result,null,2));
          if(result.marker!=='20261013-hard-mobile-main-only-preview2') throw new Error('Wrong preview marker: '+result.marker);
          if(result.visibleMain.length!==1 || result.visibleMain[0].id!=='av-mobile-approved-home') throw new Error('Expected only #av-mobile-approved-home visible in main');
          if(!result.mobile || result.mobile.display==='none' || result.mobile.h<=1) throw new Error('Approved mobile homepage is not visible');
          if(result.legacyHero && result.legacyHero.display!=='none' && result.legacyHero.h>1) throw new Error('Legacy av-pro-hero is still visible');
          if(result.legacyServices && result.legacyServices.display!=='none' && result.legacyServices.h>1) throw new Error('Legacy services block is still visible');
          await page.screenshot({path:'preview-mobile-fixed.png',fullPage:true});
          await browser.close();
          JS
          node .audit-preview.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-mobile-fixed-verification
          path: preview-mobile-fixed.png
