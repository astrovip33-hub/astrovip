name: Build optimized AstroVip hero assets once

on:
  push:
    paths:
      - '.github/workflows/build-hero-binary-once.yml'
      - 'assets/hero-responsive-vivid/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct current approved hero video
        shell: bash
        run: |
          set -euo pipefail
          cat assets/hero-v3/part-*.b64 | tr -d '\r\n\t ' | base64 --decode > assets/astrovip-hero-current.mp4
          test -s assets/astrovip-hero-current.mp4
          python3 - <<'PY'
          from pathlib import Path
          p=Path("assets/astrovip-hero-current.mp4")
          data=p.read_bytes()[:32]
          if b"ftyp" not in data:
              raise SystemExit("Decoded hero file is not an MP4")
          print("Hero MP4 bytes:", p.stat().st_size)
          PY

      - name: Re-encode LCP poster efficiently
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path("assets/1000049884.webp")
          dst=Path("assets/1000049884-lcp.webp")
          with Image.open(src) as im:
              im=im.convert("RGB")
              im.thumbnail((720,960), Image.Resampling.LANCZOS)
              im.save(dst,"WEBP",quality=72,method=6)
          print("LCP poster bytes:", dst.stat().st_size)
          PY


      - name: Build responsive vivid hero images when chunks are complete
        shell: bash
        run: |
          set -euo pipefail
          if [ -f assets/hero-responsive-vivid/desktop-08.b64 ] &&
             [ -f assets/hero-responsive-vivid/mobile-05.b64 ]; then
            cat assets/hero-responsive-vivid/desktop-*.b64 | tr -d '\r\n\t ' | base64 --decode > assets/hero-vivid-desktop.webp
            cat assets/hero-responsive-vivid/mobile-*.b64 | tr -d '\r\n\t ' | base64 --decode > assets/hero-vivid-mobile.webp
            python3 - <<'PY'
          from PIL import Image
          for p, expected in [
              ("assets/hero-vivid-desktop.webp",(1000,563)),
              ("assets/hero-vivid-mobile.webp",(600,538)),
          ]:
              with Image.open(p) as im:
                  if im.size != expected or im.format != "WEBP":
                      raise SystemExit(f"Invalid hero asset {p}: {im.format} {im.size}")
                  print(p, im.size)
          PY
          else
            echo "Responsive vivid hero chunks not complete yet; skipping."
          fi

      - name: Commit generated binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip Build"
          git config user.email "actions@users.noreply.github.com"
          git add assets/astrovip-hero-current.mp4 assets/1000049884-lcp.webp
          [ -f assets/hero-vivid-desktop.webp ] && git add assets/hero-vivid-desktop.webp
          [ -f assets/hero-vivid-mobile.webp ] && git add assets/hero-vivid-mobile.webp
          if git diff --cached --quiet; then
            echo "Generated assets already current."
          else
            git commit -m "Build binary hero video and optimized LCP poster"
            git push
          fi
