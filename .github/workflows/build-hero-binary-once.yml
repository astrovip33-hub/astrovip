name: Build optimized AstroVip hero assets once

on:
  push:
    paths:
      - '.github/workflows/build-hero-binary-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct current approved hero video
        shell: bash
        run: |
          set -euo pipefail
          cat assets/hero-v3/part-*.b64 | tr -d '\r\n\t ' | base64 --decode > assets/astrovip-hero-current.mp4
          test -s assets/astrovip-hero-current.mp4
          python3 - <<'PY'
          from pathlib import Path
          p=Path("assets/astrovip-hero-current.mp4")
          data=p.read_bytes()[:32]
          if b"ftyp" not in data:
              raise SystemExit("Decoded hero file is not an MP4")
          print("Hero MP4 bytes:", p.stat().st_size)
          PY

      - name: Re-encode LCP poster efficiently
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path("assets/1000049884.webp")
          dst=Path("assets/1000049884-lcp.webp")
          with Image.open(src) as im:
              im=im.convert("RGB")
              im.thumbnail((720,960), Image.Resampling.LANCZOS)
              im.save(dst,"WEBP",quality=72,method=6)
          print("LCP poster bytes:", dst.stat().st_size)
          PY

      - name: Commit generated binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip Build"
          git config user.email "actions@users.noreply.github.com"
          git add assets/astrovip-hero-current.mp4 assets/1000049884-lcp.webp
          if git diff --cached --quiet; then
            echo "Generated assets already current."
          else
            git commit -m "Build binary hero video and optimized LCP poster"
            git push
          fi
