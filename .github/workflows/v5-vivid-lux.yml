name: V5 Vivid Lux Refinement

on:
  push:
    branches: ["preview-premium-home-v5-20261006"]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-premium-home-v5-20261006
      - name: Intensify V5 luxury color system
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('premium-preview-v5/index.html')
          s = p.read_text(encoding='utf-8')
          reps = {
          ':root{--ink:#020506;--onyx:#07100f;--deep:#071527;--emerald:#0f5b45;--green:#5ad39d;--gold:#d8b45d;--gold2:#f5dda0;--pearl:#fffaf0;--muted:#aab8b1;--line:rgba(245,221,160,.22)}':
          ':root{--ink:#020506;--onyx:#06100f;--deep:#06152b;--emerald:#0a7252;--green:#52f2aa;--cyan:#6fe8ff;--sapphire:#6188ff;--violet:#ba7cff;--gold:#e0b94f;--gold2:#ffe6a1;--pearl:#fffaf0;--muted:#b7c6c0;--line:rgba(255,230,161,.28)}',
          'body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-3;background:radial-gradient(circle at 70% 16%,rgba(26,91,180,.24),transparent 30%),radial-gradient(circle at 20% 16%,rgba(25,160,111,.16),transparent 26%),radial-gradient(circle at 56% 70%,rgba(216,180,93,.09),transparent 24%),linear-gradient(180deg,#020506 0,#03100e 48%,#020506 100%)}':
          'body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-3;background:radial-gradient(circle at 76% 12%,rgba(72,113,255,.34),transparent 28%),radial-gradient(circle at 18% 18%,rgba(20,220,146,.24),transparent 28%),radial-gradient(circle at 50% 44%,rgba(94,225,255,.12),transparent 30%),radial-gradient(circle at 58% 74%,rgba(255,193,71,.15),transparent 25%),radial-gradient(circle at 90% 68%,rgba(178,94,255,.12),transparent 24%),linear-gradient(180deg,#020506 0,#031319 48%,#020507 100%)}',
          'body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;opacity:.23;background-image:radial-gradient(circle,rgba(255,255,255,.72) 0 1px,transparent 1.2px);background-size:130px 130px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}':
          'body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;opacity:.32;background-image:radial-gradient(circle,rgba(255,255,255,.82) 0 1px,transparent 1.2px);background-size:118px 118px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}',
          '.topline{height:2px;background:linear-gradient(90deg,transparent,#8d7440,var(--gold2),#5dd8a1,#6596ff,var(--gold2),transparent);box-shadow:0 0 28px rgba(245,221,160,.24)}':
          '.topline{height:2px;background:linear-gradient(90deg,transparent,#f0b94c,#ffe7a7,#52f2aa,#6fe8ff,#7188ff,#d78cff,#ffe7a7,transparent);box-shadow:0 0 34px rgba(111,232,255,.22),0 0 22px rgba(255,222,145,.28)}',
          '.hero{min-height:100svh;position:relative;display:flex;align-items:center;overflow:hidden;isolation:isolate}.aurora{position:absolute;inset:-15%;z-index:-1;filter:blur(24px);opacity:.92;background:radial-gradient(ellipse at 70% 38%,rgba(45,98,190,.22),transparent 30%),radial-gradient(ellipse at 72% 44%,rgba(28,157,111,.18),transparent 24%),radial-gradient(ellipse at 62% 52%,rgba(215,177,89,.11),transparent 19%);animation:drift 16s ease-in-out infinite alternate}':
          '.hero{min-height:100svh;position:relative;display:flex;align-items:center;overflow:hidden;isolation:isolate}.aurora{position:absolute;inset:-15%;z-index:-1;filter:blur(20px);opacity:1;background:radial-gradient(ellipse at 74% 28%,rgba(63,101,255,.34),transparent 30%),radial-gradient(ellipse at 70% 43%,rgba(35,230,159,.26),transparent 25%),radial-gradient(ellipse at 52% 54%,rgba(91,225,255,.16),transparent 23%),radial-gradient(ellipse at 60% 58%,rgba(236,183,72,.17),transparent 20%),radial-gradient(ellipse at 85% 62%,rgba(176,90,255,.14),transparent 22%);animation:drift 14s ease-in-out infinite alternate}',
          '.hero-art:before{content:"";position:absolute;inset:8%;border-radius:50%;background:conic-gradient(from 20deg,rgba(216,180,93,.05),rgba(40,160,117,.13),rgba(36,94,190,.12),rgba(216,180,93,.05),rgba(0,0,0,0));filter:blur(18px);animation:halo 20s linear infinite}':
          '.hero-art:before{content:"";position:absolute;inset:6%;border-radius:50%;background:conic-gradient(from 10deg,rgba(255,210,96,.12),rgba(34,230,154,.22),rgba(72,117,255,.24),rgba(108,231,255,.20),rgba(194,105,255,.16),rgba(255,210,96,.12),rgba(0,0,0,0));filter:blur(16px);animation:halo 18s linear infinite}',
          '.astrolabe{width:100%;height:100%;filter:drop-shadow(0 40px 80px rgba(0,0,0,.45)) drop-shadow(0 0 30px rgba(216,180,93,.08))}':
          '.astrolabe{width:100%;height:100%;filter:drop-shadow(0 36px 76px rgba(0,0,0,.46)) drop-shadow(0 0 26px rgba(255,213,110,.18)) drop-shadow(0 0 42px rgba(83,225,255,.12))}',
          '.hero h1 .line2{display:block;margin-left:clamp(22px,4.5vw,82px);background:linear-gradient(90deg,#f8e8b5,#cda34a 42%,#7ce5b3 86%);-webkit-background-clip:text;background-clip:text;color:transparent}':
          '.hero h1 .line2{display:block;margin-left:clamp(22px,4.5vw,82px);background:linear-gradient(90deg,#fff0bc 0%,#efbb49 27%,#65f0b2 58%,#6fe8ff 78%,#9c8cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 34px rgba(98,232,255,.08)}',
          '.primary{color:#07100b;background:linear-gradient(180deg,#fff0bf 0,#e5c871 36%,#b78b2f 100%);box-shadow:0 16px 45px rgba(216,180,93,.22),inset 0 1px rgba(255,255,255,.9)}.ghost{border:1px solid rgba(106,226,171,.38);background:rgba(3,22,16,.4);backdrop-filter:blur(14px);color:#effff6}':
          '.primary{color:#07100b;background:linear-gradient(180deg,#fff5c9 0,#f1cf68 34%,#c99127 100%);box-shadow:0 16px 48px rgba(244,191,68,.30),0 0 28px rgba(255,221,125,.12),inset 0 1px rgba(255,255,255,.95)}.ghost{border:1px solid rgba(98,235,201,.54);background:linear-gradient(135deg,rgba(7,42,34,.62),rgba(12,30,58,.56));backdrop-filter:blur(14px);color:#f2fff9;box-shadow:0 10px 34px rgba(43,216,167,.10),inset 0 1px rgba(255,255,255,.05)}',
          '.ribbon{position:absolute;left:0;right:0;bottom:0;z-index:7;border-top:1px solid rgba(245,221,160,.18);border-bottom:1px solid rgba(245,221,160,.08);background:linear-gradient(90deg,rgba(5,18,15,.78),rgba(7,18,30,.62),rgba(5,18,15,.78));backdrop-filter:blur(20px)}':
          '.ribbon{position:absolute;left:0;right:0;bottom:0;z-index:7;border-top:1px solid rgba(255,228,151,.26);border-bottom:1px solid rgba(100,230,198,.12);background:linear-gradient(90deg,rgba(5,29,23,.86),rgba(7,25,52,.76) 38%,rgba(14,39,36,.82) 70%,rgba(11,20,39,.80));backdrop-filter:blur(20px);box-shadow:0 -18px 58px rgba(64,176,255,.06)}',
          '.stat strong{font-family:Georgia,serif;font-size:24px;line-height:1;color:#f6e1a3}':
          '.stat strong{font-family:Georgia,serif;font-size:24px;line-height:1;color:#ffe6a1;text-shadow:0 0 20px rgba(255,222,140,.10)}.stat:nth-child(2) strong{color:#7cecff}.stat:nth-child(3) strong{color:#72efb0}.stat:nth-child(4) strong{color:#c9a0ff}',
          '.work{position:relative;min-height:410px;border-radius:28px;overflow:hidden;border:1px solid rgba(245,221,160,.15);background:linear-gradient(145deg,rgba(17,38,32,.86),rgba(5,12,16,.94));box-shadow:0 28px 80px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.025)}.work:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(56,120,210,.15),transparent 30%),radial-gradient(circle at 20% 90%,rgba(40,175,120,.13),transparent 34%)}':
          '.work{position:relative;min-height:410px;border-radius:28px;overflow:hidden;border:1px solid rgba(255,226,146,.19);background:linear-gradient(145deg,rgba(13,48,40,.90),rgba(7,17,35,.94));box-shadow:0 28px 80px rgba(0,0,0,.30),0 0 34px rgba(61,186,255,.04),inset 0 1px rgba(255,255,255,.035)}.work:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 8%,rgba(72,121,255,.25),transparent 31%),radial-gradient(circle at 18% 88%,rgba(46,229,153,.20),transparent 35%),radial-gradient(circle at 58% 44%,rgba(113,232,255,.08),transparent 28%)}'
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit('Missing expected CSS fragment: ' + old[:80])
              s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refined preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium-preview-v5/index.html
          git commit -m "Make V5 more vivid while preserving luxury" || exit 0
          git push origin HEAD:preview-premium-home-v5-20261006
