name: Restore planetary ticker dependency 2026-10-05

on:
  push:
    branches:
      - seo-remediate-2026-10-05
    paths:
      - scripts/restore_planetary_ticker_refs_20261005.py
      - .github/workflows/restore-planetary-ticker-20261005.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: seo-remediate-2026-10-05
          fetch-depth: 0

      - name: Repair ticker references
        run: python3 scripts/restore_planetary_ticker_refs_20261005.py

      - name: Commit ticker repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip SEO Bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No ticker changes to commit."
            exit 0
          fi
          git commit -m "SEO: replace dead planetary ticker dependency"
          git push origin HEAD:seo-remediate-2026-10-05
