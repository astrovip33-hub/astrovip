name: Compact lottery case study on homepage

on:
  push:
    paths:
      - '.homepage-lotto-compact-trigger'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run compact homepage patch
        run: python scripts/compact_lotto_homepage.py
      - name: Commit compact teaser
        run: |
          git config user.name "AstroVip Automation"
          git config user.email "astrovip33@gmail.com"
          git add index.html assets/studiu-caz-scoala.css
          git diff --cached --quiet && exit 0
          git commit -m "Micșorează teaserul Loto din prima pagină"
          git push
