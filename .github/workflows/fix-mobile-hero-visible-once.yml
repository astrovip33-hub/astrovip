name: Force current mobile Hero live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mobile-hero-visible-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd

jobs:
  repair-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force authored mobile Hero through Worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          marker="          .on('link[rel=\"preload\"][as=\"image\"]',{element(el){const srcset=el.getAttribute('imagesrcset')||'';const href=el.getAttribute('href')||'';if(srcset.includes('astrovip-hero-mobile-clean-cards-')||srcset.includes('astrovip-hero-lux-clean-20260922')||href.includes('astrovip-hero-mobile-clean-cards-')||href.includes('astrovip-hero-lux-clean-20260922'))el.remove();}})\n"
          add=marker+"          .on('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore .av-hero-v2-visual picture source[media=\"(max-width:820px)\"]',{element(el){el.setAttribute('srcset','/assets/astrovip-hero-premium-mobile-20261001.webp?v=20261007-worker-final');el.setAttribute('type','image/webp');el.removeAttribute('sizes')}})\n          .on('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore .av-hero-v2-visual picture img',{element(el){el.setAttribute('src','/assets/astrovip-hero-premium-mobile-20261001.webp?v=20261007-worker-final');el.setAttribute('width','600');el.setAttribute('height','496')}})\n"
          if '20261007-worker-final' not in s:
              if marker not in s: raise SystemExit('Worker Hero insertion marker not found')
              s=s.replace(marker,add,1)
          p.write_text(s)
          PY
          node --check worker.js
          git diff --check
          grep -q '20261007-worker-final' worker.js

      - name: Commit Worker Hero guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Force valid current mobile Hero in Worker"
            git push origin HEAD:main
          fi

      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy exact guarded Worker
        run: npx --yes wrangler@latest deploy

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Verify final Hero and Romanian menu live
        shell: bash
        run: |
          cat > .verify-final-live.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const results=[];
          for(const [name,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]]){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('https://astrovip.ro/?hero_worker_final='+Date.now()+'-'+name,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(3500);
            const reject=page.getByRole('button',{name:/Respinge opționale/i});
            if(await reject.count() && await reject.isVisible().catch(()=>false)) await reject.click({force:true}).catch(()=>{});
            await page.waitForTimeout(350);
            const hero=await page.evaluate(()=>{
              const section=document.querySelector('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore');
              const img=section?.querySelector('.av-hero-v2-visual picture img');
              if(!section||!img)return null;
              const sr=section.getBoundingClientRect(),ir=img.getBoundingClientRect(),st=getComputedStyle(img);
              return {src:img.currentSrc||img.src,natural:[img.naturalWidth,img.naturalHeight],section:[Math.round(sr.x),Math.round(sr.y),Math.round(sr.width),Math.round(sr.height)],rect:[Math.round(ir.x),Math.round(ir.y),Math.round(ir.width),Math.round(ir.height)],display:st.display,visibility:st.visibility,opacity:st.opacity};
            });
            let menu=null;
            if(name==='mobile'){
              const hamb=page.locator('#hamb');
              menu={visible:await hamb.isVisible(),before:await hamb.getAttribute('aria-expanded')};
              await hamb.click({force:true}); await page.waitForTimeout(300);
              Object.assign(menu,await page.evaluate(()=>{
                const h=document.querySelector('#hamb'),m=document.querySelector('#menu'),r=m?.getBoundingClientRect();
                const lines=[...h.querySelectorAll('.hamb-line')].map(el=>({transform:getComputedStyle(el).transform,opacity:getComputedStyle(el).opacity}));
                return {after:h?.getAttribute('aria-expanded'),display:m?getComputedStyle(m).display:null,visibility:m?getComputedStyle(m).visibility:null,rect:r?[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height),Math.round(r.right)]:null,programare:[...m.querySelectorAll('a')].find(a=>(a.textContent||'').trim()==='Programare')?.getAttribute('href')||null,label:h?.getAttribute('aria-label')||null,lines};
              }));
              await page.screenshot({path:'verified-mobile-menu.png',fullPage:false});
              await hamb.click({force:true}); await page.waitForTimeout(150); menu.closed=await hamb.getAttribute('aria-expanded');
            }
            await page.screenshot({path:`verified-${name}.png`,fullPage:false});
            const data={name,hero,menu,errors,scrollWidth:await page.evaluate(()=>document.documentElement.scrollWidth)};
            console.log('VERIFIED_FINAL '+JSON.stringify(data)); results.push(data); await context.close();
          }
          await browser.close();
          const fail=[];
          for(const r of results){const h=r.hero;if(!h||h.natural[0]<1||h.natural[1]<1||h.rect[2]<100||h.rect[3]<100||h.display==='none'||h.visibility==='hidden'||h.opacity==='0')fail.push(r.name+': Hero '+JSON.stringify(h));if(r.name==='mobile'&&r.scrollWidth>392)fail.push('mobile overflow '+r.scrollWidth)}
          const m=results.find(r=>r.name==='mobile');
          if(!m.hero?.src.includes('astrovip-hero-premium-mobile-20261001.webp'))fail.push('mobile Hero source '+m.hero?.src);
          if(!m.menu?.visible||m.menu.before!=='false'||m.menu.after!=='true'||m.menu.closed!=='false'||m.menu.display==='none'||m.menu.visibility==='hidden'||m.menu.programare!=='#programari')fail.push('Romanian menu '+JSON.stringify(m.menu));
          if((m.menu?.rect?.[0]??-10)<-2||(m.menu?.rect?.[4]??999)>392)fail.push('Romanian menu bounds '+JSON.stringify(m.menu?.rect));
          if(fail.length){console.error('VERIFIED_FINAL_FAILURE '+JSON.stringify(fail));process.exit(1)}
          console.log('VERIFIED_FINAL_OK');
          JS
          node .verify-final-live.mjs

      - name: Upload final screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-final-home
          path: |
            verified-mobile.png
            verified-mobile-menu.png
            verified-desktop.png
