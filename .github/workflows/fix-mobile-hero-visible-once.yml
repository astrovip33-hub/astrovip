name: Fix mobile Hero visibility once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mobile-hero-visible-once.yml

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd

jobs:
  repair-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace missing mobile Hero files with deployed premium image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          pattern=re.compile(r'''\s*<source media="\(max-width:820px\)" srcset="/assets/astrovip-hero-mobile-clean-cards-480\.avif[^>]*?/?>\s*<source media="\(max-width:820px\)" srcset="/assets/astrovip-hero-mobile-clean-cards-480\.webp[^>]*?/?>''')
          repl='\n      <source media="(max-width:820px)" srcset="/assets/astrovip-hero-premium-mobile-20261001.webp?v=20261007-final-mobile" type="image/webp" width="600" height="496"/>'
          s,n=pattern.subn(repl,s,count=1)
          if n!=1:
              raise SystemExit(f'expected one current mobile Hero source pair, replaced {n}')
          old='<img src="/assets/astrovip-hero-mobile-clean-cards-941.webp" width="941" height="1220"'
          new='<img src="/assets/astrovip-hero-premium-mobile-20261001.webp?v=20261007-final-mobile" width="600" height="496"'
          if old not in s:
              raise SystemExit('mobile Hero fallback image marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          grep -q 'astrovip-hero-premium-mobile-20261001.webp?v=20261007-final-mobile' index.html

      - name: Commit Hero source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix current mobile Hero image source"
          git push origin HEAD:main

      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy exact current source
        run: npx --yes wrangler@latest deploy

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Verify Hero and Romanian mobile menu live
        shell: bash
        run: |
          cat > .verify-final-home.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const results=[];
          for(const [name,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]]){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('https://astrovip.ro/?final_home='+Date.now()+'-'+name,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(3500);
            const reject=page.getByRole('button',{name:/Respinge opționale/i});
            if(await reject.count() && await reject.isVisible().catch(()=>false)) await reject.click({force:true}).catch(()=>{});
            await page.waitForTimeout(400);
            const hero=await page.evaluate(()=>{
              const section=document.querySelector('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore');
              const img=section?.querySelector('.av-hero-v2-visual picture img');
              if(!section||!img)return null;
              const sr=section.getBoundingClientRect(),ir=img.getBoundingClientRect(),st=getComputedStyle(img);
              return {src:img.currentSrc||img.src,natural:[img.naturalWidth,img.naturalHeight],section:[Math.round(sr.x),Math.round(sr.y),Math.round(sr.width),Math.round(sr.height)],rect:[Math.round(ir.x),Math.round(ir.y),Math.round(ir.width),Math.round(ir.height)],display:st.display,visibility:st.visibility,opacity:st.opacity};
            });
            let menu=null;
            if(name==='mobile'){
              const hamb=page.locator('#hamb');
              menu={visible:await hamb.isVisible(),before:await hamb.getAttribute('aria-expanded')};
              await hamb.click({force:true});
              await page.waitForTimeout(300);
              Object.assign(menu,await page.evaluate(()=>{
                const h=document.querySelector('#hamb'),m=document.querySelector('#menu'),r=m?.getBoundingClientRect();
                return {after:h?.getAttribute('aria-expanded'),menuDisplay:m?getComputedStyle(m).display:null,menuVisibility:m?getComputedStyle(m).visibility:null,rect:r?[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height),Math.round(r.right)]:null,programare:[...m.querySelectorAll('a')].find(a=>(a.textContent||'').trim()==='Programare')?.getAttribute('href')||null,label:h?.getAttribute('aria-label')||null};
              }));
              await page.screenshot({path:'final-mobile-menu-open.png',fullPage:false});
              await hamb.click({force:true});
              await page.waitForTimeout(150);
              menu.closed=await hamb.getAttribute('aria-expanded');
            }
            await page.screenshot({path:`final-${name}.png`,fullPage:false});
            const data={name,viewport,hero,menu,errors,scrollWidth:await page.evaluate(()=>document.documentElement.scrollWidth)};
            console.log('FINAL_HOME_RESULT '+JSON.stringify(data));
            results.push(data);
            await context.close();
          }
          await browser.close();
          const fail=[];
          for(const r of results){
            const h=r.hero;
            if(!h||h.natural[0]<1||h.natural[1]<1||h.rect[2]<100||h.rect[3]<100||h.display==='none'||h.visibility==='hidden'||h.opacity==='0')fail.push(r.name+': Hero image not loaded '+JSON.stringify(h));
            if(r.name==='mobile'&&r.scrollWidth>392)fail.push('mobile overflow '+r.scrollWidth);
          }
          const m=results.find(r=>r.name==='mobile');
          if(!m.menu?.visible||m.menu.before!=='false'||m.menu.after!=='true'||m.menu.closed!=='false')fail.push('Romanian menu toggle broken '+JSON.stringify(m.menu));
          if(m.menu?.menuDisplay==='none'||m.menu?.menuVisibility==='hidden')fail.push('Romanian menu not visible after click');
          if((m.menu?.rect?.[0]??-10)<-2||(m.menu?.rect?.[4]??999)>392)fail.push('Romanian menu outside viewport '+JSON.stringify(m.menu?.rect));
          if(m.menu?.programare!=='#programari')fail.push('Programare link wrong '+m.menu?.programare);
          if(fail.length){console.error('FINAL_HOME_FAILURE '+JSON.stringify(fail));process.exit(1)}
          console.log('FINAL_HOME_OK current Hero mobile/desktop and Romanian menu are functional');
          JS
          node .verify-final-home.mjs

      - name: Upload final screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-current-home-verification
          path: |
            final-mobile.png
            final-mobile-menu-open.png
            final-desktop.png
