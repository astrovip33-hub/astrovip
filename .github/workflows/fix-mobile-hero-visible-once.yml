name: Finalize Romanian mobile menu X

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mobile-hero-visible-once.yml

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd

jobs:
  repair-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add deterministic red X for open Romanian menu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old="      const runtime=heroPreloads+homepageRibbonCleanup+`<script src=\"/assets/booking-bridge-20261007.js\" defer></script><script src=\"/assets/page-editor-runtime.js?v=20261007-1728-fresh\" defer></script>`;"
          style="      const homepageMenuFix=isHomepage?`<style id=\"astrovip-ro-menu-x-20261007\">@media(max-width:980px){html body:not(.guide-page) #hamb .hamb-lines{position:relative!important;display:block!important;width:30px!important;height:19px!important}html body:not(.guide-page) #hamb .hamb-line{position:absolute!important;left:0!important;width:30px!important;height:3px!important;border-radius:3px!important;background:currentColor!important;transition:transform .18s ease,opacity .14s ease,top .18s ease!important;transform-origin:center!important}html body:not(.guide-page) #hamb .hamb-line:nth-child(1){top:0!important}html body:not(.guide-page) #hamb .hamb-line:nth-child(2){top:8px!important}html body:not(.guide-page) #hamb .hamb-line:nth-child(3){top:16px!important}html body:not(.guide-page) #hamb[aria-expanded=\"true\"]{color:#ff241f!important}html body:not(.guide-page) #hamb[aria-expanded=\"true\"] .hamb-line:nth-child(1){top:8px!important;transform:rotate(45deg)!important}html body:not(.guide-page) #hamb[aria-expanded=\"true\"] .hamb-line:nth-child(2){opacity:0!important;transform:scaleX(.25)!important}html body:not(.guide-page) #hamb[aria-expanded=\"true\"] .hamb-line:nth-child(3){top:8px!important;transform:rotate(-45deg)!important}}</style>`:'';\n      const runtime=heroPreloads+homepageRibbonCleanup+homepageMenuFix+`<script src=\"/assets/booking-bridge-20261007.js\" defer></script><script src=\"/assets/page-editor-runtime.js?v=20261007-1728-fresh\" defer></script>`;"
          if 'astrovip-ro-menu-x-20261007' not in s:
              if old not in s: raise SystemExit('runtime marker not found')
              s=s.replace(old,style,1)
          p.write_text(s)
          PY
          node --check worker.js
          git diff --check
          grep -q 'astrovip-ro-menu-x-20261007' worker.js

      - name: Commit menu X
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AstroVip Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js
          git commit -m "Fix Romanian mobile menu red X"
          git push origin HEAD:main

      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy exact current Worker
        run: npx --yes wrangler@latest deploy

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Verify Hero and red X live
        shell: bash
        run: |
          cat > .verify-x.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          const page=await context.newPage();
          await page.goto('https://astrovip.ro/?menu_x_final='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForTimeout(3200);
          const reject=page.getByRole('button',{name:/Respinge opționale/i});
          if(await reject.count() && await reject.isVisible().catch(()=>false)) await reject.click({force:true}).catch(()=>{});
          const hero=await page.evaluate(()=>{const i=document.querySelector('section.hero.hero-split.av-hero-v2.av-hero-mobile-restore picture img');return i?{src:i.currentSrc||i.src,natural:[i.naturalWidth,i.naturalHeight]}:null});
          const h=page.locator('#hamb'); await h.click({force:true}); await page.waitForTimeout(350);
          const menu=await page.evaluate(()=>{const h=document.querySelector('#hamb');const lines=[...h.querySelectorAll('.hamb-line')].map(el=>{const s=getComputedStyle(el);return {transform:s.transform,opacity:s.opacity,color:s.backgroundColor}});return {expanded:h.getAttribute('aria-expanded'),label:h.getAttribute('aria-label'),lines}});
          await page.screenshot({path:'final-menu-x.png',fullPage:false});
          console.log('MENU_X_RESULT '+JSON.stringify({hero,menu}));
          await browser.close();
          const fail=[];
          if(!hero||hero.natural[0]<1||!hero.src.includes('astrovip-hero-premium-mobile-20261001.webp'))fail.push('Hero '+JSON.stringify(hero));
          if(menu.expanded!=='true'||menu.lines.length!==3||!menu.lines.some(x=>x.opacity==='0')||menu.lines.filter(x=>x.transform!=='none').length<2)fail.push('X '+JSON.stringify(menu));
          if(fail.length){console.error(fail);process.exit(1)}
          console.log('MENU_X_OK');
          JS
          node .verify-x.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-romanian-menu-x
          path: final-menu-x.png
