name: Trigger footer cache fix

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Force footer stylesheet refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '/assets/footer-premium-runtime-20260923.css?v=20261025-social-align2'
          new = '/assets/footer-premium-runtime-20260923.css?v=20261026-singlecert4'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Footer: refresh single certification stylesheet"
          git push origin HEAD:main
