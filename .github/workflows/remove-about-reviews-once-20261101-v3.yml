name: Hard kill cached About Me card 20261101 v7

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-about-reviews-once-20261101-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify homepage About Me card remains removed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('assets/home-case-studies-premium-20261014.js').read_text(encoding='utf-8')
          worker = Path('worker-ai-discovery.js').read_text(encoding='utf-8')

          forbidden = ('ABOUT_HTML', 'ensureAbout(', 'ensureAboutStyle(', 'astrovip-despre-mine-20261101')
          residue = [token for token in forbidden if token in source]
          if residue:
              raise SystemExit('Source About Me residue remains: ' + ', '.join(residue))

          required = ('HOME_ABOUT_HARD_KILL', 'av-about-hard-kill-20261101', "querySelectorAll('.av-about-home')")
          missing = [token for token in required if token not in worker]
          if missing:
              raise SystemExit('Worker hard-kill missing: ' + ', '.join(missing))

          stale_assets = list(Path('assets').glob('astrovip-despre-mine-20261101-*.webp'))
          if stale_assets:
              raise SystemExit('Stale About Me artwork remains: ' + ', '.join(map(str, stale_assets)))

          print('About Me source removed and Worker hard-kill present.')
          PY
