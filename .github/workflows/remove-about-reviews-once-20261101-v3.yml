name: Remove About Me card only 20261101 v4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-about-reviews-once-20261101-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove homepage About Me artwork card
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          p = Path('assets/home-case-studies-premium-20261014.js')
          s = p.read_text(encoding='utf-8')
          original = s

          # Remove the complete About Me HTML/style/helper block, while preserving
          # the case-study slider code that follows it.
          s, n = re.subn(
              r'\n\s*const ABOUT_HTML\s*=.*?\n\s*const install\s*=\s*\(\)\s*=>\s*\{',
              '\n\n  const install = () => {',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected About Me helper block once, removed {n}')

          # Remove every remaining reinjection call.
          s = re.sub(r'^\s*ensureAboutStyle\(\);\s*\n?', '', s, flags=re.M)
          s = re.sub(r'^\s*ensureAbout\(section\);\s*\n?', '', s, flags=re.M)

          if s != original:
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))

          # Delete only the artwork variants used by the removed card.
          for asset in Path('assets').glob('astrovip-despre-mine-20261101-*.webp'):
              asset.unlink()
              changed.append(f'{asset} (deleted)')

          # Hard verification: no code capable of rebuilding this card may remain
          # in the homepage case-study script.
          final = p.read_text(encoding='utf-8')
          forbidden = ('ABOUT_HTML', 'av-about-home', 'ensureAbout(', 'ensureAboutStyle(')
          residue = [token for token in forbidden if token in final]
          if residue:
              raise SystemExit('About Me card residue remains: ' + ', '.join(residue))

          print('Changed files:')
          for item in changed:
              print(' -', item)
          PY

      - name: Commit hard removal
        shell: bash
        run: |
          git config user.name "AstroVip Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove homepage About Me card at source" || exit 0
          git push origin HEAD:main
