name: Repair midpoint slider visibility

on:
  push:
    paths:
      - '.github/workflows/cache-bust-midpoint-slider.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force fresh midpoint asset and keep slider before footer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          home = Path('index.html')
          s = home.read_text(encoding='utf-8')
          s, n = re.subn(
              r'/assets/footer-orbit-20261026\.js\?v=[^"\']+',
              '/assets/footer-orbit-20261026.js?v=20261102-midpoints3',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not update footer-orbit asset version in index.html')
          home.write_text(s, encoding='utf-8')

          js = Path('assets/footer-orbit-20261026.js')
          j = js.read_text(encoding='utf-8')
          old = 'footer.insertBefore(midpoint, social);'
          new = 'footer.parentNode.insertBefore(midpoint, footer);'
          if old in j:
              j = j.replace(old, new, 1)
          elif new not in j:
              raise SystemExit('Midpoint insertion marker not found')
          js.write_text(j, encoding='utf-8')
          PY

      - name: Commit visibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'astrovip33-hub'
          git config user.email 'astrovip33@gmail.com'
          git add index.html assets/footer-orbit-20261026.js
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'Refresh midpoint slider asset cache'
          git push
