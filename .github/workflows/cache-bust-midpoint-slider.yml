name: Cache bust midpoint slider asset

on:
  push:
    paths:
      - '.github/workflows/cache-bust-midpoint-slider.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump footer orbit asset version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '/assets/footer-orbit-20261026.js?v=20261101-no-certificate1'
          new = '/assets/footer-orbit-20261026.js?v=20261102-midpoints1'
          if old not in s:
              raise SystemExit('Expected footer-orbit version string not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit cache bust
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'astrovip33-hub'
          git config user.email 'astrovip33@gmail.com'
          git add index.html
          git commit -m 'Force-load midpoint slider on homepage'
          git push
