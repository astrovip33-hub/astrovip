name: Footer compact live check

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/footer-compact-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for footer v13.2 asset live
        run: |
          set -euo pipefail
          OK=0
          for ATTEMPT in $(seq 1 24); do
            CSS=$(curl -fsSL --retry 2 --retry-delay 2 "https://astrovip.ro/assets/footer-lux-compact-v13-20261014.css?live=${GITHUB_SHA}&attempt=${ATTEMPT}" || true)
            if grep -Fq 'compact luxury from EXPLOREAZĂ to legal end' <<< "$CSS"; then
              echo "Footer v13.2 asset live on attempt ${ATTEMPT}."
              OK=1
              break
            fi
            sleep 5
          done
          test "$OK" = "1"
      - name: Install browser driver
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          npm install --no-save --ignore-scripts puppeteer-core@24.26.1
      - name: Verify footer v13.2 live on mobile
        run: |
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p=>fs.existsSync(p));
            const browser=await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
            await page.setUserAgent('Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 Chrome/141.0 Mobile Safari/537.36 AstroVipFooterHealth/13.2');
            await page.goto(`https://astrovip.ro/?footer-live=${Date.now()}`,{waitUntil:'networkidle2',timeout:90000});
            await page.evaluate(()=>{const c=document.querySelector('#av-consent');if(c)c.setAttribute('hidden','');});
            await page.waitForSelector('footer.foot.av-footer-premium .av-footer-card--services',{visible:true,timeout:30000});
            await new Promise(r=>setTimeout(r,1800));
            const state=await page.evaluate(()=>{
              const q=s=>document.querySelector(s);
              const services=q('footer.foot.av-footer-premium .av-footer-card--services');
              const contact=q('footer.foot.av-footer-premium .av-footer-card--contact');
              const bottom=q('footer.foot.av-footer-premium .av-footer-bottom');
              const footer=q('footer.foot.av-footer-premium');
              const firstService=services?.querySelector(':scope > a');
              const firstContact=contact?.querySelector('a:not(.av-footer-whatsapp),.av-footer-static');
              const quote=bottom?getComputedStyle(bottom,'::before'):null;
              const sr=services?.getBoundingClientRect(),cr=contact?.getBoundingClientRect(),br=bottom?.getBoundingClientRect(),fr=footer?.getBoundingClientRect();
              const sc=services?getComputedStyle(services):null,cc=contact?getComputedStyle(contact):null;
              return {
                servicesDisplay:sc?.display||'missing',
                servicesGrid:sc?.gridTemplateColumns||'',
                contactGrid:cc?.gridTemplateColumns||'',
                servicesWidth:sr?Math.round(sr.width):0,
                servicesHeight:sr?Math.round(sr.height):0,
                contactHeight:cr?Math.round(cr.height):0,
                bottomHeight:br?Math.round(br.height):0,
                compactSpan:(sr&&fr)?Math.round(fr.bottom-sr.top):0,
                serviceFont:firstService?getComputedStyle(firstService).fontSize:'missing',
                contactFont:firstContact?getComputedStyle(firstContact).fontSize:'missing',
                quoteContent:quote?.content||'',
                serviceLinks:services?services.querySelectorAll(':scope > a').length:0,
                whatsapp:Boolean(contact?.querySelector('.av-footer-whatsapp')),
                bodyOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              };
            });
            console.log('FOOTER V13.2 LIVE',JSON.stringify(state));
            const errors=[];
            if(state.servicesDisplay==='none'||state.servicesDisplay==='missing')errors.push('Explore hidden');
            if(!state.servicesGrid.includes('172') && !state.servicesGrid.includes('170') && state.servicesGrid.split(' ').length<2)errors.push(`servicesGrid=${state.servicesGrid}`);
            if(state.contactGrid.split(' ').length<2)errors.push(`contactGrid=${state.contactGrid}`);
            if(state.serviceLinks<5)errors.push(`serviceLinks=${state.serviceLinks}`);
            if(!state.whatsapp)errors.push('WhatsApp missing');
            if(state.servicesWidth<330||state.servicesWidth>390)errors.push(`servicesWidth=${state.servicesWidth}`);
            if(state.servicesHeight>220)errors.push(`servicesHeight=${state.servicesHeight}`);
            if(state.contactHeight>235)errors.push(`contactHeight=${state.contactHeight}`);
            if(state.bottomHeight>135)errors.push(`bottomHeight=${state.bottomHeight}`);
            if(state.compactSpan>720)errors.push(`compactSpan=${state.compactSpan}`);
            if(parseFloat(state.serviceFont)>11)errors.push(`serviceFont=${state.serviceFont}`);
            if(parseFloat(state.contactFont)>10)errors.push(`contactFont=${state.contactFont}`);
            if(!state.quoteContent.includes('Viitorul favorizează'))errors.push(`quote=${state.quoteContent}`);
            if(state.bodyOverflow>2)errors.push(`horizontalOverflow=${state.bodyOverflow}`);
            const services=await page.$('footer.foot.av-footer-premium .av-footer-card--services');
            const footer=await page.$('footer.foot.av-footer-premium');
            const sb=await services.boundingBox(),fb=await footer.boundingBox();
            if(sb&&fb){
              await page.screenshot({path:'/tmp/footer-compact-v132-mobile-live.png',clip:{x:0,y:Math.max(0,sb.y-10),width:390,height:Math.min(1200,fb.y+fb.height-(sb.y-10))}});
            }
            await browser.close();
            if(errors.length){console.error('FOOTER V13.2 FAILED:',errors.join(' | '));process.exit(1);}
            console.log('FOOTER V13.2 LIVE OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload live screenshot
        uses: actions/upload-artifact@v4
        with:
          name: footer-compact-v132-live-mobile
          path: /tmp/footer-compact-v132-mobile-live.png
          retention-days: 7
