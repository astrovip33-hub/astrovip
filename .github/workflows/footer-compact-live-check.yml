name: Footer compact live check

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/footer-compact-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for footer v13 asset live
        run: |
          set -euo pipefail
          OK=0
          for ATTEMPT in $(seq 1 24); do
            CSS=$(curl -fsSL --retry 2 --retry-delay 2 "https://astrovip.ro/assets/footer-compact-lux-v13-20261014.css?live=${GITHUB_SHA}&attempt=${ATTEMPT}" || true)
            if grep -Fq 'Footer Compact Luxury v13' <<< "$CSS"; then
              echo "Footer v13 asset live on attempt ${ATTEMPT}."
              OK=1
              break
            fi
            sleep 5
          done
          test "$OK" = "1"
      - name: Install browser driver
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          npm install --no-save --ignore-scripts puppeteer-core@24.26.1
      - name: Verify footer live on mobile
        run: |
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p=>fs.existsSync(p));
            const browser=await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
            await page.setUserAgent('Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 Chrome/141.0 Mobile Safari/537.36 AstroVipFooterHealth/1.0');
            await page.goto(`https://astrovip.ro/?footer-live=${Date.now()}`,{waitUntil:'networkidle2',timeout:90000});
            await page.evaluate(()=>{const c=document.querySelector('#av-consent');if(c)c.setAttribute('hidden','');});
            await page.waitForSelector('footer.foot.av-footer-premium .av-footer-card--services',{visible:true,timeout:30000});
            await new Promise(r=>setTimeout(r,1600));
            const state=await page.evaluate(()=>{
              const services=document.querySelector('footer.foot.av-footer-premium .av-footer-card--services');
              const contact=document.querySelector('footer.foot.av-footer-premium .av-footer-card--contact');
              const bottom=document.querySelector('footer.foot.av-footer-premium .av-footer-bottom');
              const footer=document.querySelector('footer.foot.av-footer-premium');
              const sr=services?.getBoundingClientRect(),cr=contact?.getBoundingClientRect(),br=bottom?.getBoundingClientRect(),fr=footer?.getBoundingClientRect();
              const css=services?getComputedStyle(services):null;
              return {
                servicesDisplay:css?.display||'missing',
                servicesGrid:css?.gridTemplateColumns||'',
                servicesWidth:sr?Math.round(sr.width):0,
                servicesHeight:sr?Math.round(sr.height):0,
                contactHeight:cr?Math.round(cr.height):0,
                bottomHeight:br?Math.round(br.height):0,
                compactSpan:(sr&&fr)?Math.round(fr.bottom-sr.top):0,
                serviceLinks:services?services.querySelectorAll(':scope > a').length:0,
                whatsapp:Boolean(contact?.querySelector('.av-footer-whatsapp')),
                bodyOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                text:(services?.innerText||'').replace(/\s+/g,' ').trim()
              };
            });
            console.log('FOOTER LIVE',JSON.stringify(state));
            const errors=[];
            if(state.servicesDisplay==='none'||state.servicesDisplay==='missing')errors.push('Explore services hidden');
            if(state.serviceLinks<5)errors.push(`serviceLinks=${state.serviceLinks}`);
            if(!state.whatsapp)errors.push('WhatsApp CTA missing');
            if(state.servicesWidth<330||state.servicesWidth>390)errors.push(`servicesWidth=${state.servicesWidth}`);
            if(state.servicesHeight>260)errors.push(`servicesHeight=${state.servicesHeight}`);
            if(state.contactHeight>290)errors.push(`contactHeight=${state.contactHeight}`);
            if(state.bottomHeight>145)errors.push(`bottomHeight=${state.bottomHeight}`);
            if(state.bodyOverflow>2)errors.push(`horizontalOverflow=${state.bodyOverflow}`);
            const footer=await page.$('footer.foot.av-footer-premium');
            const box=await footer.boundingBox();
            const services=await page.$('footer.foot.av-footer-premium .av-footer-card--services');
            const sb=await services.boundingBox();
            if(box&&sb){
              await page.screenshot({path:'/tmp/footer-compact-mobile-live.png',clip:{x:Math.max(0,box.x),y:Math.max(0,sb.y-12),width:Math.min(390,box.width),height:Math.min(1400,box.y+box.height-(sb.y-12))}});
            }
            await browser.close();
            if(errors.length){console.error('FOOTER LIVE FAILED:',errors.join(' | '));process.exit(1);}
            console.log('FOOTER LIVE OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload live screenshot
        uses: actions/upload-artifact@v4
        with:
          name: footer-compact-live-mobile
          path: /tmp/footer-compact-mobile-live.png
          retention-days: 7
