name: Cloudflare Preview

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1997683abefc1f33c4a391c0e09e63dd
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build Swiss bundle
        run: npm run build:swiss

      - name: Deploy isolated Cloudflare preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.preview.jsonc
          echo "Preview URL: https://astrovip-preview-ux-compact.${CLOUDFLARE_ACCOUNT_ID}.workers.dev"
