name: Patch AstroVip Hero Video Prod

on:
  push:
    branches:
      - hero-video-prod-20261030
    paths:
      - assets/astrovip-hero-prod-meta.txt

permissions:
  contents: write

jobs:
  patch-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: hero-video-prod-20261030
          fetch-depth: 0

      - name: Patch Hero markup, preload, CSS and lazy-load runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='astrovip-hero-video-prod-20261030'
          if marker in s:
              print('Hero video patch already present; no-op')
              raise SystemExit(0)

          preload_re=re.compile(r'<!-- ASTROVIP_HERO_PRELOAD -->.*?<!-- /ASTROVIP_HERO_PRELOAD -->', re.S)
          preload='''<!-- ASTROVIP_HERO_PRELOAD -->
<link rel="preload" as="image" href="/assets/astrovip-hero-poster-prod.webp?v=20261030-hero-video1" type="image/webp" fetchpriority="high">
<!-- /ASTROVIP_HERO_PRELOAD -->'''
          s,n=preload_re.subn(preload,s,count=1)
          if n != 1:
              raise SystemExit(f'Hero preload replacement count={n}, expected 1')

          figure_re=re.compile(r'<figure class="av-pro-visual"><picture>.*?</picture><figcaption>Analiză personală · Confidențialitate · Online sau în București</figcaption></figure>', re.S)
          figure='''<figure class="av-pro-visual av-pro-video-visual" id="astrovip-hero-video-prod-20261030">
  <div class="av-pro-video-shell">
    <video id="astrovip-hero-video-prod" class="av-pro-hero-video-20261030" poster="/assets/astrovip-hero-poster-prod.webp?v=20261030-hero-video1" muted loop playsinline preload="none" aria-label="Cătălin Smaranda prezintă consultația AstroVip">
      <source data-src="/assets/astrovip-hero-prod.mp4?v=20261030-hero-video1" type="video/mp4">
    </video>
    <button class="av-pro-video-sound" id="astrovip-hero-sound" type="button" aria-label="Activează sunetul videoclipului">🔇 Activează sunetul</button>
  </div>
  <figcaption>Analiză personală · Confidențialitate · Online sau în București</figcaption>
</figure>'''
          s,n=figure_re.subn(figure,s,count=1)
          if n != 1:
              raise SystemExit(f'Hero figure replacement count={n}, expected 1')

          css='''
<style id="astrovip-hero-video-prod-css-20261030">
/* Production Hero video: poster-first, fixed ratio, zero layout shift. */
body:not(.guide-page) .av-pro-visual.av-pro-video-visual{
  display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;
  min-width:0!important;margin:0!important;padding:18px 0!important;overflow:visible!important;background:transparent!important;
}
body:not(.guide-page) .av-pro-video-shell{
  position:relative!important;width:clamp(360px,30vw,420px)!important;max-width:100%!important;aspect-ratio:480/854!important;
  overflow:hidden!important;border:1px solid rgba(232,198,101,.58)!important;border-radius:26px!important;background:#050505!important;
  box-shadow:0 26px 74px rgba(0,0,0,.62),0 0 34px rgba(216,245,0,.10),inset 0 1px 0 rgba(255,255,255,.10)!important;
}
body:not(.guide-page) .av-pro-hero-video-20261030{
  display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;
  margin:0!important;padding:0!important;object-fit:cover!important;object-position:center center!important;background:#050505!important;
}
body:not(.guide-page) .av-pro-video-sound{
  position:absolute!important;z-index:4!important;left:50%!important;bottom:14px!important;transform:translateX(-50%)!important;
  display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:42px!important;padding:9px 14px!important;
  white-space:nowrap!important;border:1px solid rgba(240,211,125,.70)!important;border-radius:999px!important;
  background:rgba(3,5,4,.80)!important;color:#fff4bf!important;font:850 12px/1.1 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif!important;
  box-shadow:0 9px 28px rgba(0,0,0,.46)!important;backdrop-filter:blur(8px)!important;cursor:pointer!important;
}
body:not(.guide-page) .av-pro-video-sound:hover,body:not(.guide-page) .av-pro-video-sound:focus-visible{
  border-color:#d8f500!important;outline:2px solid rgba(216,245,0,.55)!important;outline-offset:2px!important;
}
body:not(.guide-page) .av-pro-video-visual figcaption{
  width:min(100%,420px)!important;margin:11px auto 0!important;padding:0 8px!important;text-align:center!important;
  color:#cfd9d2!important;font-size:12px!important;line-height:1.35!important;
}
@media(max-width:980px) and (min-width:821px){
  body:not(.guide-page) .av-pro-video-shell{width:clamp(340px,36vw,390px)!important}
}
@media(max-width:820px){
  body:not(.guide-page) .av-pro-visual.av-pro-video-visual{order:-1!important;width:100%!important;margin:0 auto 18px!important;padding:12px 0 0!important}
  body:not(.guide-page) .av-pro-video-shell{width:min(350px,calc(100vw - 28px))!important;border-radius:22px!important}
  body:not(.guide-page) .av-pro-video-visual figcaption{width:min(350px,calc(100vw - 28px))!important;margin-top:9px!important;font-size:11.5px!important}
  body:not(.guide-page) .av-pro-video-sound{bottom:12px!important;min-height:40px!important;padding:8px 12px!important;font-size:11.5px!important}
}
@media(max-width:360px){
  body:not(.guide-page) .av-pro-video-shell{width:min(334px,calc(100vw - 20px))!important;border-radius:20px!important}
  body:not(.guide-page) .av-pro-video-visual figcaption{width:min(334px,calc(100vw - 20px))!important}
}
@media(prefers-reduced-motion:reduce){body:not(.guide-page) .av-pro-video-sound{display:none!important}}
</style>
'''
          if '</head>' not in s:
              raise SystemExit('Missing </head>')
          s=s.replace('</head>',css+'</head>',1)

          js='''
<script id="astrovip-hero-video-prod-runtime-20261030">
(function(){
  'use strict';
  var video=document.getElementById('astrovip-hero-video-prod');
  var button=document.getElementById('astrovip-hero-sound');
  if(!video||!button)return;
  var source=video.querySelector('source[data-src]');
  var loaded=false;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function constrained(){
    var c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
    return !!(c&&(c.saveData||/^(slow-2g|2g)$/.test(c.effectiveType||'')));
  }
  function loadVideo(force){
    if(loaded)return true;
    if(!source)return false;
    if(!force&&(reduce||constrained()))return false;
    source.src=source.getAttribute('data-src');
    source.removeAttribute('data-src');
    video.load();loaded=true;
    return true;
  }
  function autoplay(){
    if(!loadVideo(false))return;
    video.muted=true;video.defaultMuted=true;
    var p=video.play();if(p&&p.catch)p.catch(function(){});
  }
  function schedule(){
    if('requestIdleCallback' in window){requestIdleCallback(autoplay,{timeout:1800});}
    else{setTimeout(autoplay,420);}
  }
  if(document.readyState==='complete')schedule();
  else window.addEventListener('load',schedule,{once:true});
  button.addEventListener('click',function(){
    loadVideo(true);
    if(video.muted){
      video.muted=false;video.volume=1;
      var p=video.play();if(p&&p.catch)p.catch(function(){});
      button.textContent='🔊 Oprește sunetul';
      button.setAttribute('aria-label','Oprește sunetul videoclipului');
    }else{
      video.muted=true;
      button.textContent='🔇 Activează sunetul';
      button.setAttribute('aria-label','Activează sunetul videoclipului');
    }
  });
  video.addEventListener('error',function(){button.hidden=true;});
})();
</script>
'''
          if '</body>' not in s:
              raise SystemExit('Missing </body>')
          s=s.replace('</body>',js+'</body>',1)

          checks={
            'video id':s.count('id="astrovip-hero-video-prod"'),
            'prod mp4':s.count('/assets/astrovip-hero-prod.mp4'),
            'prod poster':s.count('/assets/astrovip-hero-poster-prod.webp'),
            'old mobile preload':s.count('rel="preload" as="image" href="/assets/astrovip-hero-premium-mobile-20261001.webp'),
            'old desktop preload':s.count('rel="preload" as="image" href="/assets/astrovip-hero-desktop-final-20261002.avif'),
          }
          if checks['video id']!=1 or checks['prod mp4']!=1 or checks['prod poster']<2 or checks['old mobile preload'] or checks['old desktop preload']:
              raise SystemExit(f'Validation failed: {checks}')
          p.write_text(s,encoding='utf-8')
          print('Hero patch validation OK:',checks)
          PY

      - name: Validate references and commit
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/astrovip-hero-prod.mp4
          test -s assets/astrovip-hero-poster-prod.webp
          grep -q 'id="astrovip-hero-video-prod"' index.html
          grep -q '/assets/astrovip-hero-prod.mp4?v=20261030-hero-video1' index.html
          grep -q '/assets/astrovip-hero-poster-prod.webp?v=20261030-hero-video1' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Stage optimized Hero video for mobile and desktop"
          git push origin HEAD:hero-video-prod-20261030
