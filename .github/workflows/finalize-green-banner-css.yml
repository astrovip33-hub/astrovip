name: Finalize green white banner CSS

on:
  push:
    paths:
      - '.github/workflows/finalize-green-banner-css.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align second banner CSS
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          css_path = Path('assets/homepage-bundle-base.css')
          css = css_path.read_text(encoding='utf-8')
          old = """body #planet-strip-secondary .planet-item > strong,
          body #planet-strip-secondary .planet-item > span{
            background:linear-gradient(180deg,#fffbd1 0%,#fff200 18%,#ffd000 34%,#ff9900 50%,#ff3b00 72%,#c90000 100%);
            -webkit-background-clip:text;
            background-clip:text;
            -webkit-text-fill-color:transparent;
            color:transparent!important;
            font-weight:950;
            text-shadow:none;
            filter:drop-shadow(0 1px 0 rgba(255,255,200,.78)) drop-shadow(0 0 4px rgba(255,205,0,.60)) drop-shadow(0 0 8px rgba(255,48,0,.32));
          }
          body #planet-strip-secondary .planet-item > strong{letter-spacing:.025em;}""".replace('          ','')
          new = """body #planet-strip-secondary .planet-item > strong,
          body #planet-strip-secondary .planet-item > span{
            background:linear-gradient(180deg,#ffffff 0%,#f7fff9 14%,#d9ffe5 30%,#83ffad 48%,#2ee57a 68%,#079c50 100%);
            -webkit-background-clip:text;
            background-clip:text;
            -webkit-text-fill-color:transparent;
            color:transparent!important;
            font-weight:950;
            text-shadow:none;
            filter:drop-shadow(0 1px 0 rgba(255,255,255,.95)) drop-shadow(0 0 5px rgba(210,255,225,.75)) drop-shadow(0 0 10px rgba(46,229,122,.45));
          }
          body #planet-strip-secondary .planet-item > strong{letter-spacing:.025em;}""".replace('          ','')
          if old not in css:
              raise SystemExit('Legacy second-banner gradient not found')
          css_path.write_text(css.replace(old,new,1), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          start = html.find('/assets/homepage-bundle-base.css?v=')
          if start < 0:
              raise SystemExit('Homepage CSS link not found')
          end = html.find('"', start)
          html = html[:start] + '/assets/homepage-bundle-base.css?v=20260917-audit-green-1' + html[end:]
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit result
        shell: bash
        run: |
          rm -f .github/workflows/finalize-green-banner-css.yml
          git config user.name "astrovip33-hub"
          git config user.email "astrovip33@gmail.com"
          git add -A
          git commit -m "Align second banner CSS with green white design"
          git push origin HEAD:main
