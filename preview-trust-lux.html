main{min-height:100vh;padding:28px 0 48px;background:radial-gradient(circle at 18% -6%,rgba(50,136,255,.19),transparent 34%),radial-gradient(circle at 82% 4%,rgba(66,255,154,.18),transparent 34%),radial-gradient(circle at 50% 48%,rgba(242,204,103,.06),transparent 44%),linear-gradient(180deg,#06100d 0%,#020403 68%,#010202 100%)}

.profession{position:relative;isolation:isolate;padding:24px 24px 22px;margin-bottom:12px;border:1px solid rgba(242,204,103,.66);border-radius:20px;background:radial-gradient(circle at 12% 0%,rgba(77,199,255,.22),transparent 38%),radial-gradient(circle at 90% 100%,rgba(66,255,154,.13),transparent 34%),linear-gradient(135deg,rgba(8,25,52,.98),rgba(3,14,17,.99) 70%,rgba(7,43,30,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 46px rgba(0,0,0,.38),0 0 32px rgba(242,204,103,.10)}

.logo:before,.commerce:before{content:"";position:absolute;pointer-events:none}

.anpc:before{border-color:rgba(77,199,255,.22)}

.commerce{grid-area:commerce;min-height:126px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border:1px solid rgba(66,255,154,.62);background:radial-gradient(circle at 50% 0%,rgba(66,255,154,.20),transparent 46%),radial-gradient(circle at 100% 100%,rgba(77,199,255,.13),transparent 36%),linear-gradient(155deg,#071b12 0%,#04110d 45%,#071a31 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 16px 38px rgba(0,0,0,.36),0 0 30px rgba(66,255,154,.11)}
.commerce:before{inset:6px;border:1px solid rgba(66,255,154,.18);border-radius:12px}
.commerce .eyebrow{position:relative;z-index:2;color:#bfe9ff;font-size:9px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}
.commerce strong{position:relative;z-index:2;color:#4dffa0;font-size:29px;line-height:1.04;letter-spacing:-.025em;text-shadow:0 0 24px rgba(66,255,154,.26)}
.points{position:relative;z-index:2;display:flex;justify-content:center;flex-wrap:wrap;gap:7px}
.points span{display:inline-flex;align-items:center;min-height:30px;padding:5px 10px;border:1px solid rgba(242,204,103,.28);border-radius:999px;background:rgba(255,255,255,.045);font-size:11px;font-weight:900;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

@media(min-width:821px){.grid{grid-template-columns:minmax(0,1fr) minmax(260px,.88fr) minmax(0,1fr);grid-template-areas:"anpc commerce aar";gap:14px}.logo,.commerce{height:182px;min-height:182px}.logo .logo-plaque{height:112px}.logo .logo-plaque img{max-height:80px}.aar .logo-plaque img{max-height:66px}.aar .respectam{font-size:11px;margin-bottom:7px}.logo small{font-size:9px}.profession{padding:28px 30px 26px;margin-bottom:18px}.kicker{font-size:12px}.profession strong{font-size:clamp(28px,3.5vw,45px)}}
