<!doctype html>

<style>
:root{--gold:#d9b85c;--gold2:#fff1aa;--green:#38f58a;--pearl:#f8fbff}
*{box-sizing:border-box}
body{margin:0;background:#020303;color:var(--pearl);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{min-height:100vh;padding:28px 0 48px;background:radial-gradient(circle at 50% -10%,rgba(25,116,77,.23),transparent 38%),radial-gradient(circle at 86% 20%,rgba(217,184,92,.08),transparent 28%),linear-gradient(180deg,#050806,#020303)}

.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"commerce commerce" "anpc aar";gap:10px}
.logo,.commerce{position:relative;min-width:0;overflow:hidden;border-radius:18px}

.logo:before,.commerce:before{content:"";position:absolute;pointer-events:none}

.logo.aar .logo-plaque{width:96%;min-height:76px;padding:8px 7px;border-color:rgba(241,210,121,.92);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(160,124,36,.12),0 9px 23px rgba(0,0,0,.30),0 0 22px rgba(217,184,92,.12)}
.logo.aar .logo-plaque img{max-width:100%;max-height:58px}
.anpc{grid-area:anpc}.aar{grid-area:aar}
.commerce{grid-area:commerce;min-height:124px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border:1px solid rgba(56,245,138,.46);background:radial-gradient(circle at 50% 0%,rgba(56,245,138,.16),transparent 46%),linear-gradient(155deg,#07170f 0%,#04100d 45%,#071932 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 16px 38px rgba(0,0,0,.34),0 0 26px rgba(56,245,138,.08)}
.commerce:before{inset:6px;border:1px solid rgba(56,245,138,.12);border-radius:12px}
.commerce .eyebrow{position:relative;z-index:2;color:#dbe8ff;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.commerce strong{position:relative;z-index:2;color:#45f58d;font-size:28px;line-height:1.04;letter-spacing:-.025em;text-shadow:0 0 22px rgba(56,245,138,.18)}
.points{position:relative;z-index:2;display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.points span{display:inline-flex;align-items:center;min-height:29px;padding:5px 9px;border:1px solid rgba(217,184,92,.20);border-radius:999px;background:rgba(255,255,255,.035);font-size:11px;font-weight:850;white-space:nowrap}
.points span:before{content:"✓";margin-right:5px;color:#45f58d;font-weight:950}
@media(min-width:821px){.grid{grid-template-columns:minmax(0,1fr) minmax(260px,.88fr) minmax(0,1fr);grid-template-areas:"anpc commerce aar";gap:14px}.logo,.commerce{min-height:176px}.logo .logo-plaque{min-height:92px}.logo .logo-plaque img{max-height:72px}.logo.aar .logo-plaque{min-height:96px}.logo.aar .logo-plaque img{max-height:72px}.logo.aar .respectam{font-size:11px}.profession{padding:28px 30px 26px;margin-bottom:18px}.kicker{font-size:12px}.profession strong{font-size:clamp(28px,3.5vw,45px)}}
