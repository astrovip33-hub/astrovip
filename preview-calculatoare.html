<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview calculatoare AstroVip</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#041126;color:#f8fbff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.bar{position:sticky;top:0;z-index:20;background:#041126;border-bottom:1px solid rgba(56,245,138,.28);padding:10px}.inner{width:min(1180px,96%);margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:950;color:#38f58a;margin-right:auto}.tab{border:1px solid rgba(57,191,255,.28);background:rgba(57,191,255,.06);color:#eefaff;border-radius:999px;padding:9px 14px;font-weight:850;cursor:pointer}.tab.active{background:linear-gradient(180deg,#ddffeb,#38f58a 45%,#079c50);color:#032715;border-color:#38f58a}.note{font-size:11px;color:#c7d8ef;width:100%}.frame{width:100%;height:calc(100vh - 108px);border:0;background:#071a38}.loading{display:grid;place-items:center;height:70vh;color:#8ee9ff;font-weight:800}</style></head><body><div class="bar"><div class="inner"><div class="brand">ASTROVIP · PREVIEW</div><button class="tab active" data-page="relocare-geografica/index.html">Relocare</button><button class="tab" data-page="sinastrie-calculator/index.html">Sinastrie</button><button class="tab" data-page="astrocartografie/index.html">Astrocartografie</button><div class="note">Preview izolat: nu publică și nu modifică astrovip.ro. Poți testa formularele și butoanele „Vezi exemplu”.</div></div></div><iframe id="frame" class="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe><script>const RAW='https://raw.githubusercontent.com/astrovip33-hub/astrovip/refs/heads/preview/relocare-sinastrie-astrocartografie-20260916/';const CSS='https://raw.githack.com/astrovip33-hub/astrovip/a5d9f42c9e449d8b7940993a326599a02cb90e50/assets/calculators.css';const frame=document.getElementById('frame');async function load(path){frame.srcdoc='<div class="loading">Se încarcă preview-ul…</div>';try{let html=await fetch(RAW+path,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()});html=html.replace('href="/assets/calculators.css"','href="'+CSS+'"');html=html.replace(/href="\/(?!\/)/g,'href="https://astrovip.ro/');frame.srcdoc=html}catch(e){frame.srcdoc='<div style="font-family:system-ui;background:#041126;color:white;padding:40px"><h2>Preview indisponibil</h2><p>'+String(e.message||e)+'</p></div>'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.page)});load('relocare-geografica/index.html');</script></body></html>
